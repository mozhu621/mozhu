念和领会基金职业道德规范的根本目的在于践行基金职业道德。积极参加基金职业道德实践，是基金职业道德修养的有效途径。故“积极参加职业道德实践”正确。基金职业道德修养必须首先解决内在动力问题，也即必须正确树立基金职业道德观念，故“正确的基金职业道德观念是内在动力”正确。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":23,"origin":"资料模拟题","lesson":"a06","topic":"职业道德","core":false},{"id":"s1-31-32","subject":1,"stem":"以下做法，违反基金职业道德的是（ ）。","options":["基金公司对其管理的所有产品开展申购费打折活动","基金经理极度自信，认购200万元自己管理的基金","相同费率和服务下，基金公司将其新发产品托管在前期与其合作较多的银行","基金经理管理多只基金，其家属投资500万元申购了其中一只基金，基金经理只安排该基金进行新股申购，以提高投资业绩"],"answer":3,"explanation":"基金职业道德规范主要包括：守法合规、诚实守信、专业审慎、客户至上、忠诚尽责和保守秘密等\n\n。其中忠诚尽责要求从业人员在工作中做到两方面：一是忠诚廉洁；二是勤勉尽责。忠诚廉洁要求从业人员不得利用职务之便或者机构的商业机会为自己或者他人牟取非法利益。“基金经理管理多只基金，其家属投资\n500万元申购了其中一只基金，基金经理只安排该基金进行新股申购，以提高投资业绩”该基金经理违反了忠诚廉洁的要求。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":32,"origin":"资料模拟题","lesson":"a06","topic":"职业道德","core":false},{"id":"s1-31-36","subject":1,"stem":"对基金管理人的投资运作负有监督职责的机构有（ ）。","options":["基金托管人","中国反洗钱监测分析中心","基金销售机构","基金注册登记机构"],"answer":0,"explanation":"基金托管人的职责主要体现在基金资产保管、基金资金清算、会计复核以及对基金投资运作的监督等方面。在我国，基金托管人只能由依法设立并取得基金托管资格的商业银行或其他金融机构担任。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":36,"origin":"资料模拟题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-31-45","subject":1,"stem":"与公司型基金的股东大会赋予其基金投资者的权利相比，契约型基金持有人大会赋予其基金投资者的权利（ ）。","options":["相对较大","相对较小","基本一样","无法比较"],"answer":1,"explanation":"契约型基金与公司型基金主要有以下区别：\n（1）法律主体资格不同，契约型基金不具有法人资格，公司型基金具有法人资格。（2）投资者的地位不同，契约型基金依据基金合同成立。基金投资者尽管也可以通过持有人大会表达意见，但与公司型基金的股东大会相比，契约型基金持有人大会赋予基金持有者的权利相对较小。故“相对较小\n”正确。（3）基金组织方式和营运依据不同，公司型基金借用了《公司法》规定的股份有限公司的组织方式，其依据投资公司章程营运基金，设有股东会、董事会等决策监督机构，基金投资人通过股东会行使权利，设立董事会进行相关事务的决策与监督，基金管理人的身份是公司董事会聘请的投资顾问。契约基金借用了信托法律制度，依据基金合同营运基金，基金投资人和基金管理人、托管人之间是信托委托人、受托人和受益人的关系。基金投资人通过基金持有人大会行使权利。注意：目前，我国的基金均为契约型基金。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":45,"origin":"资料模拟题","lesson":"a01","topic":"基金基础","core":false},{"id":"s1-31-46","subject":1,"stem":"下列关于公募基金的投资与交易行为的限制，以下说法错误的是（ ）。","options":["不得向基金管理人出资","严格禁止基金的关联交易","不得承销证券","不得从事承担无限责任的投资"],"answer":1,"explanation":"依据《证券投资基金法》的规定，基金财产不得用于下列投资或者活动：\n①承销证券；②违反规定向他人贷款或者提供担保；③从事承担无限责任的投资；④买卖其他基金份额，但是中国证监会另有规定的除外；⑤向基金管理人、基金托管人出资；⑥从事内幕交易、操纵证券交易价格及其他不正当的证券交易活动；⑦法律、行政法规和中国证监会规定禁止的其他活动。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":46,"origin":"资料模拟题","lesson":"a01","topic":"基金基础","core":false},{"id":"s1-31-48","subject":1,"stem":"以下关于基金公司内部控制机制的定义表述正确的是（ ）。","options":["机构为了实现既定目标，防范和减少风险的发生，由全体成员共同参与，对内部机构组织业务流程进行全过程的介入和监控，采取权力分配、相互制衡手段，制定出完备的、制度保证的过程","明确权责体系，规范权力运作，促生内在制约力，形成科学有效的管理机制","强化责任管理、制度管理，规范控制行为","建立重大决策集体审批制度"],"answer":0,"explanation":"本题考查内部控制机制的含义。内部控制机制，简称内控机制，是指公司的内部组织结构及其相互之间的运作制约关系，即一个企业组织为了实现计划目标，防范和减少风险的发生，由全体员工共同参与，对内部组织机构业务流程进行全过程的介入和监控，采取权力分配、相互制衡手段，制定出系统的、制度保证的运行过程。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":48,"origin":"资料模拟题","lesson":"a17","topic":"监管与内控","core":false},{"id":"s1-31-51","subject":1,"stem":"封闭式基金折价率是指（ ）。","options":["（基金份额净值－单位市价）/单位市价","（基金份额净值－单位市价）/基金份额净值","基金份额净值/单位市价","单位市价/基金份额净值"],"answer":1,"explanation":"本题考查的是封闭式基金折价率。封闭式基金折价率是指封闭式基金的基金份额净值和单位市价之差与基金份额净值的比率。由公式表示为：折价率=（二级市场价格-基金份额净值）/基金份额净值\n×100%=（（二级市场价格/基金份额净值）-1）×100%。或者折价率=（基金份额净值-二级市场价格）/基金份额净值×100%=（1-（二级市场价格/基金份额净值））×100%。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":51,"origin":"资料模拟题","lesson":"a14","topic":"销售与适当性","core":false},{"id":"s1-31-52","subject":1,"stem":"内部环境是其他风险管理要素的基础，以下关于企业风险管理的内部环境要素所包含内容表述错误的是（ ）。","options":["经理层的风险偏好","管理层的理念和经营风格","员工的诚信、道德价值观和胜任能力","内部财务管理制度"],"answer":3,"explanation":"本题考查的是内部环境的概念及含义。基金管理人内部环境是其他所有风险管理要素的基础，为其他要素提供规则和结构，其中特别重要的是经理层的风险偏好。内部环境的要素包括：全体员工的诚信、道德价值观和胜任能力，管理层的理念和经营风格，管理层分配权力和划分责任、组织和开发其员工的方式，以及董事会给予的关注和指导。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":52,"origin":"资料模拟题","lesson":"a06","topic":"职业道德","core":false},{"id":"s1-31-53","subject":1,"stem":"私募基金的合格投资者需要提供金融资产证明材料，以下不属于金融资产的是（ ）。","options":["资产管理计划","股票基金、债券基金","房地产","银行存款、银行理财产品"],"answer":2,"explanation":"本题考查合格投资者的要求。合格投资者所持有的金融资产包括银行存款、股票、债券、基金份额、资产管理计划、银行理财产品、信托计划、保险产品、期货权益等。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":53,"origin":"资料模拟题","lesson":"a04","topic":"基金基础","core":false},{"id":"s1-31-56","subject":1,"stem":"基金公司合规管理的目标包括（ ）。\nⅠ、建立健全基金管理人合规风险管理体系\nⅡ、实现对合规风险的有效识别和管理\nⅢ、保证投研人员、特别是基金经理的稳定\nⅣ、确保基金管理人依法合规经营","options":["Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅳ","Ⅰ、Ⅱ、Ⅲ"],"answer":2,"explanation":"基金管理人的合规管理目标是建立健全基金管理人合规风险管理体系，实现对合规风险的有效识别和管理，促进基金管理人全面风险管理体系的建设，确保基金管理人依法合规经营。不包括保证相关业务岗位的稳定性。基金管理人应当建立良好的内部治理结构，明确股东会、董事会、监事会和高级管理人员的职责权限，确保基金管理人各部门的合规运作。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":56,"origin":"资料模拟题","lesson":"a16","topic":"监管与内控","core":false},{"id":"s1-31-61","subject":1,"stem":"投资者将托管在甲证券经营机构的LOF份额转托管到乙证券经营机构，属于（ ）的系统内转托管。","options":["场内到场外","场外到场内","场内到场内","场外到场外"],"answer":2,"explanation":"本题考查LOF份额转托管。系统内转托管是指投资者将托管在某证券经营机构的LOF份额转托管到其他证券经营机构（场内到场内），或将托管在某基金管理人或其代销机构的LOF份额转托管到其他基金代销机构或基金管理人（场外到场外）。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":61,"origin":"资料模拟题","lesson":"a04","topic":"基金基础","core":false},{"id":"s1-31-62","subject":1,"stem":"以下属于金融市场参与者，且在金融市场中具有支配性作用的是（ ）。","options":["中央银行","个人居民","金融机构","政府"],"answer":2,"explanation":"金融市场的参与者主要包括政府、中央银行、金融机构、个人和企业居民。其中，金融机构的作用较为特殊。首先，它是金融市场上最重要的中介机构，是储蓄转化为投资的重要渠道。其次，金融机构在金融市场上充当资金的供给者、需求者和中间人等多重角色，它既发行、创造金融工具，也在市场上购买各类金融工具；既是金融市场的中介人，也是金融市场的投资者、货币政策的传递者和承受者。最后，金融机构作为机构投资者在金融市场具有支配性的作用。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":62,"origin":"资料模拟题","lesson":"a02","topic":"基金基础","core":false},{"id":"s1-31-67","subject":1,"stem":"基金销售机构必须在高质量的服务、品牌的形象宣传等方面下功夫，以增强可靠的信誉，扩大客户基础。该表述体现了基金销售机构销售基金产品具有（ ）特点。","options":["服务性","持续性","适用性","专业性"],"answer":0,"explanation":"基金作为一种金融产品，其产品品质体现为基金的未来收益和营销人员的持续服务。因此，基金销售机构在注重产品、分销和促销的同时，还必须在高质量的服务、品牌的形象宣传等方面下功夫，以增强可靠的信誉，扩大客户基础。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":67,"origin":"资料模拟题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-31-68","subject":1,"stem":"以下行为属于广义基金监管的是（ ）。\nⅠ、基金机构内部监督部门对其活动的监督和管理\nⅡ、基金行业自律组织对基金市场，基金市场主体及其活动的监督和管理\nⅢ、独立的审计机构对基金市场主体及其活动的监督和管理\nⅣ、社会媒体对基金市场、基金市场主体及其活动的监督和管理","options":["Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅲ","Ⅰ、Ⅱ、Ⅳ"],"answer":1,"explanation":"狭义的基金监管一般专指政府基金监管机构依法对基金市场、基金市场主体及其活动的监督和管理。广义的基金监管是指有法定监管权的政府机构、基金行业自律组织、基金机构内部监督部门以及社会力量（如独立的审计机构、媒体）对基金市场、基金市场主体及其活动的监督或管理。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":68,"origin":"资料模拟题","lesson":"a15","topic":"监管与内控","core":false},{"id":"s1-31-69","subject":1,"stem":"关于资产管理行业的功能和作用，以下描述错误的是（ ）。","options":["资产管理行业能为市场经济体系有效配置资源","资产管理行业主要满足机构投资者的特定投资需求","资产管理行业有助于金融资产的合理定价","资产管理行业通过专业的管理活动能使投资和融资更加便利"],"answer":1,"explanation":"资产管理行业无论对宏观经济还是微观的个人、企业都有着重要的功能和作用：\n（1）资产管理行业能够为市场经济体系有效配置资源，使有限的资源配置到最有效率的产品和服务部门，提高整个社会经济的效率和生产服务水平。（2）通过资产管理行业专业的管理活动，能够帮助投资人搜集、处理各种和投资有关的宏观、微观信息，提供各类投资机会，帮助投资者进行投资决策，并提供决策的最佳执行服务，使投资融资更加便利。（3）资产管理行业创造十分广泛的投资产品和服务，满足投资者的各种投资需求，使资金的需求方和提供方能够便利地连接起来。而不是“主要满足机构投资者的特定投资需求”。（4）资产管理行业还能对金融资产进行合理定价，给金融市场提供流动性，降低交易成本，使金融市场更加健康有效，最终有利于一国经济的发展。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":69,"origin":"资料模拟题","lesson":"a02","topic":"基金基础","core":false},{"id":"s1-31-88","subject":1,"stem":"以下公司治理原则中，以实现公司长期价值增加为主要目的的是（ ）。","options":["长效激励约束原则","股东会、董事会、管理层协同高效、相互制衡原则","经营运作公开、透明原则","公平对待股东原则"],"answer":0,"explanation":"公司应当结合基金行业特点建立长效激励约束机制，同时营造规范、诚信、创新、和谐的企业文化，从而留住人才，保持公司的竞争能力。股东也应当尊重经理层人员及其他专业人员的人力资本价值。在法律法规允许的前提下，可以引入股权激励或员工持股机制，增强公司骨干团队的稳定性，使经营管理层、员工的利益与股东利益趋于一致，实现公司长期价值的增加。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":88,"origin":"资料模拟题","lesson":"a08","topic":"职业道德","core":false},{"id":"s1-31-89","subject":1,"stem":"投资者教育活动内容应包含（ ）。\nⅠ、权益保护教育\nⅡ、投资决策教育\nⅢ、资产配置教育\nⅣ、投资分析教育","options":["Ⅰ、Ⅲ、Ⅳ","Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅲ"],"answer":3,"explanation":"本题考查投资者教育的内容。投资者教育主要包含投资决策教育、资产配置教育和权益保护教育三个方面的内容。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":89,"origin":"资料模拟题","lesson":"a01","topic":"基金基础","core":false},{"id":"s1-31-91","subject":1,"stem":"投资人甲持有开放式基金，以下业务操作中属于基金转换业务的是（ ）。","options":["不采用申购、赎回，将投资人甲在B销售机构持有的A基金份额，转到C销售机构","不采用申购、赎回，将投资人甲持有的A基金份额，转为同一基金管理人管理的B基金份额","不采用申购、赎回，将A基金份额从投资人甲的基金账户，移到投资人乙的基金账户","采用申购、赎回，将投资人甲持有的A基金管理人管理的A基金份额，转为B基金管理人管理的B基金份额"],"answer":1,"explanation":"开放式基金份额的转换是指投资者不需要先赎回已持有的基金份额，就可以将其持有的基金份额转换为同一基金管理人管理的另一基金份额的一种业务模式。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":91,"origin":"资料模拟题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-31-94","subject":1,"stem":"关于投资者保护活动，以下做法最恰当的是（ ）。","options":["倡导追逐热点的投资理念","宣导投资获利的重要性","用专业的语言给投资者讲解投资中遇到的问题","告知投资者的权利和保护途径"],"answer":3,"explanation":"投资者保护，是指针对个人投资者所进行的有目的、有计划、有组织地传播有关投资知识，传授有关投资经验，培养有关投资技能，倡导理性的投资观念，提示相关的投资风险，告知投资者的权利和保护途径，提高投资者素质（并最终起到保护投资者利益的作用）的一项系统的社会活动。其手段就是用简单的语言向投资者解释他们在投资过程中所面临的各种问题以及应对措施。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":94,"origin":"资料模拟题","lesson":"a01","topic":"基金基础","core":false},{"id":"s1-31-97","subject":1,"stem":"关于基金管理公司的风险管理，投资者甲认为，风险管理限制了基金的投资，因此会降低基金业绩，损害基金份额持有人的利益；投资者乙认为，风险管理只是为了维护基金管理公司股东的利益，对基金份额持有人并没有影响。针对两位投资者的看法，下列判断正确的是（ ）。","options":["投资者甲的看法错误，投资者乙的看法正确","投资者甲的看法正确，投资者乙的看法正确","投资者甲的看法错误，投资者乙的看法错误","投资者甲的看法正确，投资者乙的看法错误"],"answer":2,"explanation":"“为充分保护基金份额持有人的利益”，促进公司和行业持续、健康、稳定发展，基金管理人应强化风险意识，增强风险防范能力，建立全面的风险管理体系。故投资者甲和乙的说法均错误。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":97,"origin":"资料模拟题","lesson":"a16","topic":"监管与内控","core":false},{"id":"s1-31-98","subject":1,"stem":"关于《证券投资基金法》对基金管理人从业人员配偶进行证券投资的规定，以下说法正确的是（ ）。","options":["基金管理人从业人员配偶可进行证券投资，应当事先向基金管理人申报","基金管理人从业人员配偶可进行证券投资，应当事后向基金管理人申报","基金管理人从业人员配偶禁止进行证券投资","基金管理人从业人员配偶可进行证券投资，应当事先向监管机构申报"],"answer":0,"explanation":"根据《证券投资基金法》第18条的规定，公开募集基金的基金管理人的董事、监事、高级管理人员及其他从业人员，其本人、配偶、利害关系人进行证券投资，应当事先向基金管理人申报，并不得与基金份额持有人发生利益冲突。公平对待客户，是指基金从业人员应当尊重所有客户并公平对待所有客户，不能因为基金份额多寡或者其他原因而厚此薄彼。公平对待客户要求基金从业人员在进行投资分析、提供投资建议、采取投资行动或从事其他专业活动时，应当公平地对待所有客户。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":98,"origin":"资料模拟题","lesson":"a15","topic":"监管与内控","core":false},{"id":"s3-63-4","subject":3,"stem":"根据中国证监会的规定，股权投资基金的合格投资者是指应具备相应风险识别能力和风险承担能力，投资于单只股权投资基金的金额不低于（ ）万元且符合相关标准的单位和个人。","options":["10","50","80","100"],"answer":3,"explanation":"根据中国证监会的规定，股权投资基金的合格投资者是指应具备相应风险识别能力和风险承担能力，投资于单只股权投资基金的金额不低于100万元且符合相关标准的单位和个人。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":4,"origin":"资料模拟题","lesson":"b07","topic":"募集与合规","core":false},{"id":"s3-63-5","subject":3,"stem":"对于我国来说，境外IPO市场不包括（ ）。","options":["香港证券交易所","美国纳斯达克证券交易所","纽约证券交易所","上海证券交易所"],"answer":3,"explanation":"对我国企业来说，境外IPO市场主要以香港证券交易所.美国纳斯达克证券交易所(NASDAQ).纽约证券交易所(NYSE)等市场为主。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":5,"origin":"资料模拟题","lesson":"b21","topic":"投后与退出","core":false},{"id":"s3-63-7","subject":3,"stem":"在企业上市流程中，企业（ ）是指企业以在资本市场公开发行和交易股票为目的而进行的企业组织结构\n.资本资产等方面的改组行为。","options":["改制","辅导","审核","上市"],"answer":0,"explanation":"在企业上市流程中，企业改制是指企业以在资本市场公开发行和交易股票为目的而进行的企业组织结构.资本资产等方面的改组行为。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":7,"origin":"资料模拟题","lesson":"b21","topic":"投后与退出","core":false},{"id":"s3-63-9","subject":3,"stem":"股权投资基金销售机构，应当为在（ ）注册取得基金销售业务资格并已成为中国证券投资基金业协会会员的机构。","options":["中国证监会","中国证券投资基金业协会","中国证券业协会","中国基金登记结算机构"],"answer":0,"explanation":"股权投资基金销售机构，应当为在中国证监会注册取得基金销售业务资格并已成为中国证券投资基金业协会会员的机构。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":9,"origin":"资料模拟题","lesson":"b08","topic":"募集与合规","core":false},{"id":"s3-63-10","subject":3,"stem":"区域性股权交易市场对促进企业特别是（ ）股权交易和融资，具有积极作用。","options":["中小微企业","合伙企业","居民企业","创业投资企业"],"answer":0,"explanation":"区域性股权交易市场是多层次资本市场的重要组成部分，对促进企业特别是中小微企业股权交易和融资，鼓励科技创新和激活民间资本，加强对实体经济薄弱环节的支持，具有积极作用。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":10,"origin":"资料模拟题","lesson":"b03","topic":"组织与治理","core":false},{"id":"s3-63-11","subject":3,"stem":"（ ）主要解决股权投资基金的项目来源问题。","options":["项目开发","起草承诺书","签署投资框架协议","投资交割"],"answer":0,"explanation":"项目开发主要解决股权投资基金的项目来源问题。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":11,"origin":"资料模拟题","lesson":"b01","topic":"组织与治理","core":false},{"id":"s3-63-12","subject":3,"stem":"在财务尽职调查中，对于资产负债表，重点核查公司（ ）。\nⅠ.货币资金\nⅡ.应收款项\nⅢ.坏账计提\nⅣ.存货周转","options":["Ⅰ.Ⅱ","Ⅰ.Ⅱ.Ⅲ","Ⅱ.Ⅲ.Ⅳ","Ⅰ.Ⅱ.Ⅲ.Ⅳ"],"answer":3,"explanation":"在财务尽职调查中，对于资产负债表，重点核查公司货币资金.应收款项.坏账计提.存货周转.对外投资.固定资产.无形资产.投资性房地产等资产项目的真实性，关注重要资产抵押情况.无形资产估值的合理性，核查对外担保等或有债务。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":12,"origin":"资料模拟题","lesson":"b10","topic":"尽调与估值","core":false},{"id":"s3-63-13","subject":3,"stem":"在基金托管的基本原则中，（ ）是指在协议约定的托管权限范围内，根据国家法律法规规定和基金合同的要求履行托管职责。","options":["合规性原则","保密性原则","独立性原则","安全性原则"],"answer":0,"explanation":"合规性原则是指在协议约定的托管权限范围内，根据国家法律法规规定和基金合同的要求履行托管职责。保密性原则：严守基金商业秘密，除法律法规及相关约定外，不得以任何形式泄露或公开基金资产的状况和投资运作情况。独立性原则：将基金资产与其他资产以及托管人自有资产严格分离保管，为基金单独建账.独立核算。安全性原则：妥善保管基金资产，在协议约定的范围内确保托管资产的安全和完整。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":13,"origin":"资料模拟题","lesson":"b25","topic":"收益与运营","core":false},{"id":"s3-63-14","subject":3,"stem":"（ ）在创业投资基金和并购基金中大量使用。","options":["相对估值法","成本法","清算价值法","经济增加值法"],"answer":0,"explanation":"作为常用企业估值方法之一，相对估值法使用可比价值对目标公司进行价值评估，在创业投资基金和并购基金中大量使用。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":14,"origin":"资料模拟题","lesson":"b12","topic":"尽调与估值","core":false},{"id":"s3-63-15","subject":3,"stem":"下列不属于基金管理人内部控制要素构成的是（ ）。","options":["内部环境","风险评估","控制活动","风险发现"],"answer":3,"explanation":"基金管理人内部控制的要素构成主要包括：①内部环境；②风险评估；③控制活动；④信息与沟通；⑤内部监督。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":15,"origin":"资料模拟题","lesson":"b09","topic":"募集与合规","core":false},{"id":"s3-63-18","subject":3,"stem":"在股权投资基金的分配中，（ ）是指在基金清算或其他约定时点，对已经分配的收益进行重新计算，如果基金投资者实际获得的收益率低于门槛收益率，或者收益分配比例不符合基金合同约定的，基金管理人需要将已经分得的部分或全部业绩报酬返还至基金资产，并分配给基金投资者。","options":["回拨机制","追赶机制","门槛收益率","瀑布式的收益分配体系"],"answer":0,"explanation":"回拨机制，是指在基金清算或其他约定时点，对已经分配的收益进行重新计算，如果基金投资者实际获得的收益率低于门槛收益率，或者收益分配比例不符合基金合同约定的，基金管理人需要将已经分得的部分或全部业绩报酬返还至基金资产，并分配给基金投资者。追赶机制，是指在向基金投资者分配投资本金及门槛收益之后，将剩余收益先行向基金管理人分配，直至达到门槛收益与当前“追赶”金额之和的既定比例，作为基金管理人的业绩报酬。按照上述方式完成“追赶”后，余下的收益再按照业绩报酬分配比例在基金投资者与基金管理人之间进行分配。在设置了门槛收益率条款的股权投资基金里，向全体基金投资者返还投资本金后，还应继续向基金投资者进行分配，直至投资者获得按照门槛收益率计算的投资回报(门槛收益\n)之后，才开始向基金管理人分配业绩报酬。股权投资基金的分配通常采用瀑布式的收益分配体系。具体是指，项目投资退出的资金先返还至基金投资者，当投资者收回全部投资本金后，再按照约定的门槛收益率(如有\n)向基金投资者分配门槛收益。上述步骤完成后，基金管理人才参与基金的收益分配。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":18,"origin":"资料模拟题","lesson":"b24","topic":"收益与运营","core":false},{"id":"s3-63-20","subject":3,"stem":"下列关于有限合伙企业各类合伙人的责任承担方式的说法，正确的是（ ）。","options":["普通合伙人对合伙企业债务承担无限连带责任","有限合伙人对合伙企业债务承担无限连带责任","普通合伙人以其认缴的出资额为限对合伙企业债务承担责任","有限合伙人和普通合伙人均以其认缴的出资额为限对合伙企业债务承担责任"],"answer":0,"explanation":"有限合伙企业由普通合伙人和有限合伙人组成，普通合伙人对合伙企业债务承担无限连带责任，有限合伙人以其认缴的出资额为限对合伙企业债务承担责任。有限合伙企业亏损分担方式由普通合伙人.有限合伙人在合伙协议中约定。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":20,"origin":"资料模拟题","lesson":"b03","topic":"组织与治理","core":false},{"id":"s3-63-21","subject":3,"stem":"下列关于合伙企业生产经营所得和其他所得采取“先分后税”的原则中，错误的是（ ）。","options":["合伙企业以每一个合伙人为纳税义务人，合伙企业层面不缴纳所得税","合伙企业合伙人是自然人的，缴纳个人所得税","合伙人是法人和其他组织的，缴纳企业所得税","合伙企业每一纳税年度的收入总额为生产经营所得"],"answer":3,"explanation":"根据《合伙企业法》等相关规定，合伙企业生产经营所得和其他所得采取“先分后税”的原则\n\n：①合伙企业以每一个合伙人为纳税义务人，合伙企业层面不缴纳所得税；②合伙企业合伙人是自然人的，缴纳个人所得税；③合伙人是法人和其他组织的，缴纳企业所得税；④合伙企业每一纳税年度的收入总额减除成本.费用以及损失后的余额，为生产经营所得。故D项说法错误。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":21,"origin":"资料模拟题","lesson":"b03","topic":"组织与治理","core":false},{"id":"s3-63-22","subject":3,"stem":"项目来源渠道多种多样，主要包括（ ）。\nⅠ.行业研究\nⅡ.中介机构推荐\nⅢ.行业专家推荐\nⅣ.政府机构推荐","options":["Ⅰ.Ⅱ.Ⅲ","Ⅱ.Ⅲ","Ⅱ.Ⅲ.Ⅳ","Ⅰ.Ⅱ.Ⅲ.Ⅳ"],"answer":3,"explanation":"项目开发主要解决股权投资基金的项目来源问题。项目来源渠道多种多样，主要包括：①行业研究\n：跟踪和研究国内外新技术的发展趋势以及资本市场的动态，通过资料调研.项目库推荐.访问企业等方式寻找项目信息；②中介机构推荐：包括律师.会计师.证券公司.商业银行.财务顾问等；③天使投资人或者同行推荐；④企业家联盟及各级商会组织推荐；⑤行业专家推荐；⑥政府机构推荐：如中国各地方政府金融办.上市办.各级高新技术开发区管委会等；⑦行业展会.创业计划大赛.创投论坛等。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":22,"origin":"资料模拟题","lesson":"b01","topic":"组织与治理","core":false},{"id":"s3-63-23","subject":3,"stem":"折现现金流估值法的估值步骤包括（ ）。\nⅠ.选择适用的折现现金流估值法\nⅡ.确定详细预测期数\nⅢ.计算详细预测期内的每期现金流\nⅣ.计算折现率","options":["Ⅱ.Ⅲ","Ⅰ.Ⅱ.Ⅲ","Ⅲ.Ⅳ","Ⅰ.Ⅱ.Ⅲ.Ⅳ"],"answer":3,"explanation":"折现现金流估值法的估值步骤包括：①选择适用的折现现金流估值法；②确定详细预测期数；③计算详细预测期内的每期现金流；④计算折现率；⑤计算终值；⑥对详细预测期现金流及终值进行折现并加总得到价值。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":23,"origin":"资料模拟题","lesson":"b14","topic":"尽调与估值","core":false},{"id":"s3-63-24","subject":3,"stem":"（ ）使股权投资基金可以在未来公司增加发行股份时，保护其股权比例不被稀释。","options":["第一拒绝权","优先认购权","拖售权","随售权"],"answer":1,"explanation":"优先认购权使股权投资基金可以在未来公司增加发行股份时，保护其股权比例不被稀释。第一拒绝权，是指目标公司的其他股东欲对外出售股权时，作为老股东的股权投资基金在同等条件下有优先购买权。随售权又称共同出售权，是指目标公司的其他股东欲对外出售股权时，股权投资基金有权以其持股比例为基础，以同等条件参与该出售交易。拖售权又称领售权.强卖权或强制出售权，是指如果有第三方向股权投资基金发出股权收购要约，且股权投资基金接受该要约，则其有权要求其他股东一起按照相同的出售条件和价格向该第三方转让股权。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":24,"origin":"资料模拟题","lesson":"b16","topic":"投资条款","core":false},{"id":"s3-63-26","subject":3,"stem":"关于私募基金管理人内部控制的作用，下列说法错误的是（ ）。","options":["保证管理人经营运作严格遵守国家有关法律法规和行业监管规则","提高经营管理效益","降低市场运行和基金运作的效率","保障股权投资基金财产的安全.完整"],"answer":2,"explanation":"管理人内部控制的作用包括：（1）保证管理人经营运作严格遵守国家有关法律法规和行业监管规则，自觉形成守法经营.规范运作的经营思想和经营理念。（2）管理经营风险，提高经营管理效益，确保经营业务的稳健运行，实现持续.稳定.健康发展。（3）保障股权投资基金财产的安全.完整。（4）确保基金和基金管理人的财务和其他信息真实.准确.完整.及时。基金管理人内部控制是一个动态的系统工程。尤其是在互联网时代，信息传递的速度惊人，基金及其管理人的财务信息可能对基金管理人和基金投资者产生影响的速度和频率都将大幅提高，内部控制可以大大提高市场运行和基金运作的效率。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":26,"origin":"资料模拟题","lesson":"b04","topic":"组织与治理","core":false},{"id":"s3-63-27","subject":3,"stem":"普通合伙企业的协议未约定利润分配和亏损分担比例，如果协商不成且无法确定实缴出资比例的，其利润分配和亏损分担的原则是（ ）。","options":["由各合伙人平均分配利润和分担亏损","按各合伙人实际出资比例分配利润和分担亏损","按各合伙人认缴出资比例分配利润和分担亏损","按各合伙人对合伙企业的贡献大小分配利润和分担亏损"],"answer":0,"explanation":"合伙型基金在进行收益分配时，《合伙企业法》规定，“合伙企业的利润分配.亏损分担，按照合伙协议的约定办理；合伙协议未约定或者约定不明确的，由合伙人协商决定；协商不成的，由合伙人按照实缴出资比例分配.分担；无法确定出资比例的，由合伙人平均分配.分担”。在实务中，合伙型基金的收益分配原则.时点和顺序也通常根据股权投资业务中投资者和管理人的需求进行适应性安排。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":27,"origin":"资料模拟题","lesson":"b03","topic":"组织与治理","core":false},{"id":"s3-63-28","subject":3,"stem":"股权投资基金的募集方式包括（ ）","options":["自行募集和委托募集","直接募集和受托募集","自行募集和直接募集","委托募集和受托募集"],"answer":0,"explanation":"股权投资基金的募集，可分为自行募集和委托募集。自行募集是指基金管理人直接募集其管理的基金，委托募集是指基金管理人委托第三方机构代为募集基金。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":28,"origin":"资料模拟题","lesson":"b08","topic":"募集与合规","core":false},{"id":"s3-63-32","subject":3,"stem":"大学基金会是国外股权投资基金重要的机构投资者，其资金主要来源于（ ）。","options":["股权融资","社会捐赠","政策性补助","金融租赁"],"answer":1,"explanation":"大学基金会是国外股权投资基金重要的机构投资者，其资金主要来源于社会捐赠。大学基金会起源于欧美，其中又以美国的大学基金会最为典型。作为非营利基金会，大学基金会为了保持学校的运作而设立，其流动性需求不强，可以进行相对长期的投资，是稳定的机构投资者。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":32,"origin":"资料模拟题","lesson":"b01","topic":"组织与治理","core":false},{"id":"s3-63-33","subject":3,"stem":"终值倍数法假设在详细预测期（ ）将目标公司出售，出售时的价格即为终值。","options":["第一期的期初","第一期的期末","最后一期的期初","最后一期的期末"],"answer":3,"explanation":"终值倍数法假设在详细预测期最后一期的期末将目标公司出售，出售时的价格即为终值，常用详细预测期最后一期的某个指标的倍数来估算终值，即使用相对估值法。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":33,"origin":"资料模拟题","lesson":"b14","topic":"尽调与估值","core":false},{"id":"s3-63-34","subject":3,"stem":"尽职调查的作用是（ ）。\nⅠ.价值发现\nⅡ.风险发现\nⅢ.投资决策辅助\nⅣ.价格发现","options":["Ⅱ.Ⅲ.Ⅳ","Ⅰ.Ⅱ.Ⅲ","Ⅰ.Ⅱ.Ⅳ","Ⅰ.Ⅲ"],"answer":1,"explanation":"尽职调查的作用，一是价值发现，帮助投资方判断目标公司是否值得投资并获取项目估值所需信息；二是风险发现，通过获取目标公司的真实信息，识别和评估目标公司的主要风险，降低信息不对称可能带来的问题；三是投资决策辅助，依据尽职调查中发现的目标公司的特点和风险，帮助投资方在投资条款谈判\n.投资后管理重点内容.项目退出方式选择等方面的决策提供依据。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":34,"origin":"资料模拟题","lesson":"b10","topic":"尽调与估值","core":false},{"id":"s3-63-35","subject":3,"stem":"在协议约定的托管权限范围内，根据国家法律法规规定和基金合同的要求履行托管职责属于基金托管的（ ）。","options":["保密性原则","合规性原则","安全性原则","独立性原则"],"answer":1,"explanation":"合规性原则：在协议约定的托管权限范围内，根据国家法律法规规定和基金合同的要求履行托管职责。保密性原则：严守基金商业秘密，除法律法规及相关约定外，不得以任何形式泄露或公开基金资产的状况和投资运作情况。安全性原则：妥善保管基金资产，在协议约定的范围内确保托管资产的安全和完整。独立性原则：将基金资产与其他资产以及托管人自有资产严格分离保管,为基金单独建账.独立核算。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":35,"origin":"资料模拟题","lesson":"b25","topic":"收益与运营","core":false},{"id":"s3-63-40","subject":3,"stem":"下列关于合伙型基金的说法中，正确的有（ ）。\nⅠ.基金的投资者以有限合伙人的身份存在，汇集股权投资所需的大部分资金，以其认缴的出资额为限对合伙企业债务承担责任\nⅡ.有限合伙人不执行合伙事务，不得对外代表有限合伙企业\nⅢ.普通合伙人对合伙企业的债务承担无限连带责任，并负责合伙企业事务的执行，合伙企业投资与资产处置的最终决策应由普通合伙人作出\nⅣ.在实际操作中，通常作为基金合伙事务实际执行者的基金管理人机构，往往会设立承担有限责任的子公司充当基金的普通合伙人","options":["Ⅰ.Ⅱ.Ⅲ.Ⅳ","Ⅰ.Ⅱ.Ⅲ","Ⅰ.Ⅱ.Ⅳ","Ⅱ.Ⅲ.Ⅳ"],"answer":0,"explanation":"对合伙型基金而言，基金的投资者以有限合伙人的身份存在，汇集股权投资所需的大部分资金，以其认缴的出资额为限对合伙企业债务承担责任，有限合伙人不执行合伙事务，不得对外代表有限合伙企业。普通合伙人对合伙企业的债务承担无限连带责任，并负责合伙企业事务的执行，合伙企业投资与资产处置的最终决策应由普通合伙人作出。但是，在实际操作中，通常作为基金合伙事务实际执行者的基金管理人机构，往往会设立承担有限责任的子公司充当基金的普通合伙人。合伙型基金通常会设置合伙人会议，但合伙人会议的职责与公司型基金中股东大会(股东会)的职责有着明显的差别。股东大会(股东会)是公司的权力机构，合伙人会议则更多的是审议诸如合伙人入伙与退伙.合伙人份额转让.合伙企业审计机构聘任等事项，有限合伙人不得通过合伙人会议直接或间接参与合伙企业事务的执行。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":40,"origin":"资料模拟题","lesson":"b03","topic":"组织与治理","core":false},{"id":"s3-63-41","subject":3,"stem":"下列有关股权投资基金的财产保管和基金托管，表述错误的是（ ）。","options":["一般来说，公募基金采取强制托管，基金托管人必然成为基金当事人之一","基金资产保管不同于基金托管","在不选择托管而仅选择保管的情况下，基金资产保管机构作为基金份额持有人的代理人，对基金资产承担保管责任","私募类型的股权投资基金，通常由基金投资者和基金管理人约定是否进行托管"],"answer":2,"explanation":"基金资产保管不同于基金托管。在选择托管的情况下，管理人和托管人对投资者同时承担双重受托责任。在不选择托管而仅选择保管的情况下，基金资产保管机构作为基金管理人的代理人，对基金资产承担保管责任。C选项错误。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":41,"origin":"资料模拟题","lesson":"b25","topic":"收益与运营","core":false},{"id":"s3-63-42","subject":3,"stem":"下列关于信托(契约)型基金的表述，错误的是（ ）。","options":["信托(契约)型股权投资基金是指通过订立信托契约的形式设立的股权投资基金","信托(契约)型基金具有独立的法人地位","信托(契约)型基金本质上是一种信托关系，契约各方可通过信托契约进行相关约定，运作比较灵活","信托(契约)型基金的投资者以其出资为限对基金的债务承担有限责任"],"answer":1,"explanation":"信托(契约)型基金不具有独立的法人地位。B项错误。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":42,"origin":"资料模拟题","lesson":"b02","topic":"组织与治理","core":false},{"id":"s3-63-44","subject":3,"stem":"某股权投资基金投资了A.B两个项目，投资者对A项目的投资本金为500万元，对B项目的投资本金为600万元，基金合同约定投资者门槛收益率为20％，投资者与管理人分配比例为4：1，对基金管理人业绩报酬设置\n20％的回拨机制。A.B两个项目存续1年，现拟进行清算退出，A项目退出剩余资产为900万元，B项目退出剩余资产为500万元。若按基金进行分配，基金管理人获得的业绩报酬为（ ）万元。","options":["26","16","64","60"],"answer":1,"explanation":"按基金进行分配，是投后的所有资金返还投资者全部投资本金及门槛收益后，基金管理人才参与超额收益的分配。即：(900+500)-(600+500)=300(万元)，投资者门槛收益：1100×20％=220(万元)，则超额收益：300-220=80(万元)，基金管理人业绩报酬为80×1／(1+4)=16(万元)。故本题选B。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":44,"origin":"资料模拟题","lesson":"b24","topic":"收益与运营","core":false},{"id":"s3-63-46","subject":3,"stem":"政府引导基金通常通过引导社会资金进入创业投资领域的方式支持“创新创业”，下列关于政府引导基金的描述错误的是（ ）。","options":["政府引导基金的宗旨是发挥财政资金的杠杆放大效应","政府引导基会的投资方向具有一定的导向性","政府引导基金是按非市场化方式运作的政策性基金","政府引导基金的资金来源是政府财政出资"],"answer":2,"explanation":"本题考察政府引导基金的定义。政府引导基金是由政府财政出资设立并按市场化方式运作的.在投资方向上具有一定导向性的政策性基金。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":46,"origin":"资料模拟题","lesson":"b06","topic":"组织与治理","core":false},{"id":"s3-63-49","subject":3,"stem":"当前股权价值=退出时的股权价值／目标回报倍数=退出时的股权价值／(1+目标收益率)^n是（ ）的计算公式。","options":["创业投资估值法","终值倍数法","折现现金流估值法","相对估值法"],"answer":0,"explanation":"当前股权价值=退出时的股权价值／目标回报倍数=退出时的股权价值／(1+目标收益率)^n是创业投资估值法的计算公式。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":49,"origin":"资料模拟题","lesson":"b14","topic":"尽调与估值","core":false},{"id":"s3-63-50","subject":3,"stem":"下列关于有限合伙人出资的说法中，正确的是（ ）。","options":["有限合伙人只能以货币出资","有限合伙人可以用货币出资，也可以用劳务出资","有限合伙人不得以劳务出资","有限合伙人不能用其知识产权作价出资"],"answer":2,"explanation":"《中华人民共和国合伙企业法》第六十四条规定，有限合伙人可以用货币.实物.知识产权.土地使用权或者其他财产权利作价出资。有限合伙人不得以劳务出资。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":50,"origin":"资料模拟题","lesson":"b03","topic":"组织与治理","core":false},{"id":"s3-63-51","subject":3,"stem":"合伙型基金可以由自任基金管理人的（ ）负责基金投资等重大事项的管理与决策，执行合伙事务。","options":["普通合伙人","指定合伙人","任一合伙人","有限合伙人"],"answer":0,"explanation":"受普通合伙人委托的基金管理人或自任基金管理人的普通合伙人负责基金投资等重大事项的管理与决策，对有限合伙企业的责任是执行合伙事务。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":51,"origin":"资料模拟题","lesson":"b03","topic":"组织与治理","core":false},{"id":"s3-63-54","subject":3,"stem":"股权投资基金的组织形式不包括（ ）。","options":["合伙型","公司型","信托(契约)型","公私合营型"],"answer":3,"explanation":"根据组织形式不同，股权投资基金可以分为公司型基金.合伙型基金和信托(契约)型基金。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":54,"origin":"资料模拟题","lesson":"b03","topic":"组织与治理","core":false},{"id":"s3-63-57","subject":3,"stem":"关于股权投资基金选择第三方基金销售机构(代销机构)进行委托募集，合格代销机构应具备的条件是（ \n）。\nⅠ.代销机构需要是有代销意愿的基金管理人\nⅡ.代销机构需遵守募集行为管理办法的规定\nⅢ.代销机构应具有基金销售资格\nⅣ.代销机构需成为中国证券投资基金业协会会员","options":["Ⅰ.Ⅱ","Ⅱ.Ⅲ.Ⅳ","Ⅰ.Ⅱ.Ⅲ.Ⅳ","Ⅰ.Ⅱ.Ⅲ"],"answer":1,"explanation":"委托第三方机构募集的，基金管理人应当委托具有合格基金销售资质和专业基金销售服务团队的机构代为募集，并与代销机构签署书面协议，要求其严格遵守合格投资者制度和募集规定，履行对投资者的评估和投资者风险确认程序。目前，我国要求代销机构应获得中国证监会基金销售业务资格且成为中国证券投资基金业协会会员。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":57,"origin":"资料模拟题","lesson":"b08","topic":"募集与合规","core":false},{"id":"s3-63-58","subject":3,"stem":"下列关于股权投资基金的说法中，正确的是（ ）。","options":["在我国只能非公开募集","投资期限较短","主要投资于公开发行和交易的股票","通常具有低风险.高预期收益的特点"],"answer":0,"explanation":"在国际市场上，股权投资基金既有以非公开方式募集(私募)的，也有以公开方式募集(公募)的。在我国，目前股权投资基金尚只能以非公开方式募集。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":58,"origin":"资料模拟题","lesson":"b08","topic":"募集与合规","core":false},{"id":"s3-63-63","subject":3,"stem":"目前，我国要求代销机构应获得（ ）基金销售业务资格且成为中国证券投资基金业协会会员。","options":["中国证监会","中国证券投资基金业协会","基金管理公司","基金登记结算机构"],"answer":0,"explanation":"目前，我国要求代销机构应获得中国证监会基金销售业务资格且成为中国证券投资基金业协会会员。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":63,"origin":"资料模拟题","lesson":"b08","topic":"募集与合规","core":false},{"id":"s3-63-64","subject":3,"stem":"在项目估值中，不属于乘数法的可比指标的是（ ）。","options":["市盈率","市净率","市销率","市价"],"answer":3,"explanation":"乘数法主要通过分析可比公司的交易和营运系统数据得到该公司在公开的资本市场的隐含价值。主要使用的可比指标包括：市盈率.市销率.市净率等。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":64,"origin":"资料模拟题","lesson":"b12","topic":"尽调与估值","core":false},{"id":"s3-63-65","subject":3,"stem":"关于财务尽职调查，表述正确的是（ ）。\nⅠ.财务尽职调查重点关注标的企业当前的财务业绩情况\nⅡ.财务尽职调查团队应收集目标公司相关的财务报告及相关支持材料，了解其会计政策及相关会计假设，进行财务比率分析，重点考察企业的现金流.盈利及资产事项\nⅢ.如公司报告期内存在会计政策或会计估计变更，重点核查变更内容.理由及对公司财务状况.经营成果的影响\nⅣ.不同于审计，财务尽职调查强调发现企业的投资价值和潜在风险","options":["Ⅱ.Ⅲ.Ⅳ","Ⅱ.Ⅳ","Ⅰ.Ⅱ","Ⅰ.Ⅱ.Ⅲ"],"answer":0,"explanation":"财务尽职调查重点关注目标公司的历史财务业绩情况，并对企业未来财务状况进行合理预测。财务尽职调查团队应收集目标公司相关的财务报告及相关支持材料，了解其会计政策及相关会计假设，进行财务比率分析，重点考察企业的现金流.盈利及资产事项。财务尽职调查不同于审计，财务尽职调查强调发现企业的投资价值和潜在风险，注重对企业未来价值和成长性的合理预测，经常采用趋势分析和结构分析工具，在财务预测中经常会用到场景分析和敏感度分析等方法。如公司报告期内存在会计政策或会计估计变更，重点核查变更内容.理由及对公司财务状况.经营成果的影响。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":65,"origin":"资料模拟题","lesson":"b10","topic":"尽调与估值","core":false},{"id":"s3-63-67","subject":3,"stem":"下列关于资金募集过程中投资者行为的表述，正确的是（ ）。","options":["投资者应当如实填写风险识别能力和承担能力问卷，但无需告知具体资产和收入情况","合格投资者可以通过多人拼凑等方式满足投资者的最低投资限额需求","投资者可以针对股权投资基金风险评级要求，调整所填写的风险识别能力和风险承担能力问卷","投资者填写虚假信息或者提供虚假承诺文件的，应承担相应责任"],"answer":3,"explanation":"投资者应当如实填写风险识别能力和承担能力问卷，如实承诺告知资产或者收入情况，并对其真实性.准确性和完整性负责。填写虚假信息或者提供虚假承诺文件的，应当承担相应责任。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":67,"origin":"资料模拟题","lesson":"b07","topic":"募集与合规","core":false},{"id":"s3-63-69","subject":3,"stem":"某股权投资基金管理人根据风险评估结果，采用相应的控制措施，将风险控制在可承受范围之内，突出体现的内部控制构成要素是（ ）。","options":["内部环境","控制活动","风险评估","内部监督"],"answer":1,"explanation":"控制活动是指根据风险评估结果，采用相应的控制措施，将风险控制在可承受范围之内。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":69,"origin":"资料模拟题","lesson":"b09","topic":"募集与合规","core":false},{"id":"s3-63-70","subject":3,"stem":"下列不属于股权投资基金管理人禁止性行为的是（ ）。","options":["在不损害投资者利益的前提下，将投资活动中知悉的被投资企业未公开信息提供给第三方使用","用其管理的不同的基金在不同的时点以不同的价格投资于同一家被投资企业","将管理人自有财产与基金财产混在一起进行投资","临时用基金财产偿还管理人债务，事后连本带息归还"],"answer":1,"explanation":"股权投资基金管理人不得将其固有财产或者他人财产混同于基金财产从事投资活动，不得泄露因职务便利获取的未公开信息，不得未针对每只股权投资基金设置独立账户，或者开展借新还旧.期限错配等业务。不得侵占.挪用基金财产。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":70,"origin":"资料模拟题","lesson":"b04","topic":"组织与治理","core":false},{"id":"s3-63-72","subject":3,"stem":"关于股权投资基金收益分配中的门槛收益，下列说法正确的是（ ）。","options":["基金应先向管理人支付业绩报酬，再向投资人分配门槛收益","当投资人收回全部投资本金后，再进行门槛收益的分配","所有股权投资基金均应在合同中约定门槛收益率","管理人应保证投资人实现门槛收益"],"answer":1,"explanation":"在设置了门槛收益率条款的股权投资基金里，向全体基金投资者返还投资本金后，还应继续向基金投资者进行分配，直至投资者获得按照门槛收益率计算的投资回报(门槛收益)之后，才开始向基金管理人分配业绩报酬。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":72,"origin":"资料模拟题","lesson":"b24","topic":"收益与运营","core":false},{"id":"s3-63-73","subject":3,"stem":"股权投资基金与被投资企业签署的投资协议中，保护性条款是为了保护（ ）的利益。","options":["股权投资基金","公司管理层","公司原股东","公司员工"],"answer":0,"explanation":"保护性条款是指股权投资基金为保护自身利益而设置的要求目标公司在执行某些可能损害投资者利益或对投资者利益有重大影响的行为时，需取得投资者同意的条款。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":73,"origin":"资料模拟题","lesson":"b18","topic":"投资条款","core":false},{"id":"s3-63-75","subject":3,"stem":"市场不是万能的，存在市场失灵，需要政府干预，但如果政府干涉过多，可能导致市场主体丧失自由，甚至会导致整个行业的发展脱离其内在规律，所以股权投资基金的监管要秉承（ ）原则。","options":["审慎监管","分类监管","适度监管","高效监管"],"answer":2,"explanation":"市场失灵要求政府干预，但现代市场经济的政府干预应是“适度”的干预，即政府监管应适度。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":75,"origin":"资料模拟题","lesson":"b04","topic":"组织与治理","core":false},{"id":"s3-63-83","subject":3,"stem":"股权投资基金在运作过程中会进行收集.项目初审.尽职调查.投资决策与协议签署等活动，以上活动属于（ ）阶段。","options":["项目退出","投资后管理","募集与设立","投资"],"answer":3,"explanation":"D项正确，在投资阶段，基金管理机构将资金投向被投资企业。这一阶段主要包括项目开发与初审\n.立项.签署投资备忘录.尽职调查.投资决策.签订投资协议.投资交割等环节。A选项，在退出阶段，股权投资基金将其在被投资企业中的股权以上市.挂牌转让.协议转让.清算等形式变现，从而“退出”其在企业中的投资，然后根据约定将退出所得分配给基金的投资者和管理人。B选项，在投资后管理阶段，基金管理机构一方面对被投资企业的运作进行一定的跟踪与监控，实施投资风险管理；另一方面也会以各种方式向被投资企业提供增值服务，帮助被投资企业成长和发展。C选项，在募集阶段，基金管理人向投资者募集资金并发起设立基金。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":83,"origin":"资料模拟题","lesson":"b10","topic":"尽调与估值","core":false},{"id":"s3-63-84","subject":3,"stem":"关于中国证监会及其派出机构对股权投资基金的政府监管，下列说法错误的是（ ）。","options":["中国证监会及其派出机构依法对股权投资基金业务活动实施监督管理","股权投资基金的政府监管相对于行业自律.内部控制和社会力量监督，具有法定性和强制性特征","中国证监会及其派出机构应当制定和实施基金行业自律规则","中国证监会及其派出机构依法对违法违规行为进行查处"],"answer":2,"explanation":"制定和实施基金行业自律规则是中国证券投资基金业协会的工作职责。C选项错误。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":84,"origin":"资料模拟题","lesson":"b04","topic":"组织与治理","core":false},{"id":"s3-63-87","subject":3,"stem":"下列关于二手资料收集的步骤，正确的是（ ）。","options":["寻找信息源；辨别所需的信息；收集二手资料；资料筛选；资料整理","辨别所需的信息；寻找信息源；收集二手资料；资料筛选；资料整理","寻找信息源；收集二手资料；辨别所需的信息；资料筛选；资料整理","辨别所需的信息；收集二手资料；寻找信息源；资料筛选；资料整理"],"answer":1,"explanation":"二手资料收集的步骤是：辨别所需的信息；寻找信息源；收集二手资料；资料筛选；资料整理。故本题选B。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":87,"origin":"资料模拟题","lesson":"b10","topic":"尽调与估值","core":false},{"id":"s3-63-88","subject":3,"stem":"外币股权投资基金在投资过程中，通常在（ ）设立特殊目的公司作为受资对象，并在（ ）完成项目的投资退出。","options":["境内；境外","境外；境内","境内；境内","境外；境外"],"answer":3,"explanation":"外币股权投资基金在投资过程中，通常在境外设立特殊目的公司作为受资对象，并在境外完成项目的投资退出。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":88,"origin":"资料模拟题","lesson":"b21","topic":"投后与退出","core":false},{"id":"s3-63-89","subject":3,"stem":"以下有关基金资产净值的计算公式中，正确的是（ ）。","options":["基金资产净值=基金资产-基金所有者权益","基金资产净值=基金资产+基金负债","基金资产净值=基金资产／基金总份额","基金资产净值=项目价值总和+其他资产价值-基金费用等负债"],"answer":3,"explanation":"目前行业较为常用的对股权投资基金进行估值的方式，是先根据估值方法确定基金投资的每一个单一投资项目的价值及项目价值总和，加上基金持有的其他资产价值，再扣减基金应承担的费用等负债，最终得到基金资产净值，用公式表示为：基金资产净值=项目价值总和+其他资产价值-基金费用等负债。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":89,"origin":"资料模拟题","lesson":"b25","topic":"收益与运营","core":false},{"id":"s3-63-92","subject":3,"stem":"股权投资基金自行募集机构是指（ ）。","options":["证券公司","基金销售机构","基金管理人","基金托管机构"],"answer":2,"explanation":"股权投资基金的募集，可分为自行募集和委托募集。自行募集是指基金管理人直接募集其管理的基金，委托募集是指基金管理人委托第三方机构代为募集基金。受托募集的第三方机构就是基金销售机构，为基金管理人提供推介基金.发售基金份额.办理基金份额认缴.退出等募集服务。故本题选C。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":92,"origin":"资料模拟题","lesson":"b08","topic":"募集与合规","core":false},{"id":"s3-63-96","subject":3,"stem":"某股权投资基金拟投资互联网金融行业公司，预计三年后该基金退出时公司的销售收入为10亿元，销售成本为4亿元，市销率倍数为5倍，如该基金目标收益率为50%，则公司当前股权价值为（ ）亿元。","options":["33.3","20","8.9","14.8"],"answer":3,"explanation":"本题考查的是市销率倍数法的计算。市销率倍数=股权价值/销售收入，根据题目数据可得：股权估值×(1+50%)×(1+50%)×(1+50%)=10亿元销售收入×5倍市销率。计算可得股权估值为14.8亿元。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":96,"origin":"资料模拟题","lesson":"b13","topic":"尽调与估值","core":false},{"id":"s3-63-97","subject":3,"stem":"投资机构持有G公司25%的股权并享有常见股东权利，其余股权由投资创始人团队持有，现创始人团队欲向新股权投资机构T出售其持有的25%的股权，如果投资机构也向T出售其持有的部分股权，则可以选择行使（ \n）。","options":["随售权条款","第一拒绝权条款","回售权条款","反摊薄条款"],"answer":0,"explanation":"本题考查的是随售权条款的基本运用。随售权又称共同出售权，是指目标公司的其他股东欲对外出售股权时，股权投资基金有权以其持股比例为基础，以同等条件参与该出售交易。故现创始人团队欲向新股权投资机构T出售其持有的25%的股权，如果投资机构也向T出售其持有的部分股权，则可以选择行使随售权条款。第一拒绝权，是指目标公司的其他股东欲对外出售股权时，作为老股东的股权投资基金在同等条件下有优先购买权。回售权条款，是指满足协议约定的特定触发条件时，股权投资基金有权将其持有的全部或部分目标公司股权以约定的价格卖给目标公司创始股东或创始股东指定的其他相关利益方。反摊薄条款也称为反稀释条款，本质上是一种价格保护机制，适用于后轮融资为降价融资时，用于保护前轮投资者利益的条款。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":97,"origin":"资料模拟题","lesson":"b16","topic":"投资条款","core":false},{"id":"s3-63-100","subject":3,"stem":"基金合同中关于基金利润分配的内容是（ ）。","options":["投资期限","回拨机制","管理费分配比例","历史业绩"],"answer":1,"explanation":"业绩报酬机制是对股权投资基金管理人的重要激励措施,因此以业绩报酬机制为核心的利润分配条款通常成为募集谈判的重要条款，可能包括收益分配方式.门槛收益率.追赶方式.业绩报酬比例.回拨机制等内容。","sourceId":63,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","sourceNumber":100,"origin":"资料模拟题","lesson":"b24","topic":"收益与运营","core":false},{"id":"s3-64-1","subject":3,"stem":"关于股权投资基金选择第三方基金销售机构（代销机构）进行委托募集，合格代销机构的要求是（ ）。\nⅠ、代销机构是需要有代销意愿的基金管理人；\nⅡ、代销机构需遵循募集行为管理办法的规定；\nⅢ、代销机构应具有基金销售资质；\nⅣ、代销机构需成为中国证券投资基金业协会会员","options":["Ⅰ、Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅲ","Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ"],"answer":2,"explanation":"Ⅰ项说法错误，代销机构主要是有资格的第三方基金销售机构。\nⅡ项说法正确，基金管理人应当委托具有合格基金销售资质和专业基金销售服务团队的机构代为募集，并与代销机构签署书面协议，要求其严格遵守合格投资者制度和募集规定，履行对投资者的评估和投资者风险确认程序。\nⅢ、Ⅳ项说法正确，目前，我国要求代销机构应获得中国证监会基金销售业务资格且成为中国证券投资基金业协会会员。综上，Ⅱ、Ⅲ、Ⅳ项符合题意。故本题选C选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":1,"origin":"资料模拟题","lesson":"b08","topic":"募集与合规","core":false},{"id":"s3-64-3","subject":3,"stem":"股权投资基金募集流程中的以下（部分）程序按时间顺序排列正确的是（ ）。\nⅠ、基金风险揭示；\nⅡ、投资冷静期；\nⅢ、合格投资者确认；\nⅣ、投资者适当性匹配","options":["Ⅳ、Ⅰ、Ⅲ、Ⅱ","Ⅲ、Ⅰ、Ⅳ、Ⅱ","Ⅰ、Ⅱ、Ⅲ、Ⅳ","Ⅲ、Ⅳ、Ⅰ、Ⅱ"],"answer":0,"explanation":"目前，我国要求包括股权投资基金在内的各类私募基金在募集中需履行的程序按时间排列为:\n（1）特定对象确定;\n（2）投资者适当性匹配;（Ⅳ）（3）基金风险提示;（Ⅰ）（4）合格投资者确认;（Ⅲ）（5）投资冷静期;（Ⅱ）（6）回访确认。按时间顺序排列为Ⅳ、Ⅰ、Ⅲ、Ⅱ。故本题选A选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":3,"origin":"资料模拟题","lesson":"b07","topic":"募集与合规","core":false},{"id":"s3-64-4","subject":3,"stem":"国内A股ⅠPO市场不包括（ ）。","options":["中小板","科创板","创业板","全国中小企业股份转让系统"],"answer":3,"explanation":"境内ⅠPO市场包括主板、中小企业板、创业板和科创板。故本题选D选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":4,"origin":"资料模拟题","lesson":"b01","topic":"组织与治理","core":false},{"id":"s3-64-7","subject":3,"stem":"关于估值调整条款，表述错误的是（ ）。","options":["估值调整条款的触发条件是指目标公司的实际业绩已达到事先约定的业绩目标","估值调整条款通常约定，在一定期限之后如果企业未能完成一定指标，将对投资者按规定进行补偿","估值主要依据公司当时的经营业绩以及对未来经营业绩的预测做出，具有一定的风险性","估值调整条款的主要目的是用来弥补投资者因企业实际价值降低而蒙受的损失"],"answer":0,"explanation":"A选项说法错误，估值调整机制的触发条件包括目标公司的实际业绩未达到事先约定的业绩目标;发生特定事件（如公司未在约定时间前实现ⅠPO、原大股东失去控股地位、高管严重违反约定等）。故本题选A选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":7,"origin":"资料模拟题","lesson":"b18","topic":"投资条款","core":false},{"id":"s3-64-8","subject":3,"stem":"关于股权投资基金的投资后管理，表述正确的是（ ）。","options":["良好的投资后管理不会有利于消除潜在的投资风险","投资后管理对投资项目的发展与退出方案的实现不产生影响","投资后管理的优劣几乎不会影响投资的保值增值","在项目实施投资后直到项目退出之前都属于投资后管理阶段"],"answer":3,"explanation":"A、B、C选项说法错误，投资后管理关系到投资项目的发展和退出方案的实现，良好的投资后管理将会从主动层面减少或消除潜在的投资风险，实现投资的保值增值。\nD选项说法正确，在完成项目尽调并实施投资后直到项目退出之前都属于投资后管理期间。故本题选D选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":8,"origin":"资料模拟题","lesson":"b20","topic":"投后与退出","core":false},{"id":"s3-64-12","subject":3,"stem":"企业上市后股权锁定期设置的目的在于（ ）。","options":["发行企业主动提升投资者信心","提高退出实现的收益率水平","保护中小投资者","提高退出节奏的计划性"],"answer":2,"explanation":"A选项不符合题意，锁定期分为强制锁定和自愿锁定。强制锁定是指法律法规或交易所规则规定的关于股份锁定的规则。例如，我国《公司法》规定，公司公开发行股份前已经发行的股份，自公司股票在证券交易所上市交易之日起一年内不得转让。自愿锁定是指在强制锁定的基础上，为了提升投资者信心，公司实际控制人、控股股东、董事、监事或高管自愿承诺在一定时间内不对外转让其持有的上市公司股份。A选项只是自愿锁定的目的。\nB、D选项不符合题意，限售期会导致基金实现最终退出耗时较长，且期内的股票价格波动会影响到股权投资基金的退出收益。所以不能提高退出实现的收益率水平和退出节奏的计划性。\nC选项符合题意，锁定期（限售期）的设置，通常是为了保护中小投资者的利益，防止公司实际控制人、控股股东、董事、监事、高管等\"内部人\"利用信息优势获得不当利益，或者利用资本市场实现快速套现。综上，C选项符合题意。故本题选C选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":12,"origin":"资料模拟题","lesson":"b21","topic":"投后与退出","core":false},{"id":"s3-64-13","subject":3,"stem":"关于股权投资基金投资中的回售权条款，以下属于常见触发条件的是（ ）。\nⅠ、业绩不达标\nⅡ、未及时申报上市材料/实现ⅠPO\n\nⅢ、原始股东丧失控股权\nⅣ、高管出现重大不当行为","options":["Ⅰ、Ⅱ、Ⅳ","Ⅰ、Ⅱ、Ⅲ","Ⅰ、Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅲ、Ⅳ"],"answer":2,"explanation":"业内常见的触发\"回售权\"的条件，有业绩指标触发条件和非业绩事件触发条件两类。例如:\n(1)业绩不达标;\n(2)未及时改制/申报上市材料/实现ⅠPO;\n(3)原始股东丧失控股权;\n(4)高管出现重大不当行为。故本题选C选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":13,"origin":"资料模拟题","lesson":"b18","topic":"投资条款","core":false},{"id":"s3-64-14","subject":3,"stem":"关于项目退出方式，以下说法正确的是（ ）。\nⅠ、从退出成本的角度来看，清算退出是需要先支付清算费用，剩余部分才能进行分配；\nⅡ、从退出风险的角度来看，上市转让退出的风险主要表现在企业上市申请是否获批的不确定性和锁定期内的股票价格波动；\nⅢ、从退出效率的角度来看，一般上市转让退出比场外交易市场挂牌的方式效率高；\nⅣ、从退出收益的角度来看，一般清算退出的收益较高","options":["Ⅰ、Ⅱ","Ⅲ、Ⅳ","Ⅰ、Ⅳ","Ⅱ、Ⅲ"],"answer":0,"explanation":"Ⅰ项说法正确，从退出成本的角度来看，清算退出是需要先支付清算费用，剩余部分才能进行分配。\nⅡ项说法正确，从退出风险的角度来看，上市转让退出的风险主要表现在企业上市申请是否获批的不确定性和锁定期内的股票价格波动。\nⅢ项说法错误，从退出效率的角度来看，上市转让退出:从券商进场确定股改基准日算起，完成首次公开发行股票并上市一般需要2年甚至更长时间，上市成功后一般还有相当期限的限售期，实现最终退出耗时较长。场外交易市场挂牌转让退出:一般实行注册制，所需时间相对较短。\nⅣ项说法错误，上市转让退出的收益一般要比挂牌转让退出和协议转让退出的收益高;清算退出一般将面临亏损的风险。综上，Ⅰ、Ⅱ项符合题意，故本题选A选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":14,"origin":"资料模拟题","lesson":"b21","topic":"投后与退出","core":false},{"id":"s3-64-18","subject":3,"stem":"某股权投资基金拟投资的目标公司处于创业早期，利润和现金流为负，未来回报可能较高，对其估值一般采用的估值方法是（ ）。","options":["相对估值法","清算价值法","创业投资估值法","重置成本法"],"answer":2,"explanation":"A选项不符合题意，相对估值法的基本原理是以可比公司的价格为基础，来评估目标公司的相应价值。评估所得的价值，可以是股权价值，也可以是企业价值。使用可比价值对目标公司进行价值评估，在创业投资基金和并购基金中大量使用。\n\nB选项不符合题意，清算价值法常见于杠杆收购和破产投资策略。一般采用清算价值法估值时采用较低的折扣率。对于股权投资机构而言，清算很难获得很好的投资回报，在企业正常可持续经营的情况下，不会采用清算价值法。\nC选项符合题意，创业投资估值法通过评估目标公司退出时的股权价值，再基于目标回报倍数或收益率，倒推出目标公司的当前价值。如果股权投资基金拟投资的目标公司处于创业早期，利润和现金流均为负数，未来回报很高，但存在高度不确定性，此时，往往会用创业投资估值法。\nD选项不符合题意，重置成本法是用待评估资产的完全重置成本（重置全价）减去其各种贬值后的差额作为该项资产价值的评估方法，完全重置成本是指在现时条件下重新购置一项全新状态的资产所需的全部成本。重置成本法主要作为辅助方法存在，主要原因是企业历史成本与未来价值并无必然联系。综上，A、B、D选项不符合题意，C选项符合题意。故本题选C选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":18,"origin":"资料模拟题","lesson":"b15","topic":"尽调与估值","core":false},{"id":"s3-64-19","subject":3,"stem":"投资者应当以书面方式承诺其为自己购买基金，任何机构和个人不得以（ ）为目的购买基金。","options":["非法拆分转让","规避风险","转让","盈利"],"answer":0,"explanation":"投资者应当以书面方式承诺其为自己购买私募基金，任何机构和个人不得以非法拆分转让为目的购买私募基金。故本题选A选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":19,"origin":"资料模拟题","lesson":"b01","topic":"组织与治理","core":false},{"id":"s3-64-20","subject":3,"stem":"X药业公司处于高速成长阶段，甲基金拟对X药业公司进行B轮投资，甲基金的业务尽职调查工作应重点关注的事项有（ ）。\nⅠ、公司管理团队；\nⅡ、公司已上市产品和储备产品；\nⅢ、公司的市场环境及发展战略；\nⅣ、公司的未来上市地选择；\nⅤ、公司的税收及政府优惠政策","options":["Ⅰ、Ⅱ、Ⅲ、Ⅴ","Ⅰ、Ⅱ、Ⅲ","Ⅰ、Ⅱ、Ⅲ、Ⅳ","Ⅱ、Ⅲ、Ⅴ"],"answer":1,"explanation":"不同企业类型的业务尽职调查的侧重点:\n（1）对创业企业的考察重点为管理团队和产品服务部分;\n（2）对扩张期企业，管理团队也是尽调重点关注的事项，对产品服务、发展战略及市场因素的关注程度更高一些;\n（3）对成熟阶段企业更多关注管理团队、资产质量、融资结构、融资运用、发展战略以及风险分析等。\nⅠ项符合管理团队部分，Ⅱ项符合产品服务部分，Ⅲ项符合发展战略及市场因素部分。上市和融资相关，属于成熟企业应重点关注的事项，Ⅳ项不符合题意。公司的税收及政府优惠政策属于法律尽职调查内容，Ⅴ项不符合题意。\nX药业公司处于高速成长阶段，属于扩张期企业，Ⅰ、Ⅱ、Ⅲ符合题意。故本题选B选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":20,"origin":"资料模拟题","lesson":"b10","topic":"尽调与估值","core":false},{"id":"s3-64-21","subject":3,"stem":"股权投资基金A拟投资公司B，在投资协议中约定由公司B总经理和副总经理共同对基金A的投资进行回购\n\n，该回购行为属于（ ）。","options":["控股股东回购","参股股东","管理层回购","员工收购"],"answer":2,"explanation":"C选项符合题意，管理层回购是指被投资企业的管理层在回购条件满足时自筹资金回购股权投资基金所持有的股权（股份），从而实现股权投资基金的退出。故本题选C选项。\n【乐知识】\n（1）控股股东回购是指被投资企业的控股股东在回购条件满足时自筹资金回购股权投资基金所持有的股权（股份），控股股东回购是股权回购中比较常见的方式。（2）员工收购是指目标公司的员工集体出资将股权投资基金所持有的股权（股份）收购，从而实现股权投资基金的退出。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":21,"origin":"资料模拟题","lesson":"b21","topic":"投后与退出","core":false},{"id":"s3-64-22","subject":3,"stem":"关于并购基金的运作，说法正确的是（ ）。\nⅠ、主要投资于成熟企业；\nⅡ、通常采用参股投资的方式；\nⅢ、可以采用杠杆收购的形式；\nⅣ、通过被投资企业股权增值从而获利","options":["Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅲ"],"answer":2,"explanation":"并购基金，是指主要对企业进行财务性并购投资的股权投资基金。并购基金的特点包括:\n（1）从投资对象看，主要是成熟企业;（Ⅰ项正确）（2）从投资方式看，通常采取控股性投资;\n（3）从杠杆应用看，往往借助于杠杆，即采取杠杆收购形式;（Ⅲ项正确）（4）从投资收益看，主要来源于因管理增值带来的股权增值。（Ⅳ项正确）\nⅡ项说法错误，创业投资基金采取参股投资的方式。并购基金则投资于价值被低估的企业，通过对被投资企业进行重整而获利，需要采取控股性投资。综上，Ⅰ、Ⅲ、Ⅳ项符合题意。故本题选C选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":22,"origin":"资料模拟题","lesson":"b05","topic":"组织与治理","core":false},{"id":"s3-64-25","subject":3,"stem":"当投资者的投资规模不能达到某大型基金的投资门槛时，投资者可以借助（ ）间接投资该大型基金。","options":["成长型基金","基金债权融资","政府引导基金","股权投资母基金"],"answer":3,"explanation":"A选项不符合题意，成长型基金亦称\"长期成长型基金\"。是重视资金长期成长的投资基金。这种基金，为达到资金长期成长的投资目标，一般投资于信誉好、长期有盈利的公司，或者有长期成长前景的公司。\nB选项不符合题意，D选项符合题意，股权投资母基金具有规模优势，可以通过帮助投资者\"扩大规模\"或\"缩小规模\"来解决由于资金规模难以进行合适投资的问题。\nC选项不符合题意，政府引导基金是一类特殊的母基金，是由政府设立并按市场化方式运作的政策性基金，主要通过扶持创业投资基金发展，引导社会资金进入创业投资领域。政府引导基金本身不直接从事创业投资业务。综上，A、B、C选项不符合题意，D选项符合题意。故本题选D选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":25,"origin":"资料模拟题","lesson":"b24","topic":"收益与运营","core":false},{"id":"s3-64-30","subject":3,"stem":"在证券交易所进行证券交易时，对一段时间内接受的买卖申报一次性撮合的价格形成机制是（ ）。","options":["大宗交易","集合竞价","连续竞价","协议转让"],"answer":1,"explanation":"A选项不符合题意，大宗交易是指达到规定的最低限额的证券单笔买卖申报，买卖双方经过协商达成一致并经交易所确认成交的证券交易。\nB选项符合题意，集合竞价是指对一段时间内接受的买卖申报一次性撮合的竞价方式。\nC选项不符合题意，连续竞价是指对买卖申报逐笔连续撮合的竞价方式。\nD选项不符合题意，协议转让是指买卖各方依据事先达成的转让协议，向股份上市所在证券交易所和登记机构申请办理股份转让过户的业务。故本题选B选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":30,"origin":"资料模拟题","lesson":"b21","topic":"投后与退出","core":false},{"id":"s3-64-35","subject":3,"stem":"如果没有（ ），创始人股东可以做以下事情:发行巨量股份给创始人，将投资人股份比例稀释成接近零。","options":["保护性条款","回售条款","优先认购权条款","反摊薄条款"],"answer":0,"explanation":"保护性条款是指股权投资基金为保护自身利益而设置的要求目标公司在执行某些可能损害投资者利益或对投资者利益有重大影响的行为时，需取得投资者同意的条款。在创业投资中，创业投资基金通常是被投资企业的小股东，因此会向企业家要求设置保护性条款，设立保护性条款的目的是保护作为小股东的投资者，防止其利益受到大股东侵害。保护性条款针对的通常是涉及投资者经济利益或者公司控制权的重大事项。故本题选A选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":35,"origin":"资料模拟题","lesson":"b16","topic":"投资条款","core":false},{"id":"s3-64-36","subject":3,"stem":"信托（契约）型基金是指通过订立信托契约的形式设立的股权投资基金，关于信托（契约）型基金，表述错误的是（ ）。","options":["基金的参与主体包括基金投资者、基金管理人及基金托管人","基金管理人依据法律法规和基金合同负责基金的经营和管理操作","基金是独立法人基金","投资者通过购买基金份额享有投资收益"],"answer":2,"explanation":"A选项说法正确，信托（契约）型基金的主要参与主体包括基金投资者、基金管理人、基金托管人。\nB选项说法正确，基金管理人依据法律法规和基金合同负责基金的经营和管理操作。\nC选项说法错误，信托（契约）型基金不具有独立的法人地位。\nD选项说法正确，基金投资者通过购买基金份额，享有基金投资收益。故本题选C选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":36,"origin":"资料模拟题","lesson":"b02","topic":"组织与治理","core":false},{"id":"s3-64-37","subject":3,"stem":"股权投资基金现拟对某目标公司进行法律尽职调查，法律尽职调查需关注的高级管理人员问题包括（ \n）。\nⅠ、目标公司的首席技术官是否与目标公司签订协议，限制其离职后开展与公司类似的业务；\nⅡ、目标公司的总经理薪酬高于同业50%；\nⅢ、目标公司的前任CFO不满被公司开除，目前正与公司进行劳动仲裁，要求12个月的工资作为赔偿；\nⅣ、目标公司尚未针对高级管理人员建立股权激励机制","options":["Ⅰ、Ⅳ","Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅲ","Ⅰ、Ⅲ"],"answer":3,"explanation":"法律尽职调查需关注的高级管理人员问题包括:\n（1）高级管理人员是否与企业签订了应有的劳动合同，是否存在劳动仲裁或纠纷情况（Ⅲ项）。（2）目标公司与主要高管的劳动合同中是否包括竞业禁止条款以及对应的补偿条款（Ⅰ项）。\nⅡ、Ⅳ项，主要高级管理人员的薪酬体系、期权或股权激励机制等属于业务尽职调查中的管理团队部分，不属于法律尽职调查。综上，Ⅰ、Ⅲ项符合题意，故本题选D选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":37,"origin":"资料模拟题","lesson":"b10","topic":"尽调与估值","core":false},{"id":"s3-64-39","subject":3,"stem":"股权投资母基金A在股权投资基金B的存续期第3年，从基金B的投资人C处，以C持有基金B份额按公允价值估值，购买C持有基金B的全部份额。针对该交易，以下说法错误的是（ ）。","options":["该交易描述的是母基金二级投资业务中的购买存续基金份额及后续出资额","因缺乏流动性，母基金A可以一定折扣购买C持有的基金B的份额","通常情况下，该交易相对于母基金A在基金B设立时直接投资基金B，能更快回收投资","母基金A在该交易中只需考察基金B所持有投资组合公司的价值"],"answer":3,"explanation":"A选项说法正确，按投资标的不同，二级投资业务可以分为购买存续基金份额及后续出资额和购买基金持有的投资组合公司的股权两种类型。题干中是购买存息基金份额。\nB选项说法正确，股权投资基金主要采取私募形式，缺乏流动性，因此二级投资一般都有价值折扣。\nC选项说法正确，二级投资能够加速投资回收:投资的是存续期的股权投资基金，缩短了投资等待期。\nD选项说法错误，\"只需考虑\"说法太绝对，二级投资除了考虑已知的资产组合，价格和回报期限也需要考虑。故本题选D选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":39,"origin":"资料模拟题","lesson":"b05","topic":"组织与治理","core":false},{"id":"s3-64-42","subject":3,"stem":"基金服务机构在开展业务过程中，因违法违规、违反服务协议等原因给基金财产造成的损失，处理方式应为（ ）。","options":["服务机构先行承担赔偿责任，再按服务协议约定与基金管理人进行责任分配与损失追偿","服务机构承担全责并进行赔偿","基金管理人承担全责并进行赔偿","基金管理人先行承担赔偿责任，再按服务协议约定与服务机构进行责任分配与损失追偿"],"answer":3,"explanation":"服务机构在开展业务的过程中，因违法违规、违反服务协议、技术故障、操作错误等原因给基金财产造成的损失，应当由股权投资基金管理人先行承担赔偿责任，股权投资基金管理人再按照服务协议的约定与服务机构进行责任分配与损失追偿。\nA、B选项说法错误，股权投资基金管理人委托服务机构提供基金服务的，股权投资基金管理人依法应当承担的责任不因委托而免除。故先行承担赔偿责任的为基金管理人。\nC选项说法错误，基金管理人和基金服务机构之间有服务协议，基金管理人可按照协议进行责任分配与损失追偿，而非\"承担全责\"。故本题选D选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":42,"origin":"资料模拟题","lesson":"b25","topic":"收益与运营","core":false},{"id":"s3-64-45","subject":3,"stem":"股权投资基金的服务机构主要包括（ ）。\nⅠ、基金份额登记机构；\nⅡ、基金销售机构；\nⅢ、律师事务所；\nⅣ、会计师事务所","options":["Ⅰ、Ⅱ、Ⅲ","Ⅰ、Ⅱ、Ⅳ","Ⅰ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅲ、Ⅳ"],"answer":3,"explanation":"股权投资基金的服务机构主要包括基金资产保管机构、基金销售机构、基金份额登记机构、律师事务所、会计师事务所等。故本题选D选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":45,"origin":"资料模拟题","lesson":"b08","topic":"募集与合规","core":false},{"id":"s3-64-47","subject":3,"stem":"股权投资基金为被投资企业提供的增值服务，通常不包括（ ）。","options":["上市辅导及并购整理","主导生产工艺流程的改进","完善公司治理结构","规范财务管理系统"],"answer":1,"explanation":"增值服务的主要内容包括:\n（1）协助完善规范的公司治理架构;（C选项属于）（2）协助建立规范的财务管理体系;（D选项属于）（3）为企业提供管理咨询服务;\n（4）协助进行后续再融资工作;\n（5）协助上市及并购整合;（A选项属于）（6）提供人才专家等外部关系网络。\nB选项不属于股权投资基金为被投资企业提供的增值服务，投资机构对被投资企业企业所经营事项不一定了解，并不参与被投资企业的日常经营。综上所述，B选项符合题意。故本题选B选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":47,"origin":"资料模拟题","lesson":"b20","topic":"投后与退出","core":false},{"id":"s3-64-52","subject":3,"stem":"关于股权投资基金，说法正确的是（ ）。","options":["专业性较差","投资期限一般较长，流动性较差","投资风险比货币市场基金低","股权投资基金的收益较为稳定"],"answer":1,"explanation":"股权投资基金特点包括:\n（1）投资期限长、流动性较差;（B选项说法正确）（2）投资后管理投入资源较多;\n（3）专业性较强;（A选项说法错误）\n\n（4）收益波动性较高，属于高风险、高期望收益的资产类别。（C、D选项说法错误）故本题选B选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":52,"origin":"资料模拟题","lesson":"b01","topic":"组织与治理","core":false},{"id":"s3-64-53","subject":3,"stem":"公司型基金的基金合同是（ ）。","options":["公司章程","股东大会决议","董事会决议","营业执照"],"answer":0,"explanation":"公司型基金合同的法律形式为公司章程，需要符合包括公司法等法律法规要求的要件，同时适应股权投资业务，并符合行业合规和自律要求。故本题选A选项。\n【乐知识】合伙型基金合同:在合伙型基金中，普通合伙人、有限合伙人及基金管理人通过有限合伙协议、委托管理协议等一系列协议，约定相关权利和责任，同时也对基金运作的相关事宜进行事先规范。有限合伙协议由全体合伙人签署，约定普通合伙人和有限合伙人的权利义务关系。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":53,"origin":"资料模拟题","lesson":"b02","topic":"组织与治理","core":false},{"id":"s3-64-54","subject":3,"stem":"设立政府引导基金的主要目的是（ ）。","options":["优化创业投资资本配置，克服其市场配置失灵问题","通过股权投资及后续退出获取高额回报","投资境外企业，增强海外资产配置","通过股权投资的形式获得被投资企业的控制权"],"answer":0,"explanation":"A选项说法正确，政府引导基金的宗旨包括发挥财政资金的引导和聚集放大作用，引导民间投资等社会资本投入，增加创业投资资本的供给，克服单纯通过市场配置创业投资资本的市场失灵问题。\nB、C、D选项说法错误，政府引导基金是一类特殊的母基金，是由政府设立并按市场化方式运作的政策性基金，主要通过扶持创业投资基金发展，引导社会资金进入创业投资领域。政府引导基金本身不直接从事创业投资业务。故本题选A选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":54,"origin":"资料模拟题","lesson":"b21","topic":"投后与退出","core":false},{"id":"s3-64-55","subject":3,"stem":"并购投资基金的自有资金和外部资金的比例，通常取决于（ ）。\nⅠ、目标公司预计现金流；\nⅡ、外部资金融资成本；\nⅢ、基金管理人历史投资业绩；\nⅣ、资本结构风险","options":["Ⅰ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅲ","Ⅰ、Ⅱ、Ⅳ","Ⅱ、Ⅲ、Ⅳ"],"answer":2,"explanation":"收购方的自有资金和外部资金比例的决定因素包括:\n（1）目标公司所能产生的现金流;\n（2）外部资金的融资成本;\n（3）资本结构的风险。\nⅢ项，杠杆收购，是指收购方用少量的自有资金结合大规模的外部资金来收购目标企业的活动，资金比例的决定因素是与资金相关的因素，与基金管理人历史投资业绩无关。综上，Ⅰ、Ⅱ、Ⅳ项符合题意。\n\n故本题选C选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":55,"origin":"资料模拟题","lesson":"b05","topic":"组织与治理","core":false},{"id":"s3-64-60","subject":3,"stem":"关于投资协议中包含竞业禁止条款的目的，下列表述错误的是（ ）。","options":["保护目标公司商业机密不被泄露","保障目标公司各方投资人的利益","保障目标公司利益不受损害","保证投资人不投资目标公司的竞争方"],"answer":3,"explanation":"竞业禁止条款是指在投资协议中，股权投资基金为了确保目标公司的良好发展和利益，要求目标公司通过保密协议或其他方式，确保其董事或其他高管不得兼职与本公司业务有竞争的职位，同时，在离职后一段时期内，不得加入与本公司有竞争关系的公司或从事与本公司有竞争关系的业务。\nA选项说法正确，竞业禁止条款可以通过对目标公司董事或其他高管的约束，保护目标公司商业机密不被董事或其他高管泄露。\nB、C选项说法正确，竞业禁止条款的目的是为了保证目标公司的利益不受损害，从而保障投资者的利益。\nD选项说法错误，竞业禁止条款是约束目标公司董事或其他高管，不能保证投资人不投资目标公司的竞争方。故本题选D选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":60,"origin":"资料模拟题","lesson":"b19","topic":"投资条款","core":false},{"id":"s3-64-61","subject":3,"stem":"某基金管理人募集股权投资基金时，不符合募集行为规定的是（ ）。","options":["通过电子邮件向特定的机构投资者发送募集说明书","通过拆分基金份额向特定投资者销售基金","通过银行向部分高净值客户推荐基金","向其管理的其他基金的投资者推荐该基金"],"answer":1,"explanation":"股权投资基金应当向合格投资者募集，单位或个人不得为规避合格投资者标准，募集以股权投资基金份额或其收益权为投资标的的金融产品，或者将股权投资基金份额或其收益权进行非法拆分转让，变相突破合格投资者标准。\nB选项中拆分基金份额不符合募集行为规定，符合题意。此题中的特定机构投资者、部分高净值客户和其他基金的投资者均属于合格投资者，可以向其推荐基金。\nA、C、D符合募集行为规定，不符合题意。故本题选B选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":61,"origin":"资料模拟题","lesson":"b08","topic":"募集与合规","core":false},{"id":"s3-64-62","subject":3,"stem":"关于股权投资基金募集机构的责任和义务，下列表述错误的是（ ）。","options":["募集机构应建立制度以保障基金财产和客户资金安全","募集机构应恪尽职守、诚实守信、谨慎勤勉、防范利益冲突","募集机构应建立相关制度保障投资者的商业秘密并对个人信息进行严密保管","募集阶段需指导投资者自行判断基金产品的风险类型并与自身风险承受能力进行适当性匹配"],"answer":3,"explanation":"募集机构的责任和义务包括:\n（1）募集机构在募集过程中应恪尽职守、诚实守信、谨慎勤勉，防范利益冲突，履行风险提醒义务、反洗钱义务等相关义务，并按照法规要求的合格投资者制度承担特定对象确定、投资者适当性审查与确认等相关责任;（B选项表述正确）（2）募集机构在募集阶段应与基金投资者关于基金合同及附属文件充分沟通，并就法规可能影响的基金合同生效程序进行客观描述;\n（3）募集机构应建立相关制度保障投资者的商业秘密并对个人信息严格保密，并确保基金相关的未公开信息不被用于进行非法交易等;（C选项表述正确）（4）募集机构应建立相关制度以保障基金财产和客户资金安全，包括但不限于基金募集与分配账户安排、基金托管安排等。（A选项表述正确）\nD选项表述错误，募集机构在募集过程中应按照法规要求的合格投资者制度承担特定对象确定、投资者适当性审查与确认等相关责任，而不是指导投资者自行进行适当性匹配。综上，A、B、C选项表述正确，D选项表述错误。故本题选D选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":62,"origin":"资料模拟题","lesson":"b08","topic":"募集与合规","core":false},{"id":"s3-64-63","subject":3,"stem":"股权投资基金会计核算工作的核算主体为（ ），会计责任主体为（ ）。","options":["基金管理人;基金","基金;基金托管人","基金管理人;基金有限合伙人","基金;基金管理人"],"answer":3,"explanation":"D选项符合题意，股权投资基金的会计核算主体为基金，会计责任主体为基金管理人。故本题选D选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":63,"origin":"资料模拟题","lesson":"b03","topic":"组织与治理","core":false},{"id":"s3-64-64","subject":3,"stem":"根据有关规定，（ ）应及时编制并对外提供真实、完整的基金财务会计报告。","options":["股权投资基金托管人","股权投资基金审计机构","股权投资基金管理人","股权投资基金有限合伙人"],"answer":2,"explanation":"C选项符合题意，根据有关规定，股权投资基金管理人应及时编制并对外提供真实、完整的基金财务会计报告。故本题选C选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":64,"origin":"资料模拟题","lesson":"b03","topic":"组织与治理","core":false},{"id":"s3-64-65","subject":3,"stem":"关于投资协议（投资备忘录）中的排他性条款，以下说法正确的是（ ）。\nⅠ、排他性条款通常没有时间限制；\nⅡ、排他性条款一般会约定一个为期几个月的排他周期；\nⅢ、排他性条款赋予了股权投资基金对一些特定重大事项的一票否决权；\nⅣ、投资方如在协议签署之日前的任何时间决定不执行该投资计划，应立即通知目标企业","options":["Ⅱ、Ⅲ","Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅲ、Ⅳ","Ⅱ、Ⅳ"],"answer":3,"explanation":"排他性条款要求目标公司现任股东及其任何任职职员、董事、财务顾问、经纪人或代表公司行事的人在约定的排他期内不得与其他投资机构进行接触，从而保证双方的时间和经济效率。\nⅠ项说法错误，Ⅱ项说法正确，排他性条款的排他期由双方约定，通常为几个月。\nⅢ项说法错误，保护性条款是指股权投资基金为保护自身利益而设置的要求目标公司在执行某些可能损害投资者利益或对投资者利益有重大影响的行为时，需取得投资者同意的条款。保护性条款赋予了股权投资基金作为投资人对一些重大事项的一票否决权。\nⅣ说法正确，投资方如果在协议签署之日前的任何时间决定不执行投资计划，应立即通知目标企业，排他期将在目标公司收到上述通知时立即结束。综上，Ⅱ、Ⅳ项说法正确。故本题选D选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":65,"origin":"资料模拟题","lesson":"b19","topic":"投资条款","core":false},{"id":"s3-64-66","subject":3,"stem":"股权投资基金进行业务尽职调查的主要目的是（ ）。","options":["关注主要股东与目标公司之间的关联交易是否合法","评估企业资产和业务的合法性及潜在法律风险","调查公司及控股子公司历史财务数据","了解过去及现在企业创造价值的机制及变化趋势"],"answer":3,"explanation":"业务尽职调查是整个尽职调查工作的核心，目的是了解过去及现在企业创造价值的机制，以及这种机制未来的变化趋势。故本题选D选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":66,"origin":"资料模拟题","lesson":"b10","topic":"尽调与估值","core":false},{"id":"s3-64-67","subject":3,"stem":"在设计和执行基金管理人内部控制制度时，下列表述正确的是（ ）。","options":["设置较多环节，提高控制效果","根据领导要求，灵活执行内部控制制度","将非核心业务外包给中介机构，免除自身责任","重要业务部门和岗位进行物理隔离，增强独立性"],"answer":3,"explanation":"A选项表述错误，管理人内部控制的成本效益原则是指以合理的成本控制达到最佳的内部控制效果，内部控制与股权投资基金管理人的管理规模和员工人数等方面相匹配，契合自身实际情况。而不是设置较多环节。\nB选项表述错误，管理人内部控制的适时性原则是指股权投资基金管理人应当定期评价内部控制的有效性，并随着有关法律法规的调整和经营战略、方针、理念等内外部环境的变化同步适时修改或完善。而不是根据领导要求。\nC选项说法错误，股权投资基金管理人委托服务机构提供基金服务的，股权投资基金管理人依法应当承担的责任不因委托而免除。故本题选D选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":67,"origin":"资料模拟题","lesson":"b04","topic":"组织与治理","core":false},{"id":"s3-64-68","subject":3,"stem":"基金管理人甲公司管理的A基金为一只专注初创期企业投资的合伙型基金，受到投资人缴入资本合计2亿元，以前年度尚未对投资人进行分配。A基金投资的Y公司在本年度对A基金所持股权进行回购，回购款合计\n1200万元，已全款支付给A基金。A基金就收到的回购款金额对投资人进行了分配。另外A基金本年度出售其所持Z公司的股权，实现投资收益500万元，扣除基金相关费用后，基金本年合计实现净收益300万元，年末基金净资产2.5亿元。根据以上材料，回答以下题目。截至本年年末，A基金的总收益倍数为（ ）。","options":["1.325","0.06","1.335","1.31"],"answer":3,"explanation":"总收益倍数是指截至某一特定时点，投资者已从基金获得的分配金额加上资产净值与投资者已向基金缴款金额总和的比率[（资产净值+从基金中获取的已分配金额）/向基金缴款的总金额]，体现了投资者的账面回报水平。总收益倍数=（1200+25000）/20000=1.31。故本题选D选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":68,"origin":"资料模拟题","lesson":"b22","topic":"收益与运营","core":false},{"id":"s3-64-70","subject":3,"stem":"关于投资协议中竞业禁止条款，下列表述错误的是（ ）。","options":["确保其董事或其他高管不得兼职与本公司业务有竞争的职位","条款目的是为了保证目标公司的利益不受损害，从而保障投资人的利益","关键员工不得在离职后一段时期内加入与本公司有竞争关系的公司","要求目标公司通过口头承诺方式进行约定"],"answer":3,"explanation":"A、C选项说法正确，D选项说法错误，竞业禁止条款是指在投资协议中，股权投资基金为了确保目标公司的良好发展和利益，要求目标公司通过保密协议或其他方式，确保其董事或其他高管不得兼职与本公司业务有竞争的职位，同时，在离职后一段时期内，不得加入与本公司有竞争关系的公司或从事与本公司有竞争关系的业务。（口头承诺方式说法错误）\nB选项说法正确，竞业禁止条款的目的是为了保证目标公司的利益不受损害，从而保障投资者的利益。故本题选D选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":70,"origin":"资料模拟题","lesson":"b19","topic":"投资条款","core":false},{"id":"s3-64-71","subject":3,"stem":"股权投资基金管理人管理可能导致利益输送或者利益冲突的不同基金的，应当建立防范（ ）的机制。","options":["利益输送和利益冲突","利益共享和利益冲突","利益共享和利益输送","利益分配和利益输送"],"answer":0,"explanation":"股权投资基金管理人管理可能导致利益输送或者利益冲突的不同基金的，应当建立防范利益输送和利益冲突的机制。故本题选A选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":71,"origin":"资料模拟题","lesson":"b04","topic":"组织与治理","core":false},{"id":"s3-64-72","subject":3,"stem":"计算截至某一时点的项目投资的内部收益率时，应考虑的必备参数不包括（ ）。","options":["获得项目收益的时间及金额","对项目出资的时间及金额","项目公司将资金陆续投入生产经营的时间和金额","截至计算时点的项目资产净值"],"answer":2,"explanation":"内部收益率是根据截至某一确定时点基金在存续期内每年的投资经营现金流，以及该时点的资产净值，算回期初净现值等于零时相应的折现率。毛内部收益率是为基金投资项目的内部收益率，相关现金流和资产净值考虑基金层面，考虑参数包括对项目出资的时间及金额、获得项目收益的时间及金额、截至计算时点的项目资产净值。故本题选C选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":72,"origin":"资料模拟题","lesson":"b23","topic":"收益与运营","core":false},{"id":"s3-64-74","subject":3,"stem":"按资金性质分类，股权投资基金可以分为（ ）。","options":["人民币基金和外币基金","创业投资基金和并购基金","一级基金和二级基金","股权投资母基金和政府引导基金"],"answer":0,"explanation":"按资金性质分类，股权投资基金可以分为人民币基金和外币基金。故本题选A选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":74,"origin":"资料模拟题","lesson":"b06","topic":"组织与治理","core":false},{"id":"s3-64-76","subject":3,"stem":"下列关于投资者投资股权投资基金时应履行义务的说法中，错误的是（ ）。","options":["确保自身符合合格投资者条件","对自身资产或收入情况应作如实承诺，如提供虚假承诺文件，应承担相应责任","如实填写风险识别能力和承担能力问卷","如自身不符合合格投资者条件，可以购买以私募基金份额或其收益权为投资标的的金融产品"],"answer":3,"explanation":"A选项正确，募集机构应当确保投资者已知悉股权投资基金的投资条件，投资者应当书面承诺其为自己购买股权投资基金。\nB、C选项正确，在问卷调查过程中，应指导投资者如实填写风险识别能力和风险承担能力问卷，如实承诺资产或者收入情况。同时，请投资者阅读风险揭示书，在投资者全面知悉风险且有能力并愿意承担所投资特定基金的风险的情况下，签字确认。\nD选项错误，单位或个人不得为规避合格投资者标准，募集以股权投资基金份额或其收益权为投资标的的金融产品，或者将股权投资基金份额或其收益权进行非法拆分转让，变相突破合格投资者标准。故本题选D选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":76,"origin":"资料模拟题","lesson":"b07","topic":"募集与合规","core":false},{"id":"s3-64-77","subject":3,"stem":"杠杆收购的主要资金来源中，由杠杆收购基金提供的是（ ）。","options":["垃圾债券","优先股","银行贷款","股权资本"],"answer":3,"explanation":"D选项符合题意，股权资本主要由杠杆收购基金提供，采取普通股的形式。故本题选D选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":77,"origin":"资料模拟题","lesson":"b05","topic":"组织与治理","core":false},{"id":"s3-64-79","subject":3,"stem":"使用折现现金流估值法对企业进行估值时，可以直接计算得到股权价值的模型是（ ）。\nⅠ、红利折现模型；\nⅡ、股权自由现金流折现模型；\nⅢ、企业自由现金流折现模型；\nⅣ、企业净资产折现模型","options":["Ⅱ、Ⅲ","Ⅱ","Ⅰ、Ⅳ","Ⅰ、Ⅱ"],"answer":3,"explanation":"折现现金流估值法的模型包括红利折现模型和自由现金流模型等。自由现金流模型又包括股权自由现金流折现模型和企业自由现金流折现模型。不包括净资产折现模型，Ⅳ项不符合题意。（1）红利折现模型:股权投资基金投资于目标公司的股权，预期获得两种现金流:一是持有股权期间的现金红利;二是持有期末卖出股权时的价格。二者的现值之和即目前股权的价值。红利折现模型计算得到股权价值，Ⅰ项符合题意。（2）股权自由现金流折现模型:股权自由现金流是可以自由分配给股权拥有者的最大化的现金流。股权自由现金流折现模型计算得到股权价值，Ⅱ项符合题意。（3）企业自由现金流折现模型:企业自由现金流是指公司在保持正常运营的情况下，可以向所有出资人（股东和债权人）进行自由分配的现金流。企业自由现金流折现模型计算得到企业价值，Ⅲ项不符合题意。综上，Ⅰ、Ⅱ项符合题意。故本题选D选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":79,"origin":"资料模拟题","lesson":"b14","topic":"尽调与估值","core":false},{"id":"s3-64-80","subject":3,"stem":"股权投资基金募集过程中，宣传措辞可以包括（ ）。","options":["风控措施完善","业界最佳、规模最大","避险、安全","高收益、无风险"],"answer":0,"explanation":"（1）股权投资基金募集过程中不得夸大或者片面推介基金，违规使用\"安全\"\"保证\"\"承诺\"\"保险\n\"\"避险\"\"有保障\"\"高收益\"\"无风险\"等可能误导投资人进行风险判断的措辞;（C、D选项不符合题意）（2）股权投资基金募集过程中不得采用不具有可比性、公平性、准确性、权威性的数据来源和方法进行业绩比较，任意使用\"业绩最佳\"\"规模最大\"等相关措辞;（B选项不符合题意）故本题选A选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":80,"origin":"资料模拟题","lesson":"b08","topic":"募集与合规","core":false},{"id":"s3-64-85","subject":3,"stem":"不属于投资机构对被投资企业通常采用的跟踪与监控方式的是（ ）。","options":["协助完善被投资企业的公司治理架构","定期检查协议条款的执行情况","对被投资企业的财务状况和业绩进行分析","派驻代表进入被投资企业的董事会"],"answer":0,"explanation":"项目跟踪与监控的主要方式有:\n（1）跟踪协议条款执行情况:在投资后管理阶段，投资机构需定期核查协议条款的执行情况，保护自身的合法权益。当发现协议执行中存在重大风险或出现不确定性的情况时，应当立即采取相应的补救措施。（B选项不符合题意）（2）监控被投资企业的各类经营指标与财务状况:投资机构通常要求被投企业定期提供财务报表和业绩报告，并跟踪被投资企业重大合同等业务经营信息、重大的投资活动和融资活动、公司经营范围的变更、重要管理人员的任免，以及其他可能对公司生产经营、业绩、资产等产生重大影响的事宜。（C选项不符合题意）（3）参与被投资企业的公司治理:为了降低投资后的委托代理风险，投资机构通常会直接参与被投资企业股东大会、董事会和监事会，并以提出议案或参与表决的方式，对被投资企业的经营管理实施监控。（D选项不符合题意）协助完善规范的公司治理架构是增值服务的主要内容。（A选项符合题意）故本题选A选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":85,"origin":"资料模拟题","lesson":"b20","topic":"投后与退出","core":false},{"id":"s3-64-86","subject":3,"stem":"股权投资基金A、股权投资基金B分别持有目标公司甲的股份10%和15%，其余股份均为公司创始人持有。目标公司甲拟通过增发500股融资1000万元用于拓展线下直营店。股权投资基金C有意向认购，创始人及股权投资基金B表示放弃优先认购权，股权投资基金A行使优先认购权，则股权投资基金C可以认购的股份数量以及对应的投资额分别为（ ）。","options":["450股，900万元","375股，750万元","225股，450万元","400股，800万元"],"answer":0,"explanation":"优先认购权是指目标公司未来发行新的股份或者可转换债券时，股权投资基金将按其持股比例获得同等条件下的优先认购权利。股权投资基金A持股比例为10%，可认购股份数量=500×10%=50（股），投资额\n=1000×10%=100（万元）。股权投资基金C可认购股份数量=500−50=450（股），投资额=1000-100=900（万元\n）。故本题选A选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":86,"origin":"资料模拟题","lesson":"b16","topic":"投资条款","core":false},{"id":"s3-64-90","subject":3,"stem":"投资协议与投资备忘录的主要条款包括（ ）\nⅠ、估值条款\nⅡ、回售权条款\nⅢ、反摊薄条款\nⅣ、保护性条款","options":["Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅲ","Ⅰ、Ⅱ、Ⅳ","Ⅰ、Ⅱ、Ⅲ、Ⅳ"],"answer":3,"explanation":"包括:\n（1）估值条款;\n（2）估值调整条款;\n（3）优先认购权条款;\n（4）第一拒绝条款;\n（5）随售权条款;\n（6）反摊薄条款;\n（7）保护性条款;\n（8）董事会席位条款;\n（9）回售权条款;\n（10）拖售权条款;\n（11）竞业禁止条款;\n（12）保密条款;\n（13）排他性条款。故本题选D选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":90,"origin":"资料模拟题","lesson":"b18","topic":"投资条款","core":false},{"id":"s3-64-91","subject":3,"stem":"股权投资基金管理人、托管人、销售机构及其他服务机构及其从业人员从事股权投资基金业务，属于禁止性行为的是（ ）。","options":["公平地对待其管理的不同基金财产","不从事内幕交易","侵占、挪用基金财产","按照规定履行职责"],"answer":2,"explanation":"C选项符合题意，股权投资基金管理人、股权投资基金托管人、股权投资基金销售机构及其他市场服务机构及其从业人员从事股权投资基金业务，不得有以下行为:\n（1）将其固有财产或者他人财产混同于基金财产从事投资活动;\n（2）不公平地对待其管理的不同基金财产;\n（3）利用基金财产或者职务之便，为本人或者投资者以外的人牟取利益，进行利益输送;或者以利益输送为目的，与特定对象进行不正当交易，或者在不同股权投资基金账户之间转移收益或亏损;\n（4）侵占、挪用基金财产;\n（5）泄露因职务便利获取的未公开信息，利用该信息从事或者明示、暗示他人从事相关的交易活动;\n（6）从事损害基金财产和投资者利益的投资活动;\n（7）玩忽职守，不按照规定履行职责;\n（8）从事内幕交易、操纵市场及其他不正当交易活动;\n（9）未针对每只股权投资基金设置独立账户，或者开展借新还旧、期限错配等业务;\n（10）进行商业贿赂;\n（11）将账户出借给第三方进行交易，或者违反账户实名制的规定，下设子账户、分账户、虚拟账户等;\n（12）直接或间接参与场外配资活动或者为场外配资活动提供服务或便利;\n（13）外接未经监管机构或者自律组织认证的其他交易系统，为违法证券期货业务活动提供端口服务便利;\n（14）通过境外机构或者境外系统下达投资交易指令;\n（15）法律、行政法规和中国证监会规定的其他禁止行为。故本题选C选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":91,"origin":"资料模拟题","lesson":"b08","topic":"募集与合规","core":false},{"id":"s3-64-92","subject":3,"stem":"股权投资基金投资目标公司股权时，投融资双方谈判后最终签署的约定双方权利义务关系的文本是（ \n）。","options":["基金合同","投资协议","合伙协议","投资条款清单"],"answer":1,"explanation":"B选项符合题意，股权投资基金投资目标公司股权时，投融资双方谈判后最终签署的约定双方权利义务关系的文本是投资协议。故本题选B选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":92,"origin":"资料模拟题","lesson":"b03","topic":"组织与治理","core":false},{"id":"s3-64-95","subject":3,"stem":"下列关于我国股权投资基金的募集方式和投向的描述，正确的是（ ）。","options":["募集方式为非公开募集或基金投向主要为非公开交易的私人股权，二者满足其一即可","募集方式可公开募集或非公开募集，基金投向可主要为非公开交易的私人股权或公开市场交易的股权","募集方式仅可非公开募集，基金投向主要为未上市公司的股权和已上市企业的非公开交易股权","募集方式可公开募集或非公开募集，基金投向主要为非公开交易的私人股权即可"],"answer":2,"explanation":"在我国，目前股权投资基金只能以非公开方式募集。股权投资基金的资金来源主要为各类机构投资者和高净值个人客户，基金投向则以未上市公司的股权和已上市企业的非公开交易股权为主。故本题选C项选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":95,"origin":"资料模拟题","lesson":"b21","topic":"投后与退出","core":false},{"id":"s3-64-96","subject":3,"stem":"私人股权投资基金一词中，私人是指（ ）。","options":["仅指基金是私募的","投资者为非国有或集体所有的机构或个人","股权是非公开发行和交易，基金是私募的","仅指股权是非公开发行和交易"],"answer":3,"explanation":"国内所称\"股权投资基金\"，其全称应为\"私人股权投资基金\"，是指主要投资于\"私人股权\"的投资基金。私人股权即非公开发行和交易的股权，包括未上市企业和上市企业非公开发行和交易的普通股、可转换为普通股的优先股和可转换债券。故本题选D选项。","sourceId":64,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","sourceNumber":96,"origin":"资料模拟题","lesson":"b01","topic":"组织与治理","core":false},{"id":"s3-66-5","subject":3,"stem":"估值调整条款潜在触发条件不包括（ ）。","options":["企业未能在约定时间前实现ⅠPO上市","企业高管发生严重违反约定的事件","企业在根据估值条款约定的业绩考核截止日归母净利润达到了业绩承诺，但拒绝对未来三年的业绩进行新的业绩承诺","企业原大股东失去控股地位"],"answer":2,"explanation":"估值调整机制的触发条件：\n（1）目标公司的实际业绩未达到事先约定的业绩目标;\n（2）发生特定事件，如公司未在约定时间前实现ⅠPO（A选项）、原大股东失去控股地位（D选项）、高管严重违反约定（B选项）等。故本题选C选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":5,"origin":"资料模拟题","lesson":"b18","topic":"投资条款","core":false},{"id":"s3-66-10","subject":3,"stem":"关于我国股权投资基金的募集方式，表述正确的是（ ）。","options":["现阶段我国不允许进行公开募集","获得中国证监会及中国证券投资基金业协会批准后可进行公开募集","获得中国证监会批准后可进行公开募集","获得中国证券投资基金业协会批准后可进行公开募集"],"answer":0,"explanation":"在我国，目前不允许进行股权投资基金的公开募集。故本题选A选项。\n【乐知识】股权投资基金的募集方式分为公开募集和非公开募集。（1）公开募集指的是通过公开渠道向非特定对象推介基金产品。（2）非公开募集指的是通过设置特定对象确定程序的渠道进行非公开推介基金产品的行为。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":10,"origin":"资料模拟题","lesson":"b08","topic":"募集与合规","core":false},{"id":"s3-66-11","subject":3,"stem":"投资机构可以协助被投资企业建立规范的财务管理体系，这一体系的基本准则不包括（ ）。","options":["降低成本","风险管理","全面预算","规范管理"],"answer":0,"explanation":"被投资企业，尤其是早期创业企业，在财务管理上往往缺乏规范严谨的财务管理理念、管理能力与高水平的管理人员，监管制度也往往不够完善。\nB、C、D选项为财务管理体系的基本原则，投资机构在财务管理体系建立方面具备专业的经验与能力，也可以协助引入具有较高水平的财务管理人员，帮助被投资企业建立起以\"规范管理、风险控制和全面预算\"为基本准则的现代财务管理体系。\nA选项不是财务管理体系的基本原则，建立规范的财务管理体系是为了财务管理体系更完善，不是为了降低成本。故本题选A选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":11,"origin":"资料模拟题","lesson":"b01","topic":"组织与治理","core":false},{"id":"s3-66-12","subject":3,"stem":"在我国，\"私募股权投资基金\"的准确含义应为（ ）。","options":["股权基金","私人投资基金","私募类私人股权投资基金","股指基金"],"answer":2,"explanation":"在我国，目前股权投资基金尚只能以非公开方式募集。因此，在我国当前的法律和监管规则下，一般所称\"私募股权投资基金\"的准确含义应为\"私募类私人股权投资基金\"。故本题选C选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":12,"origin":"资料模拟题","lesson":"b01","topic":"组织与治理","core":false},{"id":"s3-66-13","subject":3,"stem":"第一拒绝权条款作为股东权利，通常在公司（ ）的股权被出售时触发。\nⅠ、创始股东；\nⅡ、董事会成员股东；\nⅢ、公司高管股东；\nⅣ、监事会成员股东","options":["Ⅰ、Ⅱ、Ⅳ","Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅲ、Ⅳ"],"answer":2,"explanation":"第一拒绝权，是指目标公司的其他股东（Ⅰ、Ⅱ、Ⅲ、Ⅳ项均属于其他股东）欲对外出售股权时，作为老股东的股权投资基金在同等条件下有优先购买权。故本题选C选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":13,"origin":"资料模拟题","lesson":"b16","topic":"投资条款","core":false},{"id":"s3-66-16","subject":3,"stem":"关于相对估值法的估值倍数公式，下列选项表述错误的是（ ）。","options":["市净率倍数=公司价值/净资产","市销率倍数=股权价值/销售收入","市盈率倍数=股权价值/净利润","市盈率倍数=每股价值/每股收益"],"answer":0,"explanation":"相对估值法的基本原理是以可比公司的价格为基础，来评估目标公司的相应价值。评估所得的价值，可以是股权价值，也可以是企业价值。相对估值法的计算公式为：目标公司价值=目标公司某种指标×（可比公司价值/可比公司某种指标）市盈率倍数=股权价值÷净利润=每股价值÷每股收益;市净率倍数=股权价值\n÷净资产=每股价值÷每股净资产;市销率倍数=股权价值÷销售收入=每股价值÷每股销售收入。故本题选A选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":16,"origin":"资料模拟题","lesson":"b12","topic":"尽调与估值","core":false},{"id":"s3-66-18","subject":3,"stem":"投资机构A对项目企业B实施投资后，为及时获取企业信息，机构A的投资经理可采取的方式包括（ ）。\nⅠ、作为职工代表监事，参加被投资企业的监事会；\nⅡ、请被投资企业提供与企业经营状况相关的报告；\nⅢ、采取电话或会面、到被投资企业实地考查等方式与企业管理人员沟通接触；\nⅣ、作为董事会观察员，参与被投资企业董事会事项的讨论","options":["Ⅰ、Ⅱ、Ⅲ","Ⅱ、Ⅲ、Ⅳ","Ⅱ、Ⅲ","Ⅰ、Ⅲ、Ⅳ"],"answer":1,"explanation":"Ⅰ项，投资机构可以参加被投资企业监事会获得企业信息，但投资机构不属于职工，不能作为职工代表监事。\nⅡ、Ⅲ、Ⅳ项符合题意。故本题选B选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":18,"origin":"资料模拟题","lesson":"b20","topic":"投后与退出","core":false},{"id":"s3-66-21","subject":3,"stem":"某股权投资基金的管理人正在向投资者进行风险揭示，以下做法正确的是（ ）。\nⅠ、基金管理人向投资者口头揭示特殊风险，未要求投资者签署风险揭示书；\nⅡ、基金管理人在投资者签署基金合同之前与投资者签署风险揭示书；\nⅢ、基金管理人聘请甲公司为该基金提供估值核算服务，基金管理人将其作为一般风险进行揭示；\nⅣ、投资者对基金运营风险有疑问，基金管理人就此向投资者进一步解释说明","options":["Ⅰ、Ⅱ","Ⅱ、Ⅲ","Ⅰ、Ⅲ","Ⅱ、Ⅳ"],"answer":3,"explanation":"Ⅰ项错误，Ⅱ项正确，基金募集机构应当向投资者揭示基金风险，并安排投资者签署风险揭示书。\nⅢ项错误，聘请甲公司为基金提供估值核算服务属于外包事项，外包事项所涉风险属于特殊风险。\nⅣ项正确，投资者对基金运营风险有疑问，基金管理人应当就此向投资者进一步解释说明。故本题选D选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":21,"origin":"资料模拟题","lesson":"b09","topic":"募集与合规","core":false},{"id":"s3-66-23","subject":3,"stem":"关于股权投资基金募集过程中特定对象确定的说法，下列表述错误的是（ ）。","options":["募集机构应当采取问卷调查等方式履行特定对象确定程序","要先经过特定对象确定程序，才能宣传推介股权投资基金","募集机构进行线上募集不需要履行特定对象确定程序","特定对象确定流程要求投资者书面承诺其符合合格投资者标准"],"answer":2,"explanation":"A、D选项说法正确，特定对象确定的流程：采取问卷调查评估投资者的风险识别能力和风险承担能力;投资者书面承诺其符合合格投资者标准。\nB选项说法正确，未经特定对象确定程序，不得向任何人宣传推介股权投资基金。\nC选项说法错误，如果募集机构线上募集，也应当履行特定对象确定程序。故本题选C选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":23,"origin":"资料模拟题","lesson":"b07","topic":"募集与合规","core":false},{"id":"s3-66-26","subject":3,"stem":"下列关于基金管理费的描述，正确的是（ ）。","options":["管理费是按基金实缴出资金额的一定比例收取","可按基金规模的一定比例收取，也可以采用基金运营预算的机制收取","管理费是基金托管人向基金投资人收取的费用，按投资规模的一定比例收取","管理费是基金投资人向基金管理人收取的费用，按投资规模的一定比例收取"],"answer":1,"explanation":"A选项说法错误，B选项说法正确，管理费可按照基金规模作为计算基数收取，也可以按照合同约定的其他方式计算并收取。\nC、D选项说法错误，基金管理费是基金管理人因投资管理基金资产而向基金收取的费用。故本题选B选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":26,"origin":"资料模拟题","lesson":"b25","topic":"收益与运营","core":false},{"id":"s3-66-28","subject":3,"stem":"回购退出情形不包括（ ）。","options":["被投资企业管理层自筹资金购买股权投资基金持有的股份（股权）","被投资企业的员工集体出资购买股权投资基金持有的股份（股权）","另一股权投资基金购买股权投资基金持有的股份（股权）","被投资企业控股股东自筹资金购买股权投资基金持有的股份（股权）"],"answer":2,"explanation":"股权回购是指通常由被投资企业大股东或创始股东、管理层、员工等出资购买股权投资基金持有的企业股份，从而使股权投资基金实现退出的行为（简单理解为卖回给被投资企业自己人）。\nA选项描述为管理层回购的情形，属于回购退出，故A选项不符合题意。\nB选项描述为员工回购的情形，属于回购退出，故B选项不符合题意。\nC选项卖给的是\"另一股权投资基金\"，是其他收购方购买股权投资基金所持目标公司的全部或部分股权，使股权投资基金实现退出。属于并购退出。故C选项符合题意。\nD选项描述为股东回购的情形，属于回购退出，故D选项不符合题意。故本题选C选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":28,"origin":"资料模拟题","lesson":"b21","topic":"投后与退出","core":false},{"id":"s3-66-29","subject":3,"stem":"通常股权投资基金的当事人包括（ ）。\nⅠ、基金投资者\nⅡ、基金管理人\nⅢ、基金资产保管机构\nⅣ、基金托管人","options":["Ⅰ、Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅳ","Ⅲ、Ⅳ","Ⅱ、Ⅲ"],"answer":1,"explanation":"基金当事人，即基金合同的当事人，主要包括基金投资者（Ⅰ项）、基金管理人（Ⅱ项）及基金托管人（Ⅳ项）。\nⅢ项，基金资产保管机构是股权投资基金市场服务机构，股权投资基金市场服务机构是股权投资基金的参与主体（而不是当事人）。故排除Ⅲ。综上，Ⅰ、Ⅱ、Ⅳ项符合题意，故本题选B选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":29,"origin":"资料模拟题","lesson":"b25","topic":"收益与运营","core":false},{"id":"s3-66-30","subject":3,"stem":"股权投资基金投资运作中禁止的行为不包括（ ）。","options":["将账户出借给第三方进行交易","开展借新还旧、期限错配业务","直接或间接参与场外配资活动或者为场外配资活动提供服务或便利","与管理人管理的其他基金进行关联交易"],"answer":3,"explanation":"股权投资基金管理人、股权投资基金托管人、股权投资基金销售机构及其他市场服务机构及其从业人员从事股权投资基金业务，不得有以下行为（多为保护投资者权益所需）：\n（1）将其固有财产或者他人财产混同于基金财产从事投资活动;\n（2）不公平地对待其管理的不同基金财产;\n（3）利用基金财产或者职务之便，为本人或者投资者以外的人牟取利益，进行利益输送;或者以利益输送为目的，与特定对象进行不正当交易，或者在不同股权投资基金账户之间转移收益或亏损;\n（4）侵占、挪用基金财产;\n（5）泄露因职务便利获取的未公开信息，利用该信息从事或者明示、暗示他人从事相关的交易活动;\n（6）从事损害基金财产和投资者利益的投资活动;\n（7）玩忽职守，不按照规定履行职责;\n（8）从事内幕交易、操纵市场及其他不正当交易活动;\n（9）未针对每只股权投资基金设置独立账户，或者开展借新还旧、期限错配等业务;\n（10）进行商业贿赂;\n（11）将账户出借给第三方进行交易，或者违反账户实名制的规定，下设子账户、分账户、虚拟账户等;\n（12）直接或间接参与场外配资活动或者为场外配资活动提供服务或便利;\n（13）外接未经监管机构或者自律组织认证的其他交易系统，为违法证券期货业务活动提供端口服务便利;\n（14）通过境外机构或者境外系统下达投资交易指令;\n（15）法律、行政法规和中国证监会规定的其他禁止行为。\nA选项属于（11），B选项属于（9），C选项属于（12）。\nD选项中与管理人管理的其他基金进行关联交易是正当交易行为，不属于禁止行为，D选项符合题意。故本题选D选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":30,"origin":"资料模拟题","lesson":"b04","topic":"组织与治理","core":false},{"id":"s3-66-32","subject":3,"stem":"基金管理人委托基金销售机构募集股权投资基金时，需书面签订销售协议，并将权利义务划分及其他涉及投资者利益的部分作为基金合同的附件。如基金销售协议与作为基金合同附件的关于基金销售的内容不一致的，（ ）。","options":["以基金合同附件为准","通过合同双方协商决定","以基金销售协议为准","以可行的实际操作为准"],"answer":0,"explanation":"股权投资基金管理人委托基金销售机构募集股权投资基金的，应当签订书面基金销售协议，并且协议中关于基金管理人与基金销售机构权利义务划分以及其他涉及投资者利益的部分应当作为基金合同的附件。若基金销售协议与作为基金合同附件的关于基金销售的内容不一致的，以基金合同附件为准。因为基金合同是基金管理人与投资者签署的文件，涉及投资者利益，附件部分的基金销售协议须与基金合同附件为准。故本题选A选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":32,"origin":"资料模拟题","lesson":"b08","topic":"募集与合规","core":false},{"id":"s3-66-33","subject":3,"stem":"关于被投资企业的项目跟踪与监控，下列表述错误的是（ ）。","options":["协助建立规范的财务管理体系的目标是改善企业财务状况","投资机构通常会跟踪被投资企业重大合同等业务经营信息","不同类型的被投资企业适用的经营指标不同","投资机构通常要求被投资企业定期提供财务报表和业绩报告"],"answer":0,"explanation":"A选项说法错误，协助建立规范的财务管理体系的目标是帮助被投资企业建立起以\"规范管理、风险控制和全面预算\"为基本准则的现代财务管理体系。\nB、D选项说法正确，投资机构通常要求被投企业定期提供财务报表和业绩报告，并跟踪被投资企业重大合同等业务经营信息、重大的投资活动和融资活动、公司经营范围的变更、重要管理人员的任免，以及其他可能对公司生产经营、业绩、资产等产生重大影响的事宜。\nC选项说法正确，依据被投资企业自身经营情况，经营指标监控侧重点也有所不同。故本题选A选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":33,"origin":"资料模拟题","lesson":"b20","topic":"投后与退出","core":false},{"id":"s3-66-38","subject":3,"stem":"关于股权回售条款，企业创始人需要关注（ ）。\nⅠ、回售时间\nⅡ、是否分期回售\nⅢ、触发条件\nⅣ、回售价格","options":["Ⅰ、Ⅱ、Ⅲ","Ⅰ、Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅳ","Ⅱ、Ⅲ、Ⅳ"],"answer":1,"explanation":"回售权是指当满足事先设定的条件时，股权投资基金有权要求目标企业大股东按事先约定的定价机制，买回股权投资基金所持有的全部或部分目标企业的股权。回售时间、是否分期回售和回售价格与回售息息相关，关系到企业创始人的利益，需要关注，Ⅰ、Ⅱ、Ⅳ选项符合题意。触发条件是是否能执行回售权的前提，企业创始人需要关注，Ⅲ选项符合题意。综上，Ⅰ、Ⅱ、Ⅲ、Ⅳ项均符合题意，故本题选B选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":38,"origin":"资料模拟题","lesson":"b18","topic":"投资条款","core":false},{"id":"s3-66-39","subject":3,"stem":"有关回售权条款，下列表述正确的是（ ）。","options":["回售权的执行涉及出售方拥有的全部股权，出售方不可以选择仅将持有的部分股权出售","触发条件具备后，投资人可以要求目标公司创始股东按照约定的价格履行相关义务，创始股东不可指定其他相关利益方","满足协议约定的特定触发条件时。股权投资基金可依据回售权条款将其持有的相关目标公司股权以约定的价格出售给目标公司创始股东","回售权是指满足协议约定的特定触发条件时，股权投资基金有权要求公司创始股东以约定的价格出售部分股权给基金"],"answer":2,"explanation":"回售权是指满足协议约定的特定触发条件时，股权投资基金有权将其持有的全部或部分目标公司股权以约定的价格卖给目标公司创始股东或创始股东指定的其他相关利益方。\nA选项表述错误，出售方可以选择将其持有的部分股权出售。\nB选项表述错误，创始股东可以指定其他的相关利益方。\nD选项表述错误，满足触发条件后，是股权投资基金以约定的价格卖出股权，而不是买入股权。\n\n故本题选C选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":39,"origin":"资料模拟题","lesson":"b18","topic":"投资条款","core":false},{"id":"s3-66-43","subject":3,"stem":"股权回购的基本运作程序通常由（ ）构成。\nⅠ、发起\nⅡ、协商\nⅢ、执行\nⅣ、变更登记","options":["Ⅰ、Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅳ","Ⅰ、Ⅲ、Ⅳ","Ⅰ、Ⅲ"],"answer":0,"explanation":"股权回购的基本运作程序通常由发起、协商、执行和变更登记四部分构成。故本题选A选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":43,"origin":"资料模拟题","lesson":"b21","topic":"投后与退出","core":false},{"id":"s3-66-46","subject":3,"stem":"保护性条款的实施主体和实施方向体现了该条款的独特性在于（ ）。","options":["少数股东同意即可通过特定事项","多数股东同意即可通过特定事项","多数股东反对即可终结特定事项","少数股东反对即可终结特定事项"],"answer":3,"explanation":"保护性条款是指股权投资基金为保护自身利益而设置的要求目标公司在执行某些可损害投资者利益或对投资者利益有重大影响的行为时，需取得投资者同意的条款。故本题选D选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":46,"origin":"资料模拟题","lesson":"b18","topic":"投资条款","core":false},{"id":"s3-66-47","subject":3,"stem":"通过投资于多只股权投资基金，母基金的投资得以在地域、行业、投资风格等方面实现多样性，这一特点体现了股权投资母基金的作用是（ ）。","options":["分散风险","专业管理","投资机会","规模优势"],"answer":0,"explanation":"通过分散投资于多只股权投资基金，母基金的投资得以实现多样性，如投资阶段、时间跨度、地域、行业、投资风格等，从而投资者可以有效地实现风险分散。而单只股权投资基金无法使投资者获得如此高的多样性。故本题选A选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":47,"origin":"资料模拟题","lesson":"b05","topic":"组织与治理","core":false},{"id":"s3-66-59","subject":3,"stem":"关于法律尽职调查的目的，表述错误的是（ ）。","options":["了解企业创造价值的机制，预测企业未来估值","充分确认企业产权、业务资质的合法合规","确认目标企业的合法成立和有效存续","核查目标企业所提供文件的真实性、准确性和完整性"],"answer":0,"explanation":"A选项说法错误，业务尽职调查是整个尽职调查工作的核心，目的是了解过去及现在企业创造价值的机制，以及这种机制未来的变化趋势。法律尽职调查更多的是定位于风险发现，而非价值发现。法律尽职调查的内容：\n（1）确认目标公司的合法成立和有效存续;（C选项说法正确）（2）从合规角度核查目标公司所提供文件资料的真实性、准确性和完整性;（D选项说法正确）（3）充分了解目标公司的组织结构、资产和业务的产权状况和法律状态，确认企业产权（如土地所有权）、业务资质以及其控股结构的合法合规;（B选项说法正确）\n\n（4）发现和分析目标公司现存的法律问题和风险并提出解决方案;\n（5）出具法律意见并将之作为准备交易文件的重要依据。故本题选A选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":59,"origin":"资料模拟题","lesson":"b10","topic":"尽调与估值","core":false},{"id":"s3-66-60","subject":3,"stem":"基金管理人内部控制构成要素中的内部环境不包括（ ）。","options":["组织结构","风险控制","内控文化","员工道德素质"],"answer":1,"explanation":"管理人内部控制的要素构成包括：内部环境、风险评估、控制活动、信息与沟通和内部监督。内部环境包括：\n（1）经营理念和内控文化;\n（2）治理结构;\n（3）组织结构;\n（4）人力资源政策;\n（5）员工道德素质等。控制活动是根据风险评估结果，采用相应的控制措施，将风险控制在可承受范围之内。\nB选项中，风险控制属于控制活动要素中的内容。故本题选B选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":60,"origin":"资料模拟题","lesson":"b04","topic":"组织与治理","core":false},{"id":"s3-66-61","subject":3,"stem":"下列关于契约型股权基金清算终止的表述中，错误的是（ ）。","options":["必须按照基金份额持有人出资比例进行分配","基金的清算由清算小组进行","清算小组可以依法进行必要的民事活动","清算小组成员由私募基金管理人和私募基金托管人组成，可以聘用必要的工作人员"],"answer":0,"explanation":"A选项说法错误，信托（契约）型基金支付清算费用及其他应支付的费用后，剩余基金资产按基金合同约定向基金投资者分配。而不是必须按照基金份额持有人出资比例进行分配。\nB选项说法正确，信托（契约）型基金的清算由清算小组负责。\nC选项说法正确，基金财产清算小组负责基金财产的保管、清理、估价、变现和分配。可以依法进行必要的民事活动。\nD选项说法正确，基金清算小组由基金管理人、基金托管人（若有）及相关人员组成。基金清算小组可以聘用必要的工作人员。故本题选A选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":61,"origin":"资料模拟题","lesson":"b21","topic":"投后与退出","core":false},{"id":"s3-66-64","subject":3,"stem":"假设股权投资基金正在对某目标公司进行财务尽职调查，进行偿债能力分析时，以下内容属于应主要关注的财务指标或数据的是（ ）。\nⅠ、流动比率；\nⅡ、或有负债；\nⅢ、资产周转率；\nⅣ、银行可用授信额度；\nⅤ、现金流量状况","options":["Ⅰ、Ⅱ、Ⅳ","Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅳ、Ⅴ"],"answer":3,"explanation":"偿债能力分析包括：计算公司各年度资产负债率、流动比率（Ⅰ项）、速动比率、利息保障倍数等，结合公司的现金流量状况（Ⅴ项）、在银行的资信状况、可利用的融资渠道及授信额度（Ⅳ项）、表内负债、表外融资及或有负债（Ⅱ项）等情况，判断公司的偿债能力和偿债风险。运营能力分析：计算公司各年度资产周转率（Ⅲ项）、存货周转率和应收账款周转率等，结合市场发展、行业竞争、公司生产模式及物流管理、销售模式及赊销政策等情况，分析公司各年度营运能力及其变动情况，判断公司经营风险和持续经营能力。\nⅢ项，资产周转率是衡量企业资产管理效率的重要财务比率，属于运营能力分析的内容。综上所述，Ⅰ、Ⅱ、Ⅳ、Ⅴ符合题意。故本题选D选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":64,"origin":"资料模拟题","lesson":"b10","topic":"尽调与估值","core":false},{"id":"s3-66-69","subject":3,"stem":"股权投资基金的财务尽职调查工作通常启动时点为（ ）。","options":["投资人签署对目标公司的投资协议后","投资人完成目标公司估值后","投资人初次接触目标公司时","投资人与目标公司达成初步合作意向后"],"answer":3,"explanation":"尽职调查，又称审慎性调查，一般是指投资人在与目标企业达成初步合作意向后，经协商一致，对目标企业的一切与本次投资相关的事项进行现场调查、资料分析的一系列活动。\nD选项符合题意。\nA选项不符合题意，签署投资协议是在投资决策后，如果没有尽职调查，不能作出投资决策。\nB选项不符合题意，对目标公司估值后，还需项目立项。也就是在进一步投入更多资源对目标公司进行更加详尽和深入的投资评价之前，引入更高层级的投资管理团队成员或直接提交投资决策成员对项目质量进行判断，节约基金管理成本。\nC选项不符合题意，投资人初次接触目标公司时，需要进行初步的尽职调查，也就是对拟投资项目进行价值判断，并非尽职调查。故本题选D选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":69,"origin":"资料模拟题","lesson":"b10","topic":"尽调与估值","core":false},{"id":"s3-66-70","subject":3,"stem":"对股权投资基金估值时，项目组合中某互联网公司收入波动较大，尚未产生盈利，公司刚完成B轮融资。\n\n最适合对该公司估值的方法是（ ）。","options":["近期交易价格法","乘数法","收入法","有效市场价格法"],"answer":0,"explanation":"A选项符合题意，近期交易价格法适用于相关投资项目发生交易之后一段有限的时间内。如果该投资项目近期接受了新的投资，该近期投资价格为估值提供了依据。题干中公司刚完成B轮融资，适合近期交易价格法。故本题选A选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":70,"origin":"资料模拟题","lesson":"b15","topic":"尽调与估值","core":false},{"id":"s3-66-72","subject":3,"stem":"股权投资基金的形式可分为公司型、合伙型和信托（契约）型三种组织形式，关于基金组织形式及其投资决策描述正确的是（ ）。","options":["公司型基金的最高权力机构是董事会，公司型基金的投资者可以通过参加公司型基金的董事会参与基金的运营决策","合伙型基金的投资者一般以有限合伙人身份存在，有限合伙人可通过在投资决策委员会委派观察员或在咨询委员会中委派委员等方式，在一定程度上了解基金的投资决策并在合理的范围内提供建议","信托（契约）型基金的基金份额持有人大会及其日常机构可以直接参与或者干涉基金的投资管理活动","公司型基金可由公司内部的基金管理运营团队进行管理，通常的形式是在股东会之下设置投资决策委员会，其成员一般由股东会委派"],"answer":1,"explanation":"A选项说法错误，公司型基金的最高权力机构是股东（大）会，在公司型基金中投资者权利较大，在股东大会（股东会）层面对交由决策的重大事项或重大投资进行决策。\nB选项说法正确，合伙型基金的投资者以有限合伙人身份存在，有限合伙人可通过在投资决策委员会委派观察员或在合伙人会议委派委员等方式，在一定程度上了解基金的投资决策并在合理的范围内提供建议。\nC选项说法错误，信托（契约）型基金治理结构的基本特点是基金管理人高度控制基金决策权。基金份额持有人大会及其日常机构不参与基金的投资管理活动，由基金管理人全权负责经营和运作。\n\nD选项说法错误，公司型基金可由公司内部的基金管理运营团队进行投资管理，通常是在董事会之下设投资决策委员会，其成员一般由董事会委派。故本题选B选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":72,"origin":"资料模拟题","lesson":"b03","topic":"组织与治理","core":false},{"id":"s3-66-77","subject":3,"stem":"企业价值与股权价值之间转换时，会运用到简单价值的等式，等式中的\"债务\"不包括（ ）。","options":["短期银行贷款","应付账款","公司付息贷款","长期银行贷款"],"answer":1,"explanation":"简单价值等式为：企业价值+现金=股权价值+债务。简单价值等式中，\"债务\"与资产负债表中的负债不同，只包括要支付利息的负债（如银行贷款），不包括不用支付利息的负债（如应付账款）。故本题选B选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":77,"origin":"资料模拟题","lesson":"b13","topic":"尽调与估值","core":false},{"id":"s3-66-79","subject":3,"stem":"关于股权投资协议中的反摊薄条款，表述错误的是（ ）。","options":["投资人有权根据新一轮融资发行的股数比例价格的不同，调整其股权比例","投资人有权要求召开股东大会，直到变更新的股权比例以保护权益","投资人可通过从公司控股股东处无偿取得股权的方式获得补偿","投资人有权以法律允许的方式调整其股权比例"],"answer":1,"explanation":"反摊薄条款也称为反稀释条款，本质上是一种价格保护机制，适用于后轮融资为降价融资时，用于保护前轮投资者利益的条款。\n\nA选项说法正确，新一轮融资，投资人有权根据发行的股数比例价格的不同，调整其股权比例。\nB选项说法错误，反摊薄条款主要是通过完全棘轮条款和加权平均条款的方式来调整股权比例，不能直接通过股东大会直接变更。\nC、D选项表述正确，后轮融资为降价融资的，投资人有权从公司控股股东无偿取得相应股权，或法律允许的其他任何方式调整其股权比例，在该调整完成前，公司不得增资。故本题选B选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":79,"origin":"资料模拟题","lesson":"b18","topic":"投资条款","core":false},{"id":"s3-66-81","subject":3,"stem":"关于合伙型股权投资基金，表述正确的是（ ）。","options":["所有合伙人对基金债务以出资额为限承担责任","所有合伙人可以按出资份额行使基金投资决策表决权","只有在实现基金整体盈利时才可以进行收益分配","合伙型基金无须缴纳企业所得税"],"answer":3,"explanation":"A选项说法错误，普通合伙人对基金（合伙企业）债务承担无限连带责任。有限合伙人以其认缴的出资额为限对基金（合伙企业）债务承担责任。\nB选项说法错误，合伙企业投资与资产处置的最终决策权应由普通合伙人作出。有限合伙人不参与投资决策，不执行合伙事务，对外不可以代表合伙企业。\nC选项说法错误，基金在项目退出后就可以进行收益分配，无须整体盈利。故本题选D选项。\n【乐知识】合伙企业生产经营所得和其他所得采取\"先分后税\"的原则。合伙企业以每一个合伙人为纳税义务人，合伙企业层面不缴纳所得税。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":81,"origin":"资料模拟题","lesson":"b03","topic":"组织与治理","core":false},{"id":"s3-66-82","subject":3,"stem":"关于创业投资估值法，正确的操作步骤是（ ）。","options":["预估对于项目公司的投资额度、计算目标回报倍数、测算要求持股比例、预计退出的时间长度","预估退出时项目公司的股权价值、计算退出的时间长度、测算可能的股权稀释情况、预计目标回报倍数","预估退出时项目公司的股权价值、计算当前股权价值、测算要求持股比例、预计可能的股权稀释情况","预估项目公司的融资节点、计算项目投资的资金成本、测算项目公司的股权价值、预计退出的时间长度"],"answer":2,"explanation":"创业投资估值法的步骤包括：\n（1）估计目标公司在股权投资基金退出时的股权价值;\n（2）计算当前股权价值;\n\n（3）估计股权投资基金在退出时的要求持股比例;\n（4）估计股权稀释情况，计算投资时的持股比例。故本题选C选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":82,"origin":"资料模拟题","lesson":"b15","topic":"尽调与估值","core":false},{"id":"s3-66-87","subject":3,"stem":"有关拖售权与随售权，下列表述正确的是（ ）。","options":["拖售权的交易价格以股权投资基金与第三方协商确定的价格为准","随售权可以保证投资者作为不参与企业实际经营管理的小股东，同样可以按照其和第三方协商确定的价格及时点决定退出，且不会受到原始股东和管理团队的拒绝","拖售权是股权投资基金欲强行进入其他股东与第三方的交易","相比拖售权，随售权赋予股权投资基金更大的权利，使基金作为少数股东仍然享有决定公司转让的权利"],"answer":0,"explanation":"A选项正确，C选项错误，随售权是股权投资基金欲强行进入其他股东与第三方的交易，交易价格以其他股东与第三方协商确定的价格为准。而拖售权则恰恰相反，是股权投资基金强迫其他股东进入股权投资基金与第三方的交易，交易价格以股权投资基金与第三方协商确定的价格为准。\nB选项错误，拖售权可以保证投资者作为小股东，即使不实际管理、经营企业，在它想要退出的时候，原始股东和管理团队也不得拒绝，必须按照它和并购方达成的并购时间、条件和价格完成并购交易。\nD选项错误，相比随售权，拖售权赋予股权投资基金更大的权利，使其即使作为少数股东，却可以享有通常只有绝大多数股东才能享有的决定公司转让的权利。故本题选A选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":87,"origin":"资料模拟题","lesson":"b17","topic":"投资条款","core":false},{"id":"s3-66-92","subject":3,"stem":"下列关于公司型股权投资基金的说法中，错误的是（ ）。","options":["可采取有限责任公司或股份有限公司两种形式","采用公司的组织形式，投资者是公司股东","参与主体主要为投资者和基金管理人","只能由公司法人实体自行进行管理"],"answer":3,"explanation":"A选项正确，在我国，公司型基金可采取有限责任公司或股份有限公司的形式。\nB选项正确，公司型股权投资基金采用公司的组织形式，投资者是公司股东，依法享有股东权利，并以其投资额为限对公司债务承担有限责任。\nC选项正确，公司型基金的参与主体主要为投资者和基金管理人。\nD选项错误，公司型基金可自行或委托专业基金管理人进行基金管理。公司型基金是企业法人实体。故本题选D选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":92,"origin":"资料模拟题","lesson":"b02","topic":"组织与治理","core":false},{"id":"s3-66-93","subject":3,"stem":"下列不属于股权投资基金特点的是（ ）。","options":["专业性较强","收益波动性较低","投资期限长，流动性较差","投资后管理投入资源较多"],"answer":1,"explanation":"股权投资基金特点包括：\n\n（1）投资期限长、流动性较差（C选项属于）;\n（2）投资后管理投入资源较多（D选项属于）;\n（3）专业性较强（A选项属于）;\n（4）收益波动性较高，属于高风险、高期望收益的资产类别（B选项不属于）。故本题选B选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":93,"origin":"资料模拟题","lesson":"b20","topic":"投后与退出","core":false},{"id":"s3-66-94","subject":3,"stem":"关于合伙型基金，表述正确的是（ ）。","options":["基金是独立企业，应缴纳企业所得税","有限合伙人通常以投资决策委员会成员参与投资决策","普通合伙人可以通过自我管理或者委托其他基金管理人负责基金投资等重大事项的管理与决策","主要参与主体有合伙人、基金管理人以及基金托管人"],"answer":2,"explanation":"A选项说法错误，按照我国税法，有限合伙企业不是企业所得税的纳税主体，而是由合伙人承担纳税义务。\nB选项说法错误，有限合伙人不参与投资决策，不执行合伙事务，对外不可以代表合伙企业。\nC选项说法正确，普通合伙人可自行担任基金管理人或者委托专业的基金管理机构担任基金管理人。负责基金投资等重大事项的管理与决策。\nD选项说法错误，合伙型基金的参与主体包括普通合伙人、有限合伙人和基金管理人。故本题选C选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":94,"origin":"资料模拟题","lesson":"b03","topic":"组织与治理","core":false},{"id":"s3-66-97","subject":3,"stem":"股权投资基金募集资料中，基金条款书常见的内容有（ ）。\nⅠ、投资范围条款；\nⅡ、利润分配条款；\nⅢ、缴款安排条款；\nⅣ、保密条款","options":["Ⅰ、Ⅱ、Ⅲ","Ⅱ、Ⅲ","Ⅰ、Ⅱ","Ⅰ、Ⅱ、Ⅲ、Ⅳ"],"answer":0,"explanation":"基金条款书常见的内容有：经营/投资范围条款、运营成本条款、利润分配条款、资金承诺、缴款安排、退出与份额转让。故本题选A选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":97,"origin":"资料模拟题","lesson":"b19","topic":"投资条款","core":false},{"id":"s3-66-98","subject":3,"stem":"某股权投资基金认缴总额为20亿元且于设立时全部实缴到位，基金收益分配约定为超额收益的10%作为业绩报酬分给基金管理人，90%归至基金投资者。收益分配体系为瀑布式，收益门槛率为每年8%，按单利计算。基金在运营8年后完成了所有投资项目的退出，清算后可分配总额为40亿元。假设基金运营期间未进行分配。（1）关于门槛收益率，下列表述正确的是（ ）。","options":["门槛收益率是指基金向全体投资者返还投资本金后，向基金管理人进行分配直至管理人获得按照门槛收益率计算的投资回报，作为业绩报酬激励基金管理人","如果基金约定了门槛收益率条款，那么基金在分配时除向全体基金投资者返还投资本金外，还应继续向其进行分配直至其获得门槛收益，之后才开始向基金管理人分配业绩报酬","为了保持基金管理人与基金投资者之间的利益一致性及基金运营的合规性，基金需要强制设定相应的门槛收益率","该基金投资者应获得的门槛收益为20亿元"],"answer":1,"explanation":"A选项说法错误，门槛收益率是指在设置了门槛收益率条款的股权投资基金里，向全体基金投资者返还投资本金后，还应继续向基金投资者进行分配，直至投资者获得按照门槛收益率（年化）计算的投资回报（门槛收益）之后，才开始向基金管理人分配业绩报酬。\nB选项说法正确，如果基金约定了门槛收益率条款，项目投资退出的资金先返还至基金投资者，当投资者收回全部投资本金后，再按照约定的门槛收益率向基金投资者分配门槛收益，上述步骤完成后，基金管理人才参与基金的收益分配。\nC选项说法错误，根据股权投资基金与基金管理人的约定，有时候管理人需要先让基金投资者实现某一门槛收益率，之后才可以获得业绩报酬。所以门槛收益率不是强制设定。\nD选项说法错误，基金投资者应获门槛收益为：投资本金×门槛收益率×年数=20×8%×8=12.8（亿元）。故本题选B选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":98,"origin":"资料模拟题","lesson":"b24","topic":"收益与运营","core":false},{"id":"s3-66-99","subject":3,"stem":"某股权投资基金认缴总额为20亿元且于设立时全部实缴到位，基金收益分配约定为超额收益的10%作为业绩报酬分给基金管理人，90%归至基金投资者。收益分配体系为瀑布式，收益门槛率为每年8%，按单利计算。基金在运营8年后完成了所有投资项目的退出，清算后可分配总额为40亿元。假设基金运营期间未进行分配。（2）假设该基金收益分配条款中未设定追赶机制，则基金管理人与基金投资者获得的分配金额分别为（ \n）。","options":["基金管理人可分得金额为1.84亿元，全体基金投资者可分得金额为38.16亿元","基金管理人可分得金额为0.72亿元，全体基金投资者可分得金额为19.28亿元","基金管理人可分得金额为0.72亿元，全体基金投资者可分得金额为39.28亿元","基金管理人可分得金额为1.84亿元，全体基金投资者可分得金额为18.16亿元"],"answer":2,"explanation":"基金收益分配顺序：\n（1）向投资者返还投资本金20亿元，剩余金额：40-20=20（亿元）;\n（2）向投资者分配门槛收益：门槛收益=投资本金×门槛收益率×年数=20×8%×8=12.8（亿元），剩余金额\n=20-12.8=7.2（亿元）;\n（3）无追赶机制，基金管理人与基金投资者进行分配，管理人分得：7.2×10%=0.72（亿元），投资者分得\n：7.2×90%=6.48（亿元）;管理人共分得0.72亿元，全体投资者分得：20+12.8+6.48=39.28（亿元）。故本题选C选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":99,"origin":"资料模拟题","lesson":"b24","topic":"收益与运营","core":false},{"id":"s3-66-100","subject":3,"stem":"某股权投资基金认缴总额为20亿元且于设立时全部实缴到位，基金收益分配约定为超额收益的10%作为业绩报酬分给基金管理人，90%归至基金投资者。收益分配体系为瀑布式，收益门槛率为每年8%，按单利计算。基金在运营8年后完成了所有投资项目的退出，清算后可分配总额为40亿元。假设基金运营期间未进行分配。（3）假设该基金收益分配条款中设有追赶机制，则基金管理人与基金投资者获得的分配金额分别为（ ）。","options":["基金管理人可分得金额为1.87亿元，全体基金投资者可分得金额为38.13亿元","基金管理人可分得金额为2.00亿元，全体基金投资者可分得金额为18.00亿元","基金管理人可分得金额为2.00亿元，全体基金投资者可分得金额为38.00亿元","基金管理人可分得金额为1.87亿元，全体基金投资者可分得金额为18.13亿元"],"answer":2,"explanation":"基金收益分配顺序：\n（1）向投资者返还投资本金20亿元，剩余金额：40-20=20（亿元）;\n（2）向投资者分配门槛收益：门槛收益=投资本金×门槛收益率×年数=20×8%×8=12.8（亿元），剩余金额\n=20-12.8=7.2（亿元）;\n（3）有追赶机制，向管理人分配与投资者门槛收益对应的业绩报酬，业绩报酬：门槛收益=10%：90%，业绩报酬=12.8÷90%×10%≈1.42（亿元），剩余7.2-1.42=5.78（亿元）;\n（4）剩余收益部分，投资者分得：5.78×90%=5.202（亿元），管理者分得：5.78×10%=0.578（亿元）。由此，投资者共分得20+12.8+5.202≈38（亿元），管理人共分得1.42+0.578≈2（亿元）。故本题选C选项。","sourceId":66,"source":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","sourceNumber":100,"origin":"资料模拟题","lesson":"b24","topic":"收益与运营","core":false}],"sources":[{"name":"2025年11月基金从业《法律法规》考试真题及案.pdf","count":12,"id":7},{"name":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","count":37,"id":17},{"name":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","count":40,"id":29},{"name":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","count":28,"id":31},{"name":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷一.pdf","count":52,"id":63},{"name":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷三.pdf","count":50,"id":64},{"name":"2025年基金从业资格《私募股权投资基金基础知识》预测试卷四.pdf","count":39,"id":66}],"stats":{"1":143,"3":179},"core":64}</script><script defer src="./local-auth.js?v=f852f17f1902"></script><script defer src="./config.js?v=631772a381ae"></script><script defer src="./independent-client.js?v=3ecb40f3b722"></script><script defer src="./study.js?v=ea2e9ddc23b1"></script></body></html>
