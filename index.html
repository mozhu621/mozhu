<body><a class="skip" href="#main">跳到主要内容</a><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="dialog"></dialog><script id="study-data" type="application/json">{"version":"2026.09.20-v1","lessons":[{"id":"a01","subject":1,"topic":"基金基础","title":"先认清：基金的钱是谁的","key":"基金财产独立，收益与风险由投资者承担。","points":["管理人负责投资运作；托管人负责保管与监督；持有人享有收益及相应权利。","基金财产与管理人、托管人的固有财产分开；不同基金分别核算。","集合投资、专业管理、组合投资可以分散部分风险，不能消除全部风险。"],"trap":"“托管了就保本”“管理人可以临时借用基金账户”均错误。","example":"两只基金可以持有同一只股票，但不能混用证券账户。","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"a02","subject":1,"topic":"基金基础","title":"金融市场的两组分类","key":"发行 / 流通，看阶段；货币 / 资本，看期限。","points":["一级市场解决新证券的发行，二级市场解决已发行证券的流通。","货币市场主要涉及短期资金融通；资本市场主要涉及中长期融资。","市场主体、客体、价格、方式、中介构成金融市场；不必都有固定实体交易场所。"],"trap":"股票虽可短期持有，仍属于资本市场工具。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"a03","subject":1,"topic":"基金基础","title":"公募、私募、资管计划","key":"“私募基金”与“私募资产管理计划”要分开判断。","points":["公募基金面向社会公众；私募基金面向合格投资者非公开募集。","证券期货经营机构的私募资产管理计划，适用其专门监管规则。","私募不能通过公开宣传基金产品、拆分份额等方式变相突破合格投资者要求。"],"trap":"不要把某类产品的投资范围、信息披露期限套用到所有基金。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"a04","subject":1,"topic":"基金基础","title":"开放式、封闭式、ETF、LOF","key":"交易价格不等于基金份额净值。","points":["开放式基金通常可以按规则申购赎回；封闭式基金存续期间份额通常固定。","ETF同时具有交易和申赎机制；LOF可涉及场内、场外及转托管。","指数基金追踪指数，通常费用较低，但收益并不稳定，也不保证超越指数。"],"trap":"交易所买卖价格由供求等因素影响，可出现折价或溢价。","example":"净值1.20元、市价1.08元：折价率=(1.20−1.08)/1.20=10%。","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"a05","subject":1,"topic":"基金基础","title":"三类基金角色，别记反","key":"投资找管理人，监督保管找托管人，份额记录找登记机构。","points":["管理人：募集、投资管理、估值核算等法定或约定职责。","托管人：安全保管、账户管理、复核监督等；不替代管理人作出投资决策。","登记机构：份额登记、交易确认、投资者账户、权益分配等。"],"trap":"登记机构保管的是份额记录，不等于托管基金资产。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"a06","subject":1,"topic":"职业道德","title":"六条职业道德，用行为识别","key":"守法合规、诚实守信、专业审慎、客户至上、忠诚尽责、保守秘密。","points":["诚实守信：不欺诈、不操纵、不进行内幕或利用未公开信息交易；是核心规范。","专业审慎：具备能力、充分研究、合理依据、审慎决策。","客户至上：投资者利益优先、公平对待；忠诚尽责并不要求服从违法指令。"],"trap":"一道案例可能触及多项规范；组合题必须逐项判断，不能只选最熟悉的一条。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"a07","subject":1,"topic":"职业道德","title":"内幕交易、未公开信息交易、操纵市场","key":"看信息来源和行为方式，再定性质。","points":["内幕信息依法界定；基金交易计划、未公开持仓等也可能构成受保护的未公开信息。","利用职务信息抢先交易，不能因借用亲属账户而免责。","对倒、虚假申报、散布虚假信息影响价格等，可能构成操纵市场。"],"trap":"“听到未公开消息买入”与“编造消息推高股价”不是同一种行为。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"a08","subject":1,"topic":"职业道德","title":"客户至上：利益冲突怎么做","key":"先识别、再管理，公平对待不同基金和投资者。","points":["不能为亲属持有的某只基金倾斜投资机会。","有关联关系并不自动等于禁止交易；要按适用规则履行审批、回避、披露等程序。","选券商、投项目应有客观商业依据，不能由私人交情主导。"],"trap":"“符合投资比例”不能使利益输送合法。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"a09","subject":1,"topic":"职业道德","title":"保密与廉洁从业","key":"离职后也有保密义务，变相好处也可能是不当利益。","points":["不向朋友、客户或媒体泄露未公开持仓、交易计划和商业秘密。","依法履行监管报送义务与随意提供信息不同；先核实用途、权限和程序。","安排亲属就业、报销旅游费用等也可能构成利益输送。"],"trap":"是否直接收到现金，不是判断廉洁风险的唯一标准。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"a10","subject":1,"topic":"职业道德","title":"中国特色金融文化","key":"诚实守信、以义取利、稳健审慎、守正创新、依法合规。","points":["坚持金融服务实体经济，合理盈利与履行金融功能相协调。","稳健审慎要求合理承担和管理风险，不急功近利。","守正创新要在法治轨道内推进，不能以创新名义规避监管。"],"trap":"金融的商业属性不能脱离服务实体经济的功能。","example":"","source":"上传资料：2025年11月科目1回忆题；2026年科目1大纲第八章","new":true,"minutes":3},{"id":"a11","subject":1,"topic":"销售与适当性","title":"适当性：三步配对","key":"了解投资者、了解产品、将适当产品提供给适当投资者。","points":["C表示投资者风险承受能力，R表示产品风险等级；通常都分五级。","合格投资者门槛与适当性匹配是两道不同的判断。","客户签字不免除销售机构依法履行调查、风险揭示和匹配等义务。"],"trap":"有钱并不代表能承受所有风险；不能代填问卷和代签。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"a12","subject":1,"topic":"销售与适当性","title":"宣传推介中的红线","key":"充分揭示风险，不保本、不预测、不片面展示。","points":["过往业绩不代表未来表现，不能用历史高收益暗示收益保证。","宣传材料应按机构制度审核，不能由销售人员随意自制。","私募产品要先确定特定对象，再按规则推介。"],"trap":"“本金不会亏”“预计必达收益”“只展示最赚钱项目”都要警惕。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"a13","subject":1,"topic":"销售与适当性","title":"认购与申购的计算","key":"先扣费用，再除以相应净值；注意利息和确认日。","points":["前端外扣法：净申购金额=申购金额/(1+申购费率)。","申购份额=净申购金额/申购日基金份额净值，不能随意改用确认日净值。","认购题如明确募集期利息折份额，应在净认购金额中加利息，再除以面值。"],"trap":"按题目给定费率与规则计算，不把例题费率当成法定统一费率。","example":"申购10,100元，费率1%，当日净值1元：净额10,000元，份额10,000份。","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"a14","subject":1,"topic":"销售与适当性","title":"赎回与折价率","key":"先算赎回总额，再扣赎回费用。","points":["赎回总额=赎回份额×赎回日份额净值。","赎回费=赎回总额×赎回费率；到账净额=总额−费用。","封闭式基金折价率=(净值−市价)/净值。"],"trap":"申购常按金额，赎回常按份额；不要把基金资产总值当资产净值。","example":"赎回1,000份，净值1.20元，题设赎回费1%：到账1,188元。","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"a15","subject":1,"topic":"监管与内控","title":"监管主体各管什么","key":"证监会行政监管，基金业协会行业自律。","points":["行政监管与行业自律有不同性质和权限。","广义基金监管还包括机构内部监督、独立审计、社会监督等。","基金业协会登记备案不构成对投资能力或持续合规的认可，也不保证资产安全。"],"trap":"协会不是政府行政机关；备案不是收益背书。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"a16","subject":1,"topic":"监管与内控","title":"董事会、经理层、合规部门","key":"风险管理覆盖所有业务和人员。","points":["董事会对有效风险管理承担最终责任；经理层组织实施。","业务部门承担本部门风险管理责任；基金经理对相应组合风险负首要管理责任。","合规部门须保持独立，其职责是识别、评估、监督等，不承担投资决策职责。"],"trap":"“业务发展阶段可以暂缓风控”“合规等于保证赚钱”均错误。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"a17","subject":1,"topic":"监管与内控","title":"内部控制：五要素与三层制度","key":"环境、评估、控制、沟通、监督。","points":["五要素：内部环境、风险评估、控制活动、信息与沟通、内部监督。","制度层次通常为内部控制大纲、基本管理制度、部门业务规章。","不相容岗位分离、授权审批、独立核算、相互制约属于具体控制。"],"trap":"建立了制度不等于有效执行；风险只能管理，不能承诺消除。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"a18","subject":1,"topic":"监管与内控","title":"托管发现违规指令怎么办","key":"未执行的违规指令：拒绝执行、通知管理人、及时报告。","points":["托管人履行投资监督义务，不自行改写管理人的投资指令。","对依据交易程序已经生效的违规投资指令，应按规定及时通知、报告。","监督职责不会把投资管理责任转移给托管人。"],"trap":"注意题目问“尚未执行”还是“已经生效”。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"a19","subject":1,"topic":"监管与内控","title":"反洗钱：识别、保存、报告","key":"客户尽职调查与交易监测是持续义务。","points":["识别客户及受益所有人，了解业务关系和交易目的。","按适用规则保存客户身份资料和交易记录，报告大额及可疑交易。","保护调查和报告信息，不向客户泄露依法保密的反洗钱事项。"],"trap":"风险测评、合格投资者确认、反洗钱调查彼此不能替代。","example":"","source":"上传资料：科目1三色笔记；2026年科目1大纲5.4","new":false,"minutes":3},{"id":"a20","subject":1,"topic":"新版补充","title":"2026大纲：别只刷旧章节","key":"科目1现名《基金基础知识与法律法规》，新版含八章。","points":["按官方大纲，补看私募资产管理计划、绩效考核、廉洁从业及行业文化。","大纲新增参考包括2026年绩效考核指引、2026年贪污贿赂司法解释（二）、2025年反不正当竞争法。","党纪相关内容需区分适用对象，不能把党纪处分直接套用于所有从业人员。"],"trap":"本页是冲刺重点索引，不是新增规则全文；具体数字及构成要件应打开官方材料核对。","example":"","source":"2026年科目1官方大纲（第4、7、8章及参考规则）","new":true,"minutes":3},{"id":"a21","subject":1,"topic":"新版补充","title":"私募信息披露的新数字","key":"股权：半年2个月、全年6个月；创投：年度6个月。","points":["自2026年9月1日起，私募股权基金半年报告在上半年结束后2个月内，年度报告在年度结束后6个月内披露。","创业投资基金按新规编制年度报告；私募证券基金季度1个月、年度4个月，不能混记。","重大事项按新规在发生后5个工作日内临时披露；相关披露资料自基金清算结束起至少保存20年。"],"trap":"旧私募股权“季度10个工作日、年度4个月”的口径不能继续混用。","example":"","source":"证监会令第233号：第19、20、22、23、25、27、34、44条","new":true,"minutes":3},{"id":"b01","subject":3,"topic":"组织与治理","title":"私募股权：先搭起四阶段框架","key":"募、投、管、退贯穿基金生命周期。","points":["主要投资非公开交易股权，投资期限较长、流动性较低、估值较复杂。","项目间回报不均衡，专业性和投后管理要求较高。","非公开募集强调合格投资者和非公开推介，不能变相公开募集。"],"trap":"“高期望收益”不等于“收益稳定”或“必然盈利”。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"b02","subject":3,"topic":"组织与治理","title":"公司型、合伙型、契约型","key":"三种形式，先看法律关系，再看责任和税。","points":["公司型：公司章程是重要依据，具有法人资格。","有限合伙型：GP通常执行事务并承担无限连带责任；LP通常不执行事务，以认缴出资额为限承担责任。","契约型：以基金合同约定权利义务，不具有独立法人资格。"],"trap":"GP是有限责任公司，不意味着合伙企业层面的GP责任变成有限责任。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"b03","subject":3,"topic":"组织与治理","title":"GP与LP的易错点","key":"LP有限责任，不以劳务出资，不对外代表有限合伙企业。","points":["GP可以自己管理或依法委托基金管理人，GP与管理人不是必然同一主体。","LP的监督、建议等法定允许行为不当然等于执行合伙事务。","合伙企业采取先分后税原则：由各合伙人依法纳税。"],"trap":"“先分后税”不等于只有现金分到手才缴税；也不等于合伙人免税。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"b04","subject":3,"topic":"组织与治理","title":"信义义务：忠实与勤勉","key":"忠实看利益冲突，勤勉看专业与审慎。","points":["忠实义务要求将受益人利益置于优先位置，公平处理关联交易和机会分配。","勤勉义务要求配备适当团队、合理研究、审慎决策并认真履职。","单个项目亏损不当然证明违反勤勉义务，应结合决策过程与组合长期表现判断。"],"trap":"不能用“投资者已签字”免除管理人的法定义务。","example":"","source":"上传资料：私募新增重要考点1—3；2026年科目3大纲第二章","new":true,"minutes":3},{"id":"b05","subject":3,"topic":"组织与治理","title":"VC、并购基金、FOF、S基金","key":"VC看成长，并购看控制，FOF投基金，S基金做接续交易。","points":["创业投资基金主要支持创业企业；并购基金通常投资较成熟企业并可能取得控制权。","FOF主要通过配置基金实现专业筛选与分散，可能存在费用叠加。","S基金围绕二手基金份额或投资组合等进行投资，关注剩余期限、资产质量、定价和转让约束。"],"trap":"S交易不是只看底层公司价格，还要看基金费用、未缴承诺、分配及法律条款。","example":"","source":"上传资料：私募三色笔记、预测卷；2026年科目3大纲第三章","new":true,"minutes":3},{"id":"b06","subject":3,"topic":"组织与治理","title":"政府基金与基金治理","key":"政策目标与市场化、专业化运作相结合。","points":["政府投资基金要引导资本支持重点领域、薄弱环节，不能简单理解成行政化选项目。","基金治理关注利益一致、公平、审慎、透明，管理人与投资者权责清晰。","团队跟投、业绩报酬、回拨等可以形成激励约束，但需防止不当利益安排。"],"trap":"政府背景不等于财政保本担保。","example":"","source":"上传资料：私募新增重要考点；2026年科目3大纲第三、八章","new":true,"minutes":3},{"id":"b07","subject":3,"topic":"募集与合规","title":"合格投资者：三组门槛","key":"一般标准：单只100万；单位净资产1000万；个人金融资产300万或近三年年均收入50万。","points":["门槛之外，还需具备相应风险识别与承担能力。","个人的房地产一般不计入金融资产。","法定视为合格投资者的情形应单独判断，不能简单套全部一般门槛。"],"trap":"个人金融资产和收入条件是“或者”；不能靠多人拼单绕过门槛。","example":"","source":"上传资料：私募数字归纳、应知应会DOCX；私募投资基金监督管理暂行办法第12—13条","new":false,"minutes":3},{"id":"b08","subject":3,"topic":"募集与合规","title":"募集程序，用顺序记忆","key":"特定对象→风险评级与匹配→风险揭示→合格确认→冷静期→回访。","points":["先确定特定对象，不能先向所有人推介产品再补程序。","风险评级评价产品，适当性匹配把产品与投资者联系起来。","募集机构可以自行募集其管理的基金，或依法委托合格销售机构。"],"trap":"股权基金冷静期安排与私募证券基金的具体规则要分开看，不能把所有产品一律记成同一数字。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"b09","subject":3,"topic":"募集与合规","title":"回访问什么，谁来承担责任","key":"确认本人、理解合同、知悉风险、了解纠纷解决安排。","points":["投资者应如实填报信息并承诺为自己购买，不得非法拆分转让。","机构不能代填风险问卷、代签风险揭示文件。","委托销售或其他服务，不当然免除管理人依法承担的责任。"],"trap":"把合同交给客户，不代表已经完成风险揭示和适当性工作。","example":"","source":"先前材料：《（私募）基金应知应会真题-3(2)》第7、15、18题","new":false,"minutes":3},{"id":"b10","subject":3,"topic":"尽调与估值","title":"业务、财务、法律尽调","key":"业务找价值逻辑，财务验数字，法律查权利和合规。","points":["业务尽调：商业模式、市场、团队、技术和竞争力。","财务尽调：收入真实性、现金流、资产负债、会计政策、或有负债。","法律尽调：主体、股权、资质、重大合同、知识产权、诉讼、劳动等。"],"trap":"财务尽调不等于审计；尽调发现风险后还要评估和安排应对。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"b11","subject":3,"topic":"尽调与估值","title":"投前与投后估值","key":"投后=投前+新增投资；新增持股比例=投资额/投后估值。","points":["先确认题目给的是投前还是投后估值。","新增出资用于增资时按相应增资逻辑；老股转让款通常不进入公司。","连续融资要考虑每一轮对原股东的稀释，不能简单加持股比例。"],"trap":"把投资额除以投前估值，是最常见的分母错误。","example":"投前4,000万元，新增投资1,000万元：投后5,000万元，投资人持股20%。","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"b12","subject":3,"topic":"尽调与估值","title":"估值倍数：分子要配对","key":"PE对应股权价值，EV倍数对应企业价值。","points":["PE=股权价值/净利润；PB=股权价值/净资产；PS=股权价值/营业收入（按题设口径）。","EV/EBITDA使用企业价值与息税折旧摊销前利润匹配。","可比公司行业、成长、盈利和风险应尽量可比，不能机械套倍数。"],"trap":"利润为负时PE难以直接适用；经营利润不能未经调整就当净利润。","example":"净利润2,000万元，可比PE15倍：股权价值3亿元。","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"b13","subject":3,"topic":"尽调与估值","title":"企业价值与股权价值","key":"简化关系：股权价值=企业价值−有息债务+现金。","points":["先看题目给出的企业价值是否已包含某些资产，避免重复相加。","若题设单列非经营性资产且企业价值未包括，应按题目调整。","应付账款等经营性负债通常不直接当成这里的有息债务。"],"trap":"不能把全部负债都无差别从企业价值里再扣一遍。","example":"企业价值10亿元，有息债务3亿元，现金1亿元：股权价值8亿元。","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"b14","subject":3,"topic":"尽调与估值","title":"DCF：现金流与折现率匹配","key":"企业自由现金流配WACC，股权自由现金流配股权资本成本。","points":["预测各期现金流、选择折现率、估算终值，再折现加总。","企业自由现金流模型先得到企业价值，再转换为股权价值。","终值也要折回估值时点；估值对假设敏感。"],"trap":"只折现预测期现金流、不折现终值，会高估结果。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"b15","subject":3,"topic":"尽调与估值","title":"创业投资估值与近期融资价格","key":"从未来退出价值折回现在，再考虑融资和稀释。","points":["创业投资估值法：估计退出价值→按目标回报折现→测算持股→考虑后续稀释。","未来退出价值/(1+r)^n是常见折现计算。","近期融资价格可作估值参考，但还要考察交易独立性及此后重大变化。"],"trap":"不能把最近一轮价格永久视作公允价值。","example":"预计3年后股权价值8亿元，目标年回报100%：当前价值8/(1+100%)³=1亿元。","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"b16","subject":3,"topic":"投资条款","title":"新股与老股：两种优先权","key":"新发行看优先认购，老股转让看第一拒绝权。","points":["优先认购：按约定优先认购新增股份，保护原有比例。","第一拒绝权：其他股东对外售股时，按同等条件优先购买。","具体适用范围及程序以合法有效的章程、协议和适用规则为准。"],"trap":"“公司增资”不是“创始人卖老股”。","example":"原持股10%，新发500股：按同比例优先认购可认50股。","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"b17","subject":3,"topic":"投资条款","title":"随售与拖售：谁跟谁卖","key":"随售是我跟你卖；拖售是你跟我卖。","points":["随售权：其他股东卖出时，投资人有权按约定共同出售。","拖售权：符合条件时，权利人可要求其他股东一同出售。","两者都涉及退出安排；触发门槛、比例和条件应看协议。"],"trap":"不要把随售当优先购买，也不要把拖售当回购。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"b18","subject":3,"topic":"投资条款","title":"回售、反摊薄、保护性条款","key":"回售是退出请求，反摊薄是低价融资保护，保护性条款是重大事项制衡。","points":["回售可约定业绩、上市或重大违约等触发情形，不能忽视法律效力与履约能力。","反摊薄通常针对后续低价融资；常见完全棘轮、加权平均等机制。","保护性条款常对重大事项设置特殊表决或同意要求。"],"trap":"保护条款不意味着投资风险被消灭。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"b19","subject":3,"topic":"投资条款","title":"排他、保密与竞业限制","key":"排他管谈判，保密管信息，竞业限制管竞争行为。","points":["排他性条款通常约定一定谈判期间，限制与其他投资人同时谈判。","保密条款限制信息披露与使用。","竞业限制等安排须结合适用法律、人员、期限和补偿要求判断。"],"trap":"不要把“保密条款”与“禁止投资人投资任何竞争项目”直接画等号。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"b20","subject":3,"topic":"投后与退出","title":"投后管理：监控加增值服务","key":"管风险，也帮助企业创造价值。","points":["监控：经营报告、财务指标、实地走访、董事会参与等。","增值服务：战略、治理、人才、融资、资源对接等。","不应把日常生产经营全部接管，也不把干预越多当作越尽责。"],"trap":"参与董事会观察与担任职工代表监事不是同一回事。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"b21","subject":3,"topic":"投后与退出","title":"四种退出路径","key":"上市转让、挂牌转让、协议转让、清算退出。","points":["IPO可能有审核注册、锁定期及股价风险，不代表一定即时退出。","协议转让可面向产业买家、其他财务投资者；回购属于常见安排之一。","清算要先依法支付费用、清偿债务，剩余财产再分给股东或投资者。"],"trap":"另一家基金接盘通常是股权转让，不是原股东或管理层回购。","example":"","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"b22","subject":3,"topic":"收益与运营","title":"DPI、RVPI、TVPI：最值得拿的计算分","key":"DPI已分、RVPI剩余、TVPI两者相加；分母都是实缴资本。","points":["DPI=累计分配/累计实缴资本。","RVPI=期末剩余价值/累计实缴资本。","TVPI=(累计分配+期末剩余价值)/累计实缴资本=DPI+RVPI。"],"trap":"倍数不等于年化收益率；不要把认缴额放到分母。","example":"实缴100、已分60、剩余90：DPI0.6，RVPI0.9，TVPI1.5。","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"b23","subject":3,"topic":"收益与运营","title":"IRR与净IRR","key":"IRR让净现值等于0，必须考虑现金流的时间。","points":["只有一次期初投入和一次期末回收时，可用(回收/投入)^(1/年数)−1。","多期现金流需逐期折现求解，不能把总收益率简单除以年数。","毛IRR与净IRR要分清是否扣除管理费、业绩报酬等，以及计算站在谁的角度。"],"trap":"相同TVPI可能对应完全不同的IRR；越早回收通常越有利。","example":"期初100，2年后121，中间无现金流：IRR=10%。","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"b24","subject":3,"topic":"收益与运营","title":"瀑布分配：先看有没有追赶","key":"本金→门槛收益→追赶（如有）→剩余分成。","points":["无追赶：按题设比例分配超过本金与门槛收益后的余额。","有追赶：按合同先向管理人追赶至约定比例，再分剩余。","回拨：最终核算后，将超分的业绩报酬返还，保护投资者约定权益。"],"trap":"门槛收益不等于保本承诺；单利、复利、费用及期间必须读清。","example":"本金100，1年后130，门槛8%单利，无追赶，超额收益20%给管理人：管理人(130−100−8)×20%=4.4。","source":"上传资料：三色笔记、超高频考点","new":false,"minutes":3},{"id":"b25","subject":3,"topic":"收益与运营","title":"核算、托管和资本账户","key":"基金是核算主体，管理人承担相应会计责任。","points":["基金财产与管理人固有财产、不同基金财产分别管理与核算。","外包估值、会计等服务不意味着管理人的法定责任自动转移。","资本账户记录投资者的缴款、收益分配及其他约定调整，认缴额不等于已缴金额。"],"trap":"托管人安全保管与复核监督，并非基金估值的主要责任主体。","example":"","source":"上传资料：私募三色笔记；应知应会DOCX第8题；2026年科目3大纲第九章","new":false,"minutes":3},{"id":"b26","subject":3,"topic":"新版披露","title":"2026年起：股权与证券分开记","key":"股权半年2个月、年度6个月；证券季度1个月、年度4个月。","points":["新办法自2026年9月1日起施行，股权基金与证券基金披露节奏不同。","创业投资基金编制年度报告，内容、时间与审计按私募股权年度要求。","成立不足3个月的，可按新规不编制当期相应定期报告。"],"trap":"旧资料的私募股权季度披露口径已剔除；不要把证券基金年度4个月套给股权。","example":"","source":"证监会令第233号第19、20、22—26、44条","new":true,"minutes":3},{"id":"b27","subject":3,"topic":"新版披露","title":"重大事项、审计与保存期限","key":"重大事项5个工作日；披露资料清算结束后至少20年。","points":["股权基金年度财务会计报告应按新规审计。","管理人委托销售机构等披露，不免除其信息披露义务；受托机构不得擅改内容。","披露面向投资者并按约定方式非公开进行，不能选择性披露历史业绩或承诺最大损失。"],"trap":"20年指新办法的信息披露资料保存要求，不是把所有业务记录一律改为20年。","example":"","source":"证监会令第233号第4、10、17、24、27、34条","new":true,"minutes":3}],"questions":[{"id":"core-1-1","subject":1,"topic":"基金基础","lesson":"a01","stem":"下列做法符合基金财产独立要求的是？","options":["把基金资产转入管理人日常账户","为不同基金分别建账核算","用基金账户临时支付公司工资","将托管作为本金保证"],"answer":1,"explanation":"不同基金分别核算符合财产独立要求。A、C混同或挪用财产；D把托管与保本混淆。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-2","subject":1,"topic":"基金基础","lesson":"a02","stem":"投资者从另一投资者手中购买已经发行的股票，主要发生在哪类市场？","options":["一级市场","发行市场","二级市场","货币市场"],"answer":2,"explanation":"已发行证券的转手交易属于二级市场。一级市场解决发行，货币市场主要进行短期资金融通。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-3","subject":1,"topic":"基金基础","lesson":"a03","stem":"私募基金推介的正确顺序是？","options":["公开推介后核实对象","向任何人展示收益后补签协议","先确定特定对象，再按规则推介","先向不合格投资者收款再补材料"],"answer":2,"explanation":"非公开募集要求先确定特定对象。事后补材料不能修复向不特定对象推介等不当行为。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-4","subject":1,"topic":"基金基础","lesson":"a04","stem":"基金份额净值1.20元，交易市价1.08元，折价率为？","options":["10%","11.11%","12%","−10%"],"answer":0,"explanation":"折价率=(1.20−1.08)/1.20=10%。分母是净值；市价低于净值表现为折价。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-5","subject":1,"topic":"基金基础","lesson":"a05","stem":"负责基金份额登记、交易确认和投资者份额账户管理的机构是？","options":["投资顾问","基金销售网点","基金注册登记机构","审计机构"],"answer":2,"explanation":"登记机构负责份额记录与确认。投资决策、资产保管和审计分别属于其他职责。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-6","subject":1,"topic":"职业道德","lesson":"a06","stem":"分析师不核实目标企业给出的数据，直接作为投资建议依据，主要违反哪项要求？","options":["保守秘密","专业审慎","允许利益冲突","收入最大化"],"answer":1,"explanation":"专业审慎要求充分研究、合理依据和必要核实。照搬材料而不作判断不能满足勤勉要求。","source":"先前应知应会DOCX第3题改编","sourceNumber":null,"origin":"材料改编题","core":true},{"id":"core-1-7","subject":1,"topic":"职业道德","lesson":"a07","stem":"通过多个实际控制账户相互交易，制造成交活跃并推高股价，主要属于？","options":["正常分散投资","操纵市场","客户风险评级","基金转托管"],"answer":1,"explanation":"对倒制造交易并影响价格属于操纵市场典型情形。不能因账户名义不同就视为独立正常交易。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-8","subject":1,"topic":"职业道德","lesson":"a08","stem":"基金经理只让其亲属重仓的一只基金获得优质投资机会，主要违反？","options":["客户至上与公平对待","基金财产独立的会计分录要求","市场公开报价要求","投资者自主决策原则"],"answer":0,"explanation":"公平对待不同基金和投资者是客户至上的要求，不能因亲属利益安排机会分配。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-9","subject":1,"topic":"职业道德","lesson":"a09","stem":"员工离职后，向朋友透露原机构未公开投资计划，哪项判断正确？","options":["离职后保密义务自动消失","只要没有收钱就可以","只要朋友不交易就可以","可能违反持续保密义务"],"answer":3,"explanation":"保密义务并非随离职自动消失。没有收钱或尚未发生交易，也不当然使泄露行为合规。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-10","subject":1,"topic":"职业道德","lesson":"a10","stem":"下列哪项属于中国特色金融文化的要求？","options":["急功近利","以创新名义规避监管","稳健审慎","唯短期收益论"],"answer":2,"explanation":"稳健审慎是中国特色金融文化的重要内涵，强调合理管理风险与长期稳健发展。","source":"上传资料：2025年11月科目1回忆题；2026年科目1大纲第八章","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-11","subject":1,"topic":"销售与适当性","lesson":"a11","stem":"关于适当性管理，正确的是？","options":["合格投资者可自动匹配所有风险等级","签字后机构可免除所有义务","投资者调查、产品了解、适当匹配需要共同落实","收入越高越无需风险提示"],"answer":2,"explanation":"合格门槛与风险匹配是不同判断；签字、高收入均不能代替机构履行法定义务。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-12","subject":1,"topic":"销售与适当性","lesson":"a11","stem":"产品风险等级通常用R表示，投资者风险承受能力类型通常用什么表示？","options":["C","P","IRR","NAV"],"answer":0,"explanation":"C表示客户风险承受能力类型，R表示产品风险等级，不要颠倒主体。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-13","subject":1,"topic":"销售与适当性","lesson":"a12","stem":"下列宣传表述中合规性最强的是？","options":["过去每年都赚钱，未来也一样","过往业绩不代表未来表现，投资可能发生损失","收益最低8%，亏损补足","托管银行会确保本金安全"],"answer":1,"explanation":"B表达历史业绩局限并揭示风险。其余含预测、保本或最低收益承诺。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-14","subject":1,"topic":"销售与适当性","lesson":"a13","stem":"申购10,100元，题设前端费率1%，申购日净值1元，确认日净值1.02元，应确认多少份？","options":["9,803.92份","10,100份","10,000份","9,999份"],"answer":2,"explanation":"净申购金额=10,100/1.01=10,000元；份额=10,000/1=10,000份。不能用确认日净值1.02。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-15","subject":1,"topic":"销售与适当性","lesson":"a13","stem":"认购10,100元，前端费率1%，募集利息5元折为份额，面值1元。认购份额为？","options":["10,005份","10,105份","10,000份","9,995份"],"answer":0,"explanation":"净认购金额10,000元，加题设利息5元后除以面值1元，得10,005份。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-16","subject":1,"topic":"销售与适当性","lesson":"a14","stem":"赎回1,000份，净值1.20元，题设赎回费率1%，到账金额为？","options":["1,200元","1,188元","1,190元","1,212元"],"answer":1,"explanation":"总额1,200元，费用12元，净额1,188元。费率由题目给定，不代表统一法定费率。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-17","subject":1,"topic":"监管与内控","lesson":"a15","stem":"中国证券投资基金业协会的性质最恰当的是？","options":["行政机关","基金收益担保机构","行业自律组织","国家司法机关"],"answer":2,"explanation":"协会履行行业自律职责，行政监管和司法职责由相应机关承担。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-18","subject":1,"topic":"监管与内控","lesson":"a15","stem":"私募基金完成登记备案，意味着什么？","options":["投资不会亏损","协会保证管理人能力","满足相应登记备案程序，并非收益或能力背书","任何销售行为均被认可"],"answer":2,"explanation":"登记备案不是行政信用背书，不构成能力认可或资产安全保证。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-19","subject":1,"topic":"监管与内控","lesson":"a16","stem":"对公司有效风险管理承担最终责任的通常是？","options":["基金投资者","董事会","销售渠道","外部研究员"],"answer":1,"explanation":"董事会承担最终责任；经理层组织实施；业务部门和具体人员各有风险管理职责。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-20","subject":1,"topic":"监管与内控","lesson":"a17","stem":"以下哪组是内部控制的五个基本要素？","options":["营销、销售、定价、广告、收益","环境、评估、控制、沟通、监督","利润、收入、资产、负债、费用","登记、托管、募集、退出、分红"],"answer":1,"explanation":"五要素为内部环境、风险评估、控制活动、信息与沟通、内部监督。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-21","subject":1,"topic":"监管与内控","lesson":"a18","stem":"托管人发现一项尚未执行的投资指令违法，正确做法是？","options":["自行修改后执行","先执行再观察","拒绝执行，通知管理人并及时报告","只向投资者投诉"],"answer":2,"explanation":"对尚未执行的违规指令应拒绝执行，立即通知管理人并及时向监管报告。托管人无权自行改写指令。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-22","subject":1,"topic":"监管与内控","lesson":"a19","stem":"反洗钱义务与投资者风险测评的关系是？","options":["测评完成可替代客户尽职调查","两者目的不同，不能互相替代","客户有钱即可省略","仅在客户发生亏损后才开展"],"answer":1,"explanation":"反洗钱关注身份、受益所有人及可疑交易等；风险测评关注投资风险承担能力，二者不能替代。","source":"上传资料：科目1三色笔记；2026年科目1大纲5.4","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-23","subject":1,"topic":"新版补充","lesson":"a21","stem":"按2026年9月1日起施行的新办法，私募股权基金年度报告通常应在年度结束后多久披露？","options":["1个月","2个月","4个月","6个月"],"answer":3,"explanation":"新办法第23条规定私募股权基金年度结束后6个月内披露年度报告。4个月是私募证券基金的年度报告期限。","source":"证监会令第233号：第19、20、22、23、25、27、34、44条","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-24","subject":1,"topic":"新版补充","lesson":"a21","stem":"新办法要求，私募基金重大事项临时披露通常在事项发生后多久内？","options":["5个工作日","10个自然日","20个工作日","下一年度报告时"],"answer":0,"explanation":"第27条为发生后5个工作日内。注意工作日与自然日、定期报告与临时报告的区分。","source":"证监会令第233号：第19、20、22、23、25、27、34、44条","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-25","subject":1,"topic":"新版补充","lesson":"a21","stem":"新办法中的信息披露相关文件资料，自基金清算结束之日起至少保存？","options":["5年","10年","15年","20年"],"answer":3,"explanation":"第34条要求自基金清算结束之日起不少于20年。本题特指信息披露资料，不泛指所有业务记录。","source":"证监会令第233号：第19、20、22、23、25、27、34、44条","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-1-26","subject":1,"topic":"职业道德","lesson":"a06","stem":"忠诚尽责是否要求从业人员无条件服从上级？","options":["是，任何指令都须服从","否，违法违规指令不能因上级要求而执行","只有涉及自己亏损才能拒绝","口头指令一律免责"],"answer":1,"explanation":"忠诚尽责不要求执行违法违规指令；从业人员须守法合规并按制度报告。","source":"先前应知应会DOCX第5题改编","sourceNumber":null,"origin":"材料改编题","core":true},{"id":"core-3-27","subject":3,"topic":"组织与治理","lesson":"b01","stem":"股权投资基金的典型特征是？","options":["高流动性、收益稳定","短期限、每日刚性兑付","期限较长、流动性较低、估值较复杂","没有信息不对称"],"answer":2,"explanation":"非公开股权难以随时交易，项目价值评估复杂，回报分布也不均匀。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-28","subject":3,"topic":"组织与治理","lesson":"b02","stem":"有限合伙基金中，GP对合伙企业债务通常承担？","options":["无限连带责任","仅以其认缴出资为限","不承担任何责任","由托管银行全部承担"],"answer":0,"explanation":"GP承担无限连带责任；LP通常以认缴出资额为限承担责任。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-29","subject":3,"topic":"组织与治理","lesson":"b03","stem":"以下关于LP的描述正确的是？","options":["可以劳务出资","必须对外代表有限合伙企业","依法承担有限责任，通常不执行合伙事务","与GP承担相同的无限连带责任"],"answer":2,"explanation":"LP不以劳务出资，通常不执行事务、不对外代表，依法承担有限责任。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-30","subject":3,"topic":"组织与治理","lesson":"b04","stem":"管理人将自身利益置于投资者利益之上，主要违反哪项信义义务？","options":["忠实义务","保本义务","保证退出义务","保证上市义务"],"answer":0,"explanation":"忠实义务核心是受益人利益优先和利益冲突管理。管理人不存在当然的保本、保证上市或保证退出义务。","source":"上传资料：私募新增重要考点1—3；2026年科目3大纲第二章","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-31","subject":3,"topic":"组织与治理","lesson":"b04","stem":"某项目亏损，能否仅据此认定管理人违反勤勉义务？","options":["能，只要亏损就违法","不能，还需考察专业审慎的履职过程等","能，只要低于门槛收益","不能，因为管理人永远不担责"],"answer":1,"explanation":"勤勉评价关注决策依据和履职过程。亏损不当然等于失职，也不能因此认为管理人永远免责。","source":"上传资料：私募新增重要考点1—3；2026年科目3大纲第二章","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-32","subject":3,"topic":"组织与治理","lesson":"b05","stem":"购买存续基金投资者持有的二手份额，最贴近哪种交易？","options":["IPO发行","S基金二手交易","公开存款","货币基金申购"],"answer":1,"explanation":"S基金常投资于二手基金份额或相关组合，需评估资产质量、费用、未缴承诺和转让约束。","source":"上传资料：私募三色笔记、预测卷；2026年科目3大纲第三章","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-33","subject":3,"topic":"组织与治理","lesson":"b06","stem":"政府投资基金运作应如何理解？","options":["政府背景代表本金担保","只能行政指定项目","政策引导与市场化、专业化运作结合","不需要投资者保护"],"answer":2,"explanation":"政府基金具有政策引导目标，同时应注重市场化专业化运作，政府背景不代表担保。","source":"上传资料：私募新增重要考点；2026年科目3大纲第三、八章","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-34","subject":3,"topic":"募集与合规","lesson":"b07","stem":"一般标准下，个人金融资产300万元与近三年年均收入50万元之间的关系是？","options":["必须同时满足","满足其中一项即可，但仍须满足相应其他条件","完全可以用房产估值替代","均无需风险承担能力"],"answer":1,"explanation":"两者为“或者”；同时要符合相应风险识别、承担能力与单只投资金额等要求。","source":"上传资料：私募数字归纳、应知应会DOCX；私募投资基金监督管理暂行办法第12—13条","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-35","subject":3,"topic":"募集与合规","lesson":"b07","stem":"以下哪项通常不计入私募合格投资者个人金融资产？","options":["银行存款","公募基金份额","信托计划","自住房产"],"answer":3,"explanation":"房地产不属于此处列举的金融资产。不能把总资产直接当金融资产。","source":"上传资料：私募数字归纳、应知应会DOCX；私募投资基金监督管理暂行办法第12—13条","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-36","subject":3,"topic":"募集与合规","lesson":"b08","stem":"募集机构向不特定公众宣传某只私募基金，再筛选合格投资者，是否合规？","options":["合规，只要最后投资人合格","合规，只要收益较低","不合规，私募推介应先确定特定对象","合规，只要不在电视发布"],"answer":2,"explanation":"非公开推介程序不能靠事后筛选补正；网络和线下均应注意特定对象要求。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-37","subject":3,"topic":"募集与合规","lesson":"b09","stem":"基金募集回访通常应确认哪些事项？\nⅠ本人身份；Ⅱ理解合同；Ⅲ知悉可能损失；Ⅳ了解纠纷解决安排。","options":["仅Ⅰ、Ⅱ","仅Ⅱ、Ⅲ","仅Ⅰ、Ⅳ","Ⅰ、Ⅱ、Ⅲ、Ⅳ"],"answer":3,"explanation":"四项均属于重要回访确认内容。签署合同本身不等于充分理解风险。","source":"先前应知应会DOCX第18题改编","sourceNumber":null,"origin":"材料改编题","core":true},{"id":"core-3-38","subject":3,"topic":"募集与合规","lesson":"b09","stem":"募集人员可以为了便利客户而代填问卷、代客户签名吗？","options":["可以，客户口头同意即可","可以，仅高净值客户适用","不可以，应由投资者真实表达并按规定签署","可以，只要产品风险低"],"answer":2,"explanation":"风险问卷和签署应反映投资者真实情况，代填代签损害程序有效性。","source":"先前应知应会DOCX第7、15题改编","sourceNumber":null,"origin":"材料改编题","core":true},{"id":"core-3-39","subject":3,"topic":"尽调与估值","lesson":"b10","stem":"核查重大诉讼、股权权属、知识产权和业务资质，主要属于？","options":["业务尽调","法律尽调","营销活动","投资者回访"],"answer":1,"explanation":"这类事项主要涉及权利、责任和合法合规性，属于法律尽调。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-40","subject":3,"topic":"尽调与估值","lesson":"b11","stem":"企业投前估值4,000万元，新投资人增资1,000万元，投后持股比例为？","options":["20%","25%","80%","10%"],"answer":0,"explanation":"投后估值=4,000+1,000=5,000万元；持股=1,000/5,000=20%。25%误用了投前估值作分母。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-41","subject":3,"topic":"尽调与估值","lesson":"b12","stem":"目标公司净利润2,000万元，按15倍PE估值，股权价值为？","options":["1.5亿元","2亿元","3亿元","30亿元"],"answer":2,"explanation":"股权价值=净利润×PE=2,000×15=30,000万元=3亿元。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-42","subject":3,"topic":"尽调与估值","lesson":"b13","stem":"企业价值10亿元，有息债务3亿元，现金1亿元。按简化公式，股权价值为？","options":["6亿元","8亿元","12亿元","14亿元"],"answer":1,"explanation":"股权价值=10−3+1=8亿元。有息债务要扣除，现金加回；注意企业价值的题设口径。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-43","subject":3,"topic":"尽调与估值","lesson":"b14","stem":"企业自由现金流折现模型通常匹配的折现率是？","options":["存款利率","股权资本成本","加权平均资本成本WACC","管理费率"],"answer":2,"explanation":"企业自由现金流提供给债权人与股东整体，配WACC；股权自由现金流配股权资本成本。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-44","subject":3,"topic":"尽调与估值","lesson":"b15","stem":"预计3年后股权价值8亿元，目标年回报100%，不考虑中途现金流和稀释，当前股权价值为？","options":["4亿元","2亿元","1亿元","8亿元"],"answer":2,"explanation":"8/(1+100%)³=1亿元。不能把3年的100%简单相加后折现。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-45","subject":3,"topic":"投资条款","lesson":"b16","stem":"其他股东向第三方出售老股，投资人希望同等条件优先买入，应关注？","options":["优先认购权","第一拒绝权","拖售权","回拨条款"],"answer":1,"explanation":"老股转让关注第一拒绝权；公司新发股份关注优先认购权。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-46","subject":3,"topic":"投资条款","lesson":"b16","stem":"基金持股10%，企业新发行500股，按原比例优先认购应认购？","options":["5股","50股","450股","500股"],"answer":1,"explanation":"500×10%=50股。优先认购用于维持相应比例，具体按协议约定。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-47","subject":3,"topic":"投资条款","lesson":"b17","stem":"创始人出售老股，投资人有权按约定一起出售，这是什么权利？","options":["拖售权","优先认购权","随售权","回拨权"],"answer":2,"explanation":"随售是“我跟你卖”；拖售是满足条件后“你跟我卖”。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-48","subject":3,"topic":"投资条款","lesson":"b18","stem":"后续融资价格低于前一轮时，对前轮投资人作价格或股份保护的条款通常是？","options":["排他性条款","反摊薄条款","保密条款","资本账户条款"],"answer":1,"explanation":"反摊薄条款通常应对后续低价融资；其他条款分别处理谈判、信息、账户等问题。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-49","subject":3,"topic":"投资条款","lesson":"b19","stem":"在约定谈判期间限制目标企业与其他投资人谈判，属于？","options":["排他性条款","随售条款","回拨机制","优先分红"],"answer":0,"explanation":"排他性条款管理特定期间的谈判排他安排，与重大事项否决或退出安排不同。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-50","subject":3,"topic":"投后与退出","lesson":"b20","stem":"帮助被投企业招聘CFO、对接后续融资，主要属于？","options":["被投企业清算","投后增值服务","基金募集回访","股权份额登记"],"answer":1,"explanation":"人才与融资资源支持属于投后增值服务，而非单纯信息监控。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-51","subject":3,"topic":"投后与退出","lesson":"b21","stem":"另一家私募基金买入本基金持有的项目股权，通常属于？","options":["管理层回购","原股东回购","协议转让退出","破产清算"],"answer":2,"explanation":"购买方是其他财务投资者，属于股权协议转让，并非管理层或原股东回购。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-52","subject":3,"topic":"收益与运营","lesson":"b22","stem":"基金实缴100万元，已分配60万元，剩余净值90万元，TVPI是？","options":["0.6","0.9","1.5","1.9"],"answer":2,"explanation":"TVPI=(60+90)/100=1.5；DPI0.6、RVPI0.9。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-53","subject":3,"topic":"收益与运营","lesson":"b22","stem":"基金认缴200万元、实缴100万元、累计分配80万元，DPI为？","options":["0.4","0.8","1.25","2.5"],"answer":1,"explanation":"DPI=累计分配/累计实缴=80/100=0.8。分母不是认缴200万元。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-54","subject":3,"topic":"收益与运营","lesson":"b23","stem":"期初投入100万元，两年后一次收回121万元，中间无现金流，IRR为？","options":["10%","10.5%","21%","11%"],"answer":0,"explanation":"(121/100)^(1/2)−1=10%。21%是两年总收益率，不能简单除以2。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-55","subject":3,"topic":"收益与运营","lesson":"b24","stem":"本金100万元，一年后可分130万元；门槛8%单利，无追赶，超额收益20%给管理人。管理人分得？","options":["6万元","4.4万元","26万元","8万元"],"answer":1,"explanation":"先返本金100和门槛8，超额22，管理人20%=4.4万元。6万元是对全部利润计提，忽视了“无追赶”的题设。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-56","subject":3,"topic":"收益与运营","lesson":"b24","stem":"最终核算发现管理人已取得过多业绩报酬，按合同返还超分部分，属于？","options":["追赶机制","回拨机制","优先认购","风险匹配"],"answer":1,"explanation":"回拨是最终校正过多分配；追赶是在分配过程中使管理人达到约定报酬比例。","source":"上传资料：三色笔记、超高频考点","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-57","subject":3,"topic":"收益与运营","lesson":"b25","stem":"将会计核算委托给外部服务机构后，基金管理人的相应法定责任如何变化？","options":["全部转移","自动消失","不因外包而当然免除","由投资者自行承担"],"answer":2,"explanation":"外包可以委托事务执行，不能当然转移管理人的法定责任。","source":"先前应知应会DOCX第8题及上传私募预测卷改编","sourceNumber":null,"origin":"材料改编题","core":true},{"id":"core-3-58","subject":3,"topic":"新版披露","lesson":"b26","stem":"按2026年9月1日起的新办法，私募股权基金半年报告期限是上半年结束后？","options":["10个工作日","1个月","2个月","4个月"],"answer":2,"explanation":"新办法第22条：上半年结束后2个月内披露半年度报告。不要继续使用旧股权季度报告口径。","source":"证监会令第233号第19、20、22—26、44条","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-59","subject":3,"topic":"新版披露","lesson":"b26","stem":"按新办法，创业投资基金年度报告的披露期限是年度结束后？","options":["1个月","2个月","4个月","6个月"],"answer":3,"explanation":"第25条衔接股权年度报告要求，即年度结束后6个月内，内容与审计要求也按相关规定执行。","source":"证监会令第233号第19、20、22—26、44条","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-60","subject":3,"topic":"新版披露","lesson":"b26","stem":"按新办法，以下哪个期限组合正确？","options":["私募证券年度6个月，私募股权年度4个月","两者均4个月","私募证券年度4个月，私募股权年度6个月","两者均1个月"],"answer":2,"explanation":"私募证券年度4个月；私募股权年度6个月。先判断产品类别，再记期限。","source":"证监会令第233号第19、20、22—26、44条","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-61","subject":3,"topic":"新版披露","lesson":"b27","stem":"按新办法，私募基金信息披露资料至少保存20年的起算点是？","options":["基金成立之日","投资者认购之日","第一次投资之日","基金清算结束之日"],"answer":3,"explanation":"第34条明确自基金清算结束之日起不少于20年，起点不能记为成立日。","source":"证监会令第233号第4、10、17、24、27、34条","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-62","subject":3,"topic":"新版披露","lesson":"b27","stem":"管理人委托基金销售机构向投资者披露信息，正确的是？","options":["委托后管理人免除披露义务","销售机构可随意修改数据","管理人义务不因此免除，受托方不得擅改内容","可以改成向社会公众随意公开"],"answer":2,"explanation":"第4条明确委托不免除义务；受托销售机构不得擅自更改。披露还应遵守非公开等要求。","source":"证监会令第233号第4、10、17、24、27、34条","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-63","subject":3,"topic":"新版披露","lesson":"b27","stem":"按新办法，对发生的重大事项，管理人通常应在多少个工作日内进行临时披露？","options":["3","5","10","20"],"answer":1,"explanation":"第27条规定发生后5个工作日内披露，不能等下一次定期报告。","source":"证监会令第233号第4、10、17、24、27、34条","sourceNumber":null,"origin":"重点自编题","core":true},{"id":"core-3-64","subject":3,"topic":"新版披露","lesson":"b27","stem":"关于私募信息披露的说法，哪项符合新办法？","options":["可选择性展示历史优秀业绩","可预测未来投资业绩","可承诺最大亏损额度","应真实、准确、完整地按规则披露"],"answer":3,"explanation":"新办法禁止选择性披露历史业绩、预测业绩以及保本、最低收益或最大损失承诺。","source":"先前应知应会DOCX第11题，按证监会令第233号修订","sourceNumber":null,"origin":"材料改编题","core":true},{"id":"s1-7-1","subject":1,"stem":"根据私募基金财产独立运作、独立核算的要求，以下做法错误的是（）","options":["私募基金管理人管理的多只私募基金委托同一托管人进行托管","私募基金管理人管理的多只私募基金投资于同一证券","私募基金管理人自有资金认购其管理的私募基金份额","私募基金管理人自有资金借用其管理的私募基金证券账户进行投资"],"answer":3,"explanation":"D 项说法错误，基金财产开立独立银行账户等各类运作账户，确保基金财产的安全性和独立性，且基金财产独立于基金份额持有人、基金管理人与基金托管人。","sourceId":7,"source":"2025年11月基金从业《法律法规》考试真题及案.pdf","sourceNumber":1,"origin":"资料回忆题","lesson":"a13","topic":"销售与适当性","core":false},{"id":"s1-7-2","subject":1,"stem":"基金产品或者服务的风险等级要按照风险由低到高的顺序，至少划分为（\n）","options":["R1、R2 二个等级","R1、R2、R3 三个等级","R1、R2、R3、R4、R5 五个等级","R1、R2、R3、R4 四个等级"],"answer":2,"explanation":"基金产品或者服务的风险等级要按照风险由低到高顺序，至少划分为:R1、R2、\nR3、R4、R5 五个等级。","sourceId":7,"source":"2025年11月基金从业《法律法规》考试真题及案.pdf","sourceNumber":2,"origin":"资料回忆题","lesson":"a01","topic":"基金基础","core":false},{"id":"s1-7-5","subject":1,"stem":"操纵市场是违法违规行为，以下涉嫌“操纵市场” 的行为包括（）\nⅠ.利用未公开信息交易\nⅡ.以自身实际控制的账户为交易对手进行对倒交易，影响交易价格\nⅢ.传播误导市场参与者的信息影响市场价格\nⅣ.利用资金优势联合或连续买卖推高价格","options":["Ⅱ、Ⅲ、Ⅳ","Ⅱ、Ⅲ","Ⅰ、Ⅱ","Ⅰ、Ⅲ"],"answer":0,"explanation":"操纵市场的行为：利用资金优势、持股或持券优势和信息优势，单独或者合谋串通，进行连续虚假交易操纵市场，影响证券交易价格或交易量，误导和干扰市场或以自身实际控制的账户为交易对手进行对倒交易，以影响交易价格或者交易量。","sourceId":7,"source":"2025年11月基金从业《法律法规》考试真题及案.pdf","sourceNumber":5,"origin":"资料回忆题","lesson":"a07","topic":"职业道德","core":false},{"id":"s1-7-8","subject":1,"stem":"公募基金管理人合规负责人的主要职责包括()。\nⅠ、对公司的业务及其人员的经营管理和执业行为的合规性进行审查、监督和检查\nⅡ、全面负责公司的投资决策和交易执行\nⅢ、发现公司的重大风险或违法违规行为时，应及时报告和督促整改\n\nⅣ、主要负责公司基金的营销策略制定和销售团队管理\nV、构建公司的长效激励约束机划","options":["Ⅰ、Ⅱ、Ⅲ","Ⅰ、Ⅲ","Ⅰ、Ⅲ、Ⅳ","Ⅱ、Ⅲ、V"],"answer":1,"explanation":"根据《公募基金管理公司合规管理规范》等相关法规，公募基金管理人合规负责人的主要职责包括对公司的业务及其人员的经营管理和执业行为的合规性进行审查、监督和检查（Ⅰ），以及发现公司的重大风险或违法违规行为时，及时报告和督促整改（Ⅲ）。","sourceId":7,"source":"2025年11月基金从业《法律法规》考试真题及案.pdf","sourceNumber":8,"origin":"资料回忆题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-7-9","subject":1,"stem":"下列选项中，不属于私募资产管理计划可以投资的标准化资产的是()。","options":["中期票据","银行定期存款","存托凭证","未上市公司股权"],"answer":3,"explanation":"私募资产管理计划可以投资的标准化资产包括以下种类：\n（1）银行存款、同业存单，以及符合《关于规范金融机构资产管理业务的指导意见》规定的标准化债权类资产，包括但不限于在证券交易所、银行间市场等国务院同意设立的交易场所交易的可以划分为均等份额、具有合理公允价值和完善流动性机制的债券、中央银行票据、资产支持证券、非金融企业债务融资工具等。（2）上市公司股票、存托凭证，以及中国证监会认可的其他标准化股权类资产。（3）在证券期货交易所等依法设立的交易场所集中交易清算的期货及期权合约等标准化期货和衍生品类资产。（4）公募基金以及中国证监会认可的比照公募基金管理的资产管理产品。（5）中国证监会认可的其他资产。","sourceId":7,"source":"2025年11月基金从业《法律法规》考试真题及案.pdf","sourceNumber":9,"origin":"资料回忆题","lesson":"a02","topic":"基金基础","core":false},{"id":"s1-7-10","subject":1,"stem":"某商业银行在经济下行期，为降低不良贷款率，大幅缩减对小微企业的货款审批额度，却将更多信贷资源投向高收益的房地产短期融资项目，结合金融双重属性逻辑，该银行存在的问题是()。","options":["正确发挥了商业属性，目通过高收益项目反哺实体经济，符合双重属性要求","片面追求商业属性(盈利性)，弱化服务小微企业的功能属性，违背盈利服从功能的原则","平衡了功能属性与商业属性，但未考虑经济下行时的特殊市场环境","过度侧重功能属性，忽视服务实体经济需求，导致商业属性难以发挥"],"answer":1,"explanation":"B 选项正确，金融的双重属性包含商业属性和功能属性：商业属性：金融机构作为市场主体，需追求合理盈利以维持自身生存与发展，比如银行通过信贷业务获取利息收益等，这是其市场化运作的基本需求。功能属性：金融的核心使命是服务实体经济，例如支持小微企业发展、助力产业升级等。尤其是小微企业作为实体经济的重要组成部分，是保障就业、促进市场活力的关键力量，银行对其提供信贷支持是履行金融功能属性的重要体现。\n\n选项A 错误：银行缩减小微企业信贷、侧重房地产高收益项目，并未反哺实体经济，反而损害了小微企业这一实体经济重要主体的利益，不符合双重属性要求。选项C 错误：银行的行为并未平衡双重属性，而是偏废了功能属性，且其核心问题并非未考虑市场环境，而是忽视了金融服务实体经济的根本使命。选项D 错误：银行的行为是过度侧重商业属性，而非功能属性，其做法与服务实体经济的需求背道而驰，而非忽视商业属性的发挥。","sourceId":7,"source":"2025年11月基金从业《法律法规》考试真题及案.pdf","sourceNumber":10,"origin":"资料回忆题","lesson":"a01","topic":"基金基础","core":false},{"id":"s1-7-11","subject":1,"stem":"基金从业人员在宣传、推介和销售基金产品时，下列不符合基金销售人员行为规范的是()。\nⅠ.揭示投资风险\nⅡ.向大客户提供基金未公开信息\nⅢ.承诺补偿亏损\nⅣ.参考本基金经理的过往良好业绩预测所推介基金的未来业绩","options":["Ⅰ、Ⅱ、Ⅲ","Ⅰ、Ⅲ、Ⅳ","Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅳ"],"answer":2,"explanation":"Ⅰ. 揭示投资风险：这符合行为规范。基金投资存在波动、市场等多种风险，销售人员在宣传推介和销售基金时，必须充分、清晰地向投资者揭示相关投资风险，保障投资者的知情权，这是基金销售的基本要求。\nⅡ. 向大客户提供基金未公开信息：这不符合行为规范。未公开信息可能涉及基金投资策略、持仓变动等核心内容，向特定大客户泄露或提供此类信息，既违背了信息公平原则，损害其他普通投资者的利益，还可能涉及内幕信息相关的违规行为，破坏市场公平秩序。\nⅢ. 承诺补偿亏损：这不符合行为规范。基金投资是典型的风险投资，收益和亏损均具有不确定性，不存在保本或补偿亏损的保障。销售人员承诺补偿亏损，属于误导投资者的虚假宣传行为，严重违反了销售合规要求。\nⅣ. 参考本基金经理的过往良好业绩预测所推介基金的未来业绩：这不符合行为规范。基金过往业绩（包括基金经理的过往业绩）并不代表未来表现，监管明确禁止销售人员以过往业绩为依据对基金未来业绩进行预测性宣传，避免误导投资者认为基金未来必然会取得同等收益。","sourceId":7,"source":"2025年11月基金从业《法律法规》考试真题及案.pdf","sourceNumber":11,"origin":"资料回忆题","lesson":"a07","topic":"职业道德","core":false},{"id":"s1-7-13","subject":1,"stem":"某基金经理与某券商负责人为同学关系，在以下业务中违反客户至上原则的是()。","options":["该券商承销某证券过程中，该基金经理考虑到同学关系，则在符合基金合同约定的投资范围和比例内较多地投资了该证券","该券商研究所具有一定市场影响力，该基金经理向公司推荐了该券商，经基金公司内部评估后在该券商开立交易席位,并分配交易佣金","该券商同时为该基金公司代销机构，该券商经内部流程评估后将该基金经理管理的基金列入重点销售基金","该券商在销售该基金经理管理的基金的过程中，举办了销售人员培训会议，邀请该基金经理参加，并分析市场情况和该基金投资机会"],"answer":0,"explanation":"A 选项，该行为违反客户至上原则。基金经理投资证券的核心依据应是证券本身的投资价值、风险水平，以及是否完全契合基金份额持有人的利益，而非私人同学关系。即便投资行为符合基金合同约定的范围和比例，但“因同学关系” 就较多投资该证券，本质上是受私人情谊影响做出的投资决策，而非基于客观投资价值判断，这一行为可能导致基金资产投向并非最优选择的标的，进而损害基金份额持有人的利益，违背了客户至上原则。","sourceId":7,"source":"2025年11月基金从业《法律法规》考试真题及案.pdf","sourceNumber":13,"origin":"资料回忆题","lesson":"a08","topic":"职业道德","core":false},{"id":"s1-7-20","subject":1,"stem":"基金经理王某在渠道交流中透露投资计划以促进其产品销售，私募基金销售人员李某得知该信息后，提前购买了王某拟投资的股票。王某的行为主要违反了《私募投资基金监管暂行办法》规定不得有行为中的(）。","options":["从事内幕交易","泄露因职务便利获取的未公开信息","玩忽职守，不按照规走履行职责","利用职务之便，为本人或投资者以外的人牟取利益，进行利益输送"],"answer":1,"explanation":"私募基金从业人员不得有下列行为：\n①将其固有财产或者他人财产混同于基金财产从事证券投资；\n②不公平地对待其管理的不同基金财产；\n③利用基金财产或者职务之便为基金份额持有人以外的人牟取利益，进行利益输送；\n④侵占、挪用基金财产；\n⑤泄露因职务便利获取的未公开信息，利用该信息从事或者明示、暗示他人从事相关的交易活动；B 项\n⑥从事损害基金财产和投资者利益的投资活动；\n⑦玩忽职守，不按照规定履行职责；\n⑧从事内幕交易、操纵交易价格及其他不正当交易活动；\n⑨法律、行政法规和中国证监会规定禁止的其他行为。","sourceId":7,"source":"2025年11月基金从业《法律法规》考试真题及案.pdf","sourceNumber":20,"origin":"资料回忆题","lesson":"a09","topic":"职业道德","core":false},{"id":"s1-7-21","subject":1,"stem":"基金管理公司（）负责确定公司风险管理总体目标，制定公司风险管理战略和风险应对策略。","options":["监事会","股东大会","董事会","风险控制委员会"],"answer":2,"explanation":"董事会对有效的风险管理承担最终责任，履行的风险管理职责是：确定公司风险管理总体目标，制定公司风险管理战略和风险应对策略；审议重大事件、重大决策的风险评估意见，审批重大风险的解决方案，批准公司基本风险管理制度；审议公司风险管理报告；可以授权董事会下设的风险管理委员会或其他专门委员会履行相应风险管理和监督职责。","sourceId":7,"source":"2025年11月基金从业《法律法规》考试真题及案.pdf","sourceNumber":21,"origin":"资料回忆题","lesson":"a16","topic":"监管与内控","core":false},{"id":"s1-7-22","subject":1,"stem":"下列不属于金融市场必备构成要素的是()","options":["市场主体","交易场所","交易价格","交易中介"],"answer":1,"explanation":"金融市场有五大必备的构成要素，分别是主体、客体、交易价格、交易方式和交易中介。","sourceId":7,"source":"2025年11月基金从业《法律法规》考试真题及案.pdf","sourceNumber":22,"origin":"资料回忆题","lesson":"a02","topic":"基金基础","core":false},{"id":"s1-7-25","subject":1,"stem":"某证券公司通过设立健全的合规管理制度和体系，配备足够的、具备相应专业知识和技能的合规人员，做到了合规管理的全面覆盖以上体现了合规管理基本原则中的( )。","options":["健全性原则","独立性原则","合法合规原则","有效性原则"],"answer":0,"explanation":"健全性原则要求公司应当通过设立健全的合规管理制度和体系，配备足够的、具备相应专业知识和技能的合规人员，结合公司的业务规模、类型、内部机构设置等实际情况，做到合规管理的全面覆盖。","sourceId":7,"source":"2025年11月基金从业《法律法规》考试真题及案.pdf","sourceNumber":25,"origin":"资料回忆题","lesson":"a16","topic":"监管与内控","core":false},{"id":"s1-17-1","subject":1,"stem":"关于中国证券基金投资协会发布的《基金募集机构投资者适当性管理实施指引(试行)》，以下说法正确的是()。","options":["C2为风险承受能力最低的类型","C2风险类型投资者通常不愿意承担任何投资损失","没有风险容忍度的投资者类型为C4","C1风险类型投资者可以认购货币市场基金"],"answer":3,"explanation":"普通投资者风险承受能力应至少分为五个类型，分别为C1、C2、C3、C4、C5，其中C1含风险承受能力最低类别。风险承受能力最低的投资者指在C1中符合下列情况之一的自然人：①不具有完全民事行为能力；②没有风险容忍度或者不愿承受任何投资损失；③法律、行政法规规定的其他情形。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":1,"origin":"资料回忆题","lesson":"a11","topic":"销售与适当性","core":false},{"id":"s1-17-2","subject":1,"stem":"与道德相比，法律的调整范围是()。","options":["心理动机","个人精神世界","个人信仰","行为结果"],"answer":3,"explanation":"一般认为，道德调整的范围比法律调整的范围更为广泛。法律调整的对象侧重于人们的外在行为和结果的合法化，具有较强的客观性，人们的思想和动机不是法律调整的对象；而道德不仅要调整人们的外在行为和结果，还要调整人们内在的精神世界和心理动机。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":2,"origin":"资料回忆题","lesson":"a06","topic":"职业道德","core":false},{"id":"s1-17-4","subject":1,"stem":"以下可体现基金公司督察长工作独立性的是(\n)","options":["督察长可以以公司的名义直接聘请外部专业机构协助工作，费用由公司承担","督察长应对公司的新产品出具合规意见","督察长不得从事基金销售相关的工作","督察长有权参加或者列席公司经营决策会议"],"answer":2,"explanation":"基金公司应保证督察长工作的独立性，不得安排或者要求督察长从事基金销售、投资等与其履行职责相冲突的职务和工作。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":4,"origin":"资料回忆题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-17-5","subject":1,"stem":"某基金公司员工甲认为，新成立的公司首先应该把业务发展放在优先地位，解决生存问题，可以暂时不考虑风险管理的限制要求;员工乙认为，风险管理是公司经营管理的组成部分要覆盖公司的所有业务和部门。关于两位员工的看法，下列判断正确的是( )","options":["员工甲的看法正确，员工乙的看法正确","员工甲的看法正确，员工乙的看法错误","员工甲的看法错误，员工乙的看法正确","员工甲的看法错误，员工乙的看法错误"],"answer":2,"explanation":"员工甲的看法错误，为充分保护基金份额持有人的利益，促进公司和行业持续、健康、稳定发展，基金管理人应强化风险意识，增强风险防范能力，建立全面的风险管理体系。员工乙的看法正确，基金公司的风险管理是指基金公司围绕公司总体经营战略，从董事会、管理层到全体员工全员参与，在日常经营中，识别潜在风险，评估风险的影响程度，并根据公司风险偏好制定风险应对策略，有效管理公司各环节风险的持续过程。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":5,"origin":"资料回忆题","lesson":"a16","topic":"监管与内控","core":false},{"id":"s1-17-6","subject":1,"stem":"社会道德规范是一个国家所有公民应当遵守的道德规范的总和，道德是一种社会形态，以下不属于道德特征的是()。","options":["具有具体性","具有强制性","具有差异性","具有继承性"],"answer":1,"explanation":"道德的特征：1.道德具有差异性；2.道德具有继承性；3.道德具有约束性；4.道德具有具体性。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":6,"origin":"资料回忆题","lesson":"a06","topic":"职业道德","core":false},{"id":"s1-17-7","subject":1,"stem":"基金管理人制定内部控制制度应当遵循的原则包括()。\nI、合法合规性原则，内部控制制度应符合国家法律法规、规章和各项规定的要求\nII、全面性原则，内部控制制度应涵盖公司经营管理的各个环节\nIII、商业性原则，内部控制制度的制定应在确保风险可控的基础上以企业商业价值最大化为出发点\nIV、适时性原则，内部控制制度的制定应随着内外部环境的变化进行及时的修改或完善","options":["I、II、III","I、II、III、IV","I、II、IV","I、III、IV"],"answer":2,"explanation":"基金管理人制定内部控制制度一般应当遵循以下原则：\n(1)合法、合规性原则。公司内控制度应当符合国家法律法规、规章和各项规定。\n(2)全面性原则。内部控制制度应当涵盖公司经营管理的各个环节，不得留有制度上的空白或漏洞。\n(3)审慎性原则。公司内部控制的核心是风险控制，制定内部控制制度应当以审慎经营、防范和化解风险为出发点。\n(4)适时性原则。内部控制制度的制定应当随着有关法律法规的调整和公司经营战略、经营方针、经营理念等内外部环境的变化进行及时的修改或完善。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":7,"origin":"资料回忆题","lesson":"a17","topic":"监管与内控","core":false},{"id":"s1-17-8","subject":1,"stem":"张某拟投资上市开放式基金(LOF)，关于其可以采取的交易方式，以下说法正确的包括()\nI.在代销该基金的银行申购该基金\nII.在银行申购的基金份额只能在银行赎回\nIII.在证券交易所买进该基金，并只能在证券交易所卖出\nIV.在银行申购该基金转托管到证券交易所卖出","options":["I、III","I、IV","I、II","III、IV"],"answer":1,"explanation":"上市开放式基金(LOF)是一种既可以在场外市场进行基金份额申购、赎回，又可以在交易所(场内市场)进行基金份额交易和基金份额申购或赎回的开放式基金。它是我国对证券投资基金的一种本土化创新。LOF结合了银行等代销机构和交易所交易网络两者的销售优势，为开放式基金销售开辟了新的渠道。LOF具有的转托管机制，使投资者既可以通过场外销售渠道申购和赎回基金份额，也可以在挂牌的交易所买卖该基金或进行基金份额的申购与赎回。这一机制使LOF不会出现封闭式基金的大幅折价交易现象。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":8,"origin":"资料回忆题","lesson":"a04","topic":"基金基础","core":false},{"id":"s1-17-13","subject":1,"stem":"良好的投资者教育能帮助投资者规避大量的投资风险以及一些不必要的损失，某金融机构在了解投资者的个人背景和社会背景后，指导投资者分析投资问题，获得必要信息并进行理性选择，该行为属于投资者教育中的()","options":["权益保护教育","投资决策教育","资产配置教育","防范诈骗教育"],"answer":1,"explanation":"投资决策教育就是要在指导投资者分析投资问题、获得必要信息、进行理性选择的同时，致力于改善投资者决策条件中的某些变量。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":13,"origin":"资料回忆题","lesson":"a01","topic":"基金基础","core":false},{"id":"s1-17-14","subject":1,"stem":"关于基金代销机构的职责，以下描述错误的是（）。","options":["可赚取销售佣金","可委托其他机构代为办理基金的代销业务","应与基金公司签订基金产品销售协议","可代为销售基金产品"],"answer":1,"explanation":"基金销售机构不得委托其他机构代为办理基金的销售业务。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":14,"origin":"资料回忆题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-17-16","subject":1,"stem":"关于基金销售机构，以下说法正确的是()","options":["基金管理人不可以自行销售其募集的基金产品","保险代理机构不可以销售基金产品","各类商业银行可以直接销售基金管理公司的基金产品","独立基金销售机构可以从事基金销售业务"],"answer":3,"explanation":"基金销售机构是指从事基金销售业务活动的机构，包括基金管理人以及经中国证监会认定的可以从事基金销售的其他机构。目前可申请从事基金代理销售的机构主要包括商业银行、证券公司、保险公司、证券投资咨询机构、独立基金销售机构。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":16,"origin":"资料回忆题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-17-21","subject":1,"stem":"投资者于交易日投资5万元申购某开放式基金。基金合同约定申购费率为1．2%，申购当日基金份额净值为1．178元，份额确认日基金份额净值为1．181元，下列说法中正确的是（）。","options":["净申购金额为49000元","确认份额为41834.98份","确认份额为41935.48份","确认份额为41941.52份"],"answer":3,"explanation":"净申购金额=申购金额/（1+申购费率）=50000/（1+1.2%）=49407.11（元），申购份额=净申购金额/申购当日基金份额净值=49407.11/1.178=41941.52（份）。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":21,"origin":"资料回忆题","lesson":"a13","topic":"销售与适当性","core":false},{"id":"s1-17-23","subject":1,"stem":"关于开放式基金的认购费率和收费模式，下列说法正确的是()\nI、基金管理人可根据不同认购金额设置不同的认购费率\nII、前端收费模式在认购基金份额时就支付认购费用\nIII、后端收费模式在认购基金份额时不收费，在赎回基金份额时才支付认购费用\nIV、前端收费模式和后端收费模式的认购费率均为固定费率","options":["I、II、III","II、III","I、II、III、IV","II、III、IV"],"answer":0,"explanation":"前端收费模式，根据认购金额设置不同的费率标准，一般最高不超过1.5%；后端收费模式，一般按照持有期限设置，持有期限越长费用越低。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":23,"origin":"资料回忆题","lesson":"a13","topic":"销售与适当性","core":false},{"id":"s1-17-25","subject":1,"stem":"以下属于货币市场基金宣传推介材料制作及发放主体的是()。\nⅠ基金管理人\nⅡ基金托管银行\nⅢ基金代销银行\nⅣ基金评价机构","options":["Ⅰ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅳ","Ⅰ、Ⅲ"],"answer":3,"explanation":"除基金管理人、基金销售机构外，其他机构或者个人不得擅自制作或者发放与货币市场基金相关的宣传推介材料。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":25,"origin":"资料回忆题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-17-26","subject":1,"stem":"基金宣传推介材料的范围包括()\nⅠ微信公众号文章\nⅡ朋友圈广告\nⅢ信函\nⅣ传真","options":["Ⅰ、Ⅱ、Ⅲ、Ⅳ","Ⅱ、Ⅳ","Ⅰ、Ⅱ","Ⅰ、Ⅲ、Ⅳ"],"answer":0,"explanation":"Ⅰ、Ⅱ、Ⅲ、Ⅳ项均符合题意。基金宣传推介材料是指为推介基金向公众分发或者发布，使公众可以普遍获得的书面、电子或者其他介质的信息。微信公众号文章、朋友圈广告、信函、传真都属于公众可以普遍获得的书面、电子或者其他介质的信息。故本题选A选项。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":26,"origin":"资料回忆题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-17-27","subject":1,"stem":"A基金管理公司与B投资顾问签订的《投资顾问服务协议》约定，A旗下部分产品由B直接下单交易，事先不通过A的风控系统，A对上述产品应承担的责任一并转移给B承担，关于上述情况，以下说法错误的包括()。\nⅠ、A没有谨慎勤勉地履行管理人职责\n\nⅡ、A没有独立自主地进行投资决策\nⅢ、A根据协议可以将投资决策权让渡给B投资顾问\nⅣ、A依法应当承担的责任因委托B投资顾问而免除","options":["Ⅰ、Ⅱ","Ⅲ、Ⅳ","Ⅱ、Ⅳ","Ⅰ、Ⅲ"],"answer":1,"explanation":"III项，投资决策权不得转让。\nIV项，管理人委托投资顾问提供投资建议服务，依法应承担的责任不因委托而免除。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":27,"origin":"资料回忆题","lesson":"a05","topic":"基金基础","core":false},{"id":"s1-17-31","subject":1,"stem":"基金销售机构在受理普通投资者转化为专业投资者申请时，下列行为不适当的是()","options":["要求投资者提供金融资产证明","对投资者的专业知识进行考查","要求投资者提供收入证明","有义务向普通投资者说明，只有成为专业投资者，才可以投资更多的基金产品，获得更高的回报"],"answer":3,"explanation":"普通投资者申请成为专业投资者应当以书面形式向基金销售机构提出申请并确认自主承担可能产生的风险和后果，提供相关证明材料。基金销售机构应当通过追加了解信息、投资知识测试或者模拟交易等方式对投资者进行谨慎评估，确认其符合前条要求，说明对不同类别投资者履行适当性义务的差别，警示可能承担的投资风险，告知申请的审查结果及其理由。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":31,"origin":"资料回忆题","lesson":"a11","topic":"销售与适当性","core":false},{"id":"s1-17-34","subject":1,"stem":"基金管理人所有员工在从事业务活动时必须做到()，并以最高水准要求自己。\nI、忠诚\nII、诚实\nIII、公平交易\nIV、自觉自愿","options":["I、II、III、IV","II、III、IV","I、II、III","I、II、IV"],"answer":2,"explanation":"基金管理人各自的业务部门设置存在差异，但是，各业务部门及其员工应当遵守合规规定。为保证公司在从事业务行为时能遵循较高的标准，基金管理人所有员工在从事业务活动时必须做到忠诚、诚实和公平交易，并以最高水准要求自己；公司及其员工应以应有的技能勤勉尽责和谨慎行事。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":34,"origin":"资料回忆题","lesson":"a06","topic":"职业道德","core":false},{"id":"s1-17-37","subject":1,"stem":"基金管理人内部控制的总体目标包括()。\nI.保证公司经营运作严格遵守国家有关法律法规和行业监管规则\nII.防范和化解经营风险，提高经营管理收益，实现公司的持续、稳定健康发展\nIII.确保基金和基金管理人的财务和其他真实信息、准确、完整\nIV.保障基金从业人员的利益","options":["I、IV","I、II、III、IV","I、II、","I、II、III"],"answer":3,"explanation":"内部控制的总体目标：\n(一)保证公司经营运作严格遵守国家有关法律法规和行业监管规则，自觉形成守法经营、规范运作的经营思想和经营理念\n(二)防范和化解经营风险，提高经营管理效益，确保经营业务的稳健运行和受托资产的安全完整，实现公司的持续、稳定、健康发展\n(三)确保基金和基金管理人的财务和其他信息真实、准确、完整、及时","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":37,"origin":"资料回忆题","lesson":"a17","topic":"监管与内控","core":false},{"id":"s1-17-42","subject":1,"stem":"某投资人投资5万元认购了该基金，认购资金在募集期间产生的利息为15元，其对应的认购费率为1.5%，基金份额面值为1元，则其认购费用及认购份额分别为（）。","options":["750元和50015份","750元和50000份","738.92元和49276.08份","738.92元和49261.08份"],"answer":2,"explanation":"净认购金额=50000/（1+1.5%）=49261.08元认购费用=50000-49261.08=738\n.92元认购份额=（49261.08+15）/1=49276.08份","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":42,"origin":"资料回忆题","lesson":"a13","topic":"销售与适当性","core":false},{"id":"s1-17-46","subject":1,"stem":"以下选项中，不符合基金管理公司组织结构相互制约原则的是()。","options":["公司综合管理部对广告供应商白名单进行审查","公司合规部对电子商务业务的创新模式进行合规审查","公司风险管理部对拟发行的采用摊余成本法估值的基金进行风险评估","公司财务部未作审核，直接接受基金会计提供的基金管理费收入数据入账"],"answer":3,"explanation":"相互制约原则指基金管理人内部部门和岗位的设置应当权责分明、相互制衡。基金管理人内部的一项业务，如果经过两个以上的相互制约环节对其进行监督和核查，其发生错弊现象的概率就很低。就具体的内部控制措施来说，相互牵制必须考虑横向控制和纵向控制两方面的制约关系。从横向关系来讲，完成某个环节的工作需有来自彼此独立的两个部门或人员协调运作、相互监督、相互制约、相互证明；从纵向关系来讲，完成某个工作需经过互不隶属的两个或两个以上的岗位和环节，以使下级受上级监督，上级受下级牵制。只有经过横向关系和纵向关系的核查和制约，才能使发生的错弊减少到较低程度，或者即使发生问题，也易尽早发现，便于及时纠正。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":46,"origin":"资料回忆题","lesson":"a16","topic":"监管与内控","core":false},{"id":"s1-17-48","subject":1,"stem":"下列做法中符合基金客户利益至上的是()","options":["基金经理根据公司投决会决议，操作自己管理的基金购买朋友公司发行的优质公司债","基金经理操作其亲属证券账户，先于自己管理的基金买卖相同个股","银行理财经理向某客户销售500万元某基金产品，安排客户分10笔各50万元申购，以提升其销售业绩","基金托管人将某基金的托管资金放贷给其优质客户，用于提升收益，支持实体经济"],"answer":0,"explanation":"客户利益优先要求基金从业人员必须全心全意地忠实于客户，依客户利益行事，当发生利益冲突时，将客户的利益置于个人及所在机构的利益之上。具体而言，基金从业人员应当遵守下列规则：（1）不得从事与投资人利益相冲突的业务。（2）应当采取合理的措施避免与投资人发生利益冲突。（3）在执业过程中遇到自身利益或相关方利益与投资人利益发生冲突时，应以投资人利益优先，并应及时向所在机构报告。（4）不得侵占或者挪用基金投资人的交易资金和基金份额。（5）不得在不同基金资产之间、基金资产和其他受托资产之间进行利益输送。（6）不得在执业活动中为自己或他人牟取不正当利益。（7）不得利用工作之便向任何机构和个人输送利益，损害基金持有人利益。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":48,"origin":"资料回忆题","lesson":"a08","topic":"职业道德","core":false},{"id":"s1-17-54","subject":1,"stem":"不属于基金注册登记机构的职责或业务范围的是()","options":["建立并管理投资者基金份额账户","建立并保管基金投资者名册","负责基金的会计核算处理","负责基金份额登记，确认基金交易"],"answer":2,"explanation":"基金注册登记机构的主要职责：(1)建立并管理投资者基金份额账户；\n(2)负责基金份额登记，确认基金交易；\n(3)发放红利；\n(4)建立并保管基金投资者名册；\n(5)基金合同或者登记代理协议规定的其他职责。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":54,"origin":"资料回忆题","lesson":"a15","topic":"监管与内控","core":false},{"id":"s1-17-60","subject":1,"stem":"下列不属于财产分离内控要求的选项是()。","options":["确保不同基金财产之间的分离","确保同一基金内不同投资项目的分离","确保基金财产与基金托管人财产之间的分离","确保基金财产与管理人自有财产之间的分离"],"answer":1,"explanation":"A项，公开募集基金的基金管理人应当对所管理的不同基金财产分别管理、分别记账，进行证券投资。\nCD项，基金财产独立于基金管理人、基金托管人的固有财产。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":60,"origin":"资料回忆题","lesson":"a17","topic":"监管与内控","core":false},{"id":"s1-17-61","subject":1,"stem":"以下有关基金管理人的合规文化，表述错误的是（）。","options":["公司内部要有清晰的责任制和问责制","公司招聘人员时要考查候选人是否有足够的职业谨慎、诚信正直的个人品行及良好的风险意识和行为规范","董事会和高级管理层要亲自参与和重视合规文化建设","合规部门与业务部门之间要保持良好互动，其考核与公司经营业绩指标挂钩"],"answer":3,"explanation":"将合规考核结果与员工的绩效工作和高管人员竞聘考核相结合。真正落实执行考核奖惩政策，让全体员工对合规考核处罚措施心生畏惧，进而自觉遵守各项规章制度，按规矩办事。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":61,"origin":"资料回忆题","lesson":"a16","topic":"监管与内控","core":false},{"id":"s1-17-65","subject":1,"stem":"基金管理人内部环境的要素包括()。\nⅠ.全体员工的诚信意识\nⅡ.管理层的风险理念和经营风格\nⅢ.管理层分配权力和划分责任的机制\nⅣ.董事会对公司风险的关注和指导","options":["Ⅰ、Ⅱ、Ⅲ","Ⅰ、Ⅱ、Ⅳ","Ⅰ、Ⅱ、Ⅲ、Ⅳ","Ⅱ、Ⅲ、Ⅳ"],"answer":2,"explanation":"内部环境的要素包括：全体员工的诚信、道德价值观和胜任能力，管理层的理念和经营风格，管理层分配权力和划分责任、组织和开发其员工的方式，以及董事会给予的关注和指导。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":65,"origin":"资料回忆题","lesson":"a01","topic":"基金基础","core":false},{"id":"s1-17-66","subject":1,"stem":"根据《证券投资基金法》的规定，以下各事项中属于公募证券投资基金的招募说明书必备内容的是()","options":["基金从事证券交易的清算交收安排","基金管理人和托管人基本情况","律师事务所为基金募集出具的法律意见书","基金投资各类证券指令的发送和执行"],"answer":1,"explanation":"基金招募说明书应当包括下列内容：①基金募集申请的准予注册文件名称和注册日期；②基金管理人、基金托管人的基本情况；③基金合同和基金托管协议的内容摘要；④基金份额的发售日期、价格、费用和期限；⑤基金份额的发售方式、发售机构及登记机构名称；⑥出具法律意见书的律师事务所和审计基金财产的会计师事务所的名称和住所；⑦基金管理人、基金托管人报酬及其他有关费用的提取、支付方式与比例；⑧风险警示内容；⑨中国证监会规定的其他内容。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":66,"origin":"资料回忆题","lesson":"a18","topic":"监管与内控","core":false},{"id":"s1-17-68","subject":1,"stem":"下列行为中属于基金注册登记机构主要职责的有\nⅠ.发放红利\nⅡ.基金份额登记，确认基金交易\nⅢ.建立并管理投资者基金份额账户\nⅣ.对基金进行估值核算","options":["Ⅰ、Ⅱ","Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅲ","Ⅰ、Ⅱ、Ⅲ、Ⅳ"],"answer":2,"explanation":"基金注册登记机构的主要职责：\n（1）建立并管理投资者基金份额账户；（2）负责基金份额登记，确认基金交易；（3）发放红利；（4）建立并保管基金投资者名册；（5）基金合同或者登记代理协议规定的其他职责。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":68,"origin":"资料回忆题","lesson":"a15","topic":"监管与内控","core":false},{"id":"s1-17-69","subject":1,"stem":"关于基金注册登记机构的职责，以下说法错误的是()。","options":["确认基金交易","负责基金份额登记","保管资金","发放红利"],"answer":2,"explanation":"基金注册登记机构是通过设立和维护基金份额持有人名册，确认基金份额持有人持有基金份额的事实行为的机构。我国开放式基金注册登记机构的主要职责有:(1)建立并管理投资者基金份额账户;(2)负责基金份额登记，确认基金交易(B选项、A选项属于主要职责);(3)发放红利(D选项属于主要职责);(4)建立并保管基金投资者名册;(5)基金合同或者登记代理协议规定的其他职责。C选项说法错误，保管资金属于基金托管人的职责。故本题选C选项","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":69,"origin":"资料回忆题","lesson":"a15","topic":"监管与内控","core":false},{"id":"s1-17-75","subject":1,"stem":"以下不属于道德的调整手段的是（）。","options":["内心信念","社会舆论","国家强制力","传统习俗"],"answer":2,"explanation":"道德具有约束性，但是，道德并不像法律那样依靠国家强制力保证其实施，其约束力是有限的。道德依靠社会舆论、传统习俗和内心信念等力量来发挥其约束的作用，因此，与之相应的社会道德评价标准、行为习惯、道德观念等就成为道德得以实施的重要支撑力量。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":75,"origin":"资料回忆题","lesson":"a06","topic":"职业道德","core":false},{"id":"s1-17-82","subject":1,"stem":"基金职业道德的核心规范是（）。","options":["自觉自律","保守秘密","互相监督","诚实守信"],"answer":3,"explanation":"诚实守信是基金职业道德的核心规范。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":82,"origin":"资料回忆题","lesson":"a09","topic":"职业道德","core":false},{"id":"s1-17-84","subject":1,"stem":"第XX届新财富最佳分析师候选人马某，在临近新财富评选前，邀请具有投票资格的相关人员聚餐，并支付聚餐费用。对此监管机构对其采取了监管谈话的措施，其构成（）。","options":["构成向其他利益关系人输送不正当利益的事实","以不正当方式影响监督管理或者自律管理决定","直接、间接或者唆使、协助他人向监管人员输送利益","直接或者间接通过聘请第三方机构或者个人的方式输送利益"],"answer":0,"explanation":"根据《证券期货经营机构及其工作人员廉洁从业规定》，证券期货经营机构及其工作人员在开展证券期货业务及相关活动中，不得以下列方式向公职人员、客户、正在洽谈的潜在客户或者其他利益关系人输送不正当利益：\n（一）提供礼金、礼品、房产、汽车、有价证券、股权、佣金返还等财物，或者为上述行为提供代持等便利；（二）提供旅游、宴请、娱乐健身、工作安排等利益；（三）安排显著偏离公允价格的结构化、高收益、保本理财产品等交易；（四）直接或者间接向他人提供内幕信息、未公开信息、商业秘密和客户信息，明示或者暗示他人从事相关交易活动；（五）其他输送不正当利益的情形。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":84,"origin":"资料回忆题","lesson":"a15","topic":"监管与内控","core":false},{"id":"s1-17-89","subject":1,"stem":"下列某基金代销银行的货币市场基金宣传推介行为中，做法正确的是()。","options":["以该银行现金理财工具的名义实际推介货币市场基金","宣传该银行为货币市场基金提供T+0快速赎回服务，并充分揭示快速赎回服务的规则、内容、费用及限制条件等信息","根据货币市场基金历史业绩表现，谨慎承诺最低预期收益率","根据业务推动需要，制作突出货币市场基金收益率高于银行存款利率的宣传材料"],"answer":1,"explanation":"AC两项，基金宣传推介材料中推介货币市场基金的，应当提示基金投资人，购买货币市场基金并不等于将资金作为存款存放在银行或者存款类金融机构，基金管理人不保证基金一定盈利，也不保证最低收益。\nD项，基金销售支付结算机构等相关机构开展与货币市场基金相关的业务推广活动，应当事先征得合作基金管理人或者基金销售机构的同意，严格遵守相关法律法规的规定，不得混同、比较货币市场基金与银行存款及其他产品的投资收益，不得以宣传理财账户或者服务平台等名义变相从事货币市场基金的宣传推介活动。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":89,"origin":"资料回忆题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-17-91","subject":1,"stem":"下列基金销售机构的基金销售行为中，错误的是（）。","options":["不能以排挤竞争对手为目的，压低基金的收费水平","不得在签订销售协议或销售基金的活动中进行商业贿赂","可以通过先收后返、财务处理等方式变相降低收费标准","不能采取抽奖、回扣或者送实物、保险基金份额等方式销售基金"],"answer":2,"explanation":"基金销售机构在基金销售活动中，不得有下列行为：\n①在签订销售协议或销售基金的活动中进行商业贿赂。\n②以排挤竞争对手为目的，压低基金的收费水平。\n③未经公告擅自变更向基金投资人的收费项目或收费标准，或通过先收后返、财务处理等方式变相降低收费标准。\n④采取抽奖、回扣或者送实物、保险、基金份额等方式销售基金。\n⑤其他违反法律、行政法规的规定，扰乱行业竞争秩序的行为。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":91,"origin":"资料回忆题","lesson":"a09","topic":"职业道德","core":false},{"id":"s1-17-92","subject":1,"stem":"某私募投资经理的下列行为，不违反保守秘密要求的是（）。","options":["与其他私募基金管理公司投资经理讨论各自所在机构投资组合","将所在机构管理层会议纪要隐去公司名称后发送给朋友","受邀为潜在客户介绍其所在机构的投资理念","离职3年后，与原机构其他投资经理交流客户交易信息"],"answer":2,"explanation":"基金从业人员在执业活动中接触到的秘密主要包括三类：一是商业秘密；二是客户资料；三是内幕信息。保守秘密，要求基金从业人员不得向第三者透露作为秘密的信息，也不得公开尚处于禁止公开期间的信息。具体而言，基金从业人员应当做到以下几点：\n（1）应当妥善保管并严格保守客户秘密，非经许可不得泄露客户资料和交易信息。且无论是在任职期间还是离职后，均不得泄露任何客户资料和交易信息。（2）不得泄露在执业活动中所获知的各相关方的信息及所属机构的商业秘密，更不得用以为自己或他人谋取不正当的利益。（3）不得泄露在执业活动中所获知的内幕信息。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":92,"origin":"资料回忆题","lesson":"a09","topic":"职业道德","core":false},{"id":"s1-17-98","subject":1,"stem":"关于开放式基金的申购赎回，投资者甲认为，开放式基金的申购赎回只能通过基金管理人的直销中心进行。投资者乙认为，任意时间都可以办理开放式基金的申购赎回业务。关于两位投资者的观点，下列判断正确的是（）。","options":["甲的观点错误，乙的观点正确","甲的观点正确，乙的观点错误","甲、乙的观点都正确","甲、乙的观点都错误"],"answer":3,"explanation":"甲的观点错误，开放式基金的申购和赎回与认购渠道一样，可以通过基金管理人的直销中心与基金销售代理网点进行。乙的观点错误，开放式基金的申购和赎回的工作日为证券交易所交易日，具体业务办理时间为上海证券交易所、深圳证券交易所的交易时间。目前，上海证券交易所、深圳证券交易所的交易时间为9：30-11：30和13：00-\n15：00。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":98,"origin":"资料回忆题","lesson":"a01","topic":"基金基础","core":false},{"id":"s1-17-99","subject":1,"stem":"关于基金管理公司的风险管理，投资者甲认为，风险管理限制了基金的投资，因此会降低基金业绩，损害基金份额持有人利益；投资者乙认为，风险管理只是为了维护基金管理公司股东的利益，对基金份额持有人并没有影响。针对两位投资者的看法，下列判断正确的是()。","options":["投资者甲的看法错误，投资者乙的看法错误","投资者甲的看法错误，投资者乙的看法正确","投资者甲的看法正确，投资者乙的看法正确","投资者甲的看法正确，投资者乙的看法错误"],"answer":0,"explanation":"“为充分保护基金份额持有人的利益”，促进公司和行业持续、健康、稳定发展，基金管理人应强化风险意识，增强风险防范能力，建立全面的风险管理体系。故投资者甲和乙说法错误","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":99,"origin":"资料回忆题","lesson":"a16","topic":"监管与内控","core":false},{"id":"s1-17-100","subject":1,"stem":"关于基金公司投资决策委员会的描述，以下不属于投资决策委员会所议事项的是()。","options":["审批基金经理的年度投资计划并考核其执行情况","决定基金的资产分配比例，制定并定期调整投资总体方案","决定基金的投资原则、投资目标和投资理念","制定、修订公司的估值政策及程序"],"answer":3,"explanation":"投资决策委员会所议事项具体为：\n①决定公司的投资决策程序及权限设置原则；\n②决定基金的投资原则、投资目标和投资理念；\n③决定基金的资产分配比例，制定并定期调整投资总体方案；\n④审批基金经理提出的行业配置及超过基金净值某一比例重仓个股的投资方案；\n⑤审批基金经理的年度投资计划并考核其执行情况；\n⑥定期检讨并调整投资限制性指标。","sourceId":17,"source":"2024年11月基金.《法律法规》考试真题及答案【更新100题】.pdf","sourceNumber":100,"origin":"资料回忆题","lesson":"a01","topic":"基金基础","core":false},{"id":"s1-29-3","subject":1,"stem":"募集机构通过互联网媒介在线向投资者推介私募基金之前，应当设置（ ）确定程序，投资者应承诺其符合合格投资者标准。","options":["线下特定对象","线下不定对象","线上不定对象","在线特定对象"],"answer":3,"explanation":"募集机构通过互联网媒介在线向投资者推介私募基金之前，应当设置在线特定对象确定程序，投资者应承诺其符合合格投资者标准。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":3,"origin":"资料模拟题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-29-5","subject":1,"stem":"（ ）是对投资产品和服务做出选择的行为或过程，是整个投资者教育体系的基础。","options":["风险控制","投资决策","资产配置","权益保护"],"answer":1,"explanation":"投资决策是对投资产品和服务做出选择的行为或过程，是整个投资者教育体系的基础。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":5,"origin":"资料模拟题","lesson":"a01","topic":"基金基础","core":false},{"id":"s1-29-6","subject":1,"stem":"下列关于基金中基金的说法，错误的是（ ）。","options":["风险波动相对偏低","费用较低","投资标的分散化","满足投资者多样化资产配置投资需求"],"answer":1,"explanation":"基金中基金将大部分资产投资于“一篮子”基金，而不直接投资于股票.债券等金融工具。在合理地投资操作下，这一投资模式大多伴随投资标的分散化以及波动相对偏低的特点。A.C项说法正确。发展基金中基金有利于广大投资者借助基金管理人的专业化选择基金优势投资基金，拓宽基金业发展空间；有利于满足投资者多样化资产配置投资需求，有效分散投资风险，降低多样化投资的门槛；有利于进一步增强证券经营机构服务投资者的能力。D项说法正确。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":6,"origin":"资料模拟题","lesson":"a04","topic":"基金基础","core":false},{"id":"s1-29-7","subject":1,"stem":"依据《证券投资基金法》的规定，公开募集基金应当经（ ）注册。","options":["中国证监会","证券交易所","基金业协会","证券业协会"],"answer":0,"explanation":"依据《证券投资基金法》的规定，公开募集基金应当经中国证监会注册。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":7,"origin":"资料模拟题","lesson":"a15","topic":"监管与内控","core":false},{"id":"s1-29-10","subject":1,"stem":"根据《私募投资基金监督管理暂行办法》，关于私募基金的募集和运作，下列说法错误的是（ ）。","options":["私募基金募集机构可以通过微信向特定客户推介私募基金","私募基金募集机构在认定合格投资者时，投资者持有的信托计划单位可以视为其金融资产","私募基金管理人不得向投资者承诺投资本金不受损失","私募基金必须由基金托管人托管"],"answer":3,"explanation":"有些非公开募集基金规模较小或者投资者较少，基金投资人基于对基金管理人的信任或者出于节省基金托管费用的考虑，不再需要基金托管。因此，《中华人民共和国证券投资基金法》允许非公开募集基金的当事人对于设置基金托管人做例外约定，即非公开募集基金应当由基金托管人托管，但是基金合同另有约定除外。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":10,"origin":"资料模拟题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-29-13","subject":1,"stem":"以下哪项关于上市开放式基金(LOF)的描述是错误的?（ ）","options":["可以在场内市场进行申购赎回","可以在场外市场进行申购赎回","不可以转托管","是我国对证券投资基金的一种本土化创新"],"answer":2,"explanation":"C项说法错误，LOF具有的转托管机制，使投资者既可以通过场外销售渠道申购和赎回基金份额，也可以在挂牌的交易所买卖该基金或进行基金份额的申购与赎回。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":13,"origin":"资料模拟题","lesson":"a04","topic":"基金基础","core":false},{"id":"s1-29-14","subject":1,"stem":"（ ）是指从事基金销售业务活动的机构。","options":["基金销售机构","基金销售支付机构","基金份额登记机构","基金评价机构"],"answer":0,"explanation":"基金销售机构是指从事基金销售业务活动的机构，包括基金管理人以及经中国证监会认定的可以从事基金销售的其他机构。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":14,"origin":"资料模拟题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-29-15","subject":1,"stem":"招募说明书及基金份额发售公告中有关基金销售费用的信息内容不包括（ ）。","options":["基金销售费用收取的条件.方式.用途和费用标准","约定支付报酬的比例和方式","以简单明了的格式和举例方式向投资人说明基金销售费用水平","中国证监会规定的其他有关基金销售费用的信息事项"],"answer":1,"explanation":"基金管理人应当在招募说明书及基金份额发售公告中载明以下有关基金销售费用的信息内容：①基金销售费用收取的条件.方式.用途和费用标准；②以简单明了的格式和举例方式向投资人说明基金销售费用水平；③中国证监会规定的其他有关基金销售费用的信息事项。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":15,"origin":"资料模拟题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-29-17","subject":1,"stem":"基金客户服务提供方式除了电话服务中心.邮寄服务.讲座.推介会和座谈会.互联网的应用，还包括（ \n）等。\nⅠ.“一对一”专人服务\nⅡ.媒体和宣传手册的应用\nⅢ.自动传真.电子信箱与手机短信\nⅣ.微信和移动客户端的应用","options":["Ⅰ，Ⅱ，Ⅲ，Ⅳ","Ⅰ，Ⅱ，Ⅲ","Ⅱ，Ⅲ，Ⅳ","Ⅰ，Ⅲ，Ⅳ"],"answer":0,"explanation":"基金管理人或者代销机构通常设立独立的客户服务部门，通过一套完整的客户服务流程，一系列完备的软.硬件设施，以系统化的方式，应用以下八种方式提供并优化客户服务：①电话服务中心；②邮寄服务；③自动传真.电子信箱与手机短信；④“一对一”专人服务；⑤互联网的应用；⑥微信和移动客户端的应用；⑦媒体和宣传手册的应用；⑧讲座.推介会和座谈会。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":17,"origin":"资料模拟题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-29-18","subject":1,"stem":"根据复制方法的不同，ETF可分为（ ）。","options":["股票型ETF和债券型ETF","完全复制型ETF和抽样复制型ETF","成长型ETF和价值型ETF","行业指数ETF和风险指数ETF"],"answer":1,"explanation":"根据复制方法的不同，可以将ETF分为完全复制型ETF和抽样复制型ETF。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":18,"origin":"资料模拟题","lesson":"a04","topic":"基金基础","core":false},{"id":"s1-29-20","subject":1,"stem":"（ ）对保障基金的安全运作起着重要的作用。","options":["基金的产品开发","基金的市场营销","基金的投资管理","基金的后台管理"],"answer":3,"explanation":"基金的运作活动从基金管理人的角度看，可以分为基金的市场营销.基金的投资管理与基金的后台管理三大部分。其中，后台管理服务对保障基金的安全运作起着重要的作用。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":20,"origin":"资料模拟题","lesson":"a01","topic":"基金基础","core":false},{"id":"s1-29-21","subject":1,"stem":"基金产品的募集者和管理者是（ ）。","options":["基金份额持有人","基金管理人","基金托管人","基金的出资人"],"answer":1,"explanation":"基金管理人是基金产品的募集者和管理者，其最主要职责就是按照基金合同的约定，负责基金资产的投资运作，在有效控制风险的基础上为基金投资者争取最大的投资收益。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":21,"origin":"资料模拟题","lesson":"a05","topic":"基金基础","core":false},{"id":"s1-29-24","subject":1,"stem":"某股份制商业银行，在一个小县城新开设了营业网点，为了吸引更多客户前来选购基金产品，开展了以下宣传推广活动，其中符合基金销售费用规范的是（ ）。","options":["客户现场购买，发放现金红包","当日购买基金，手续费先收再返","买基金，送保险","网银申购基金，手续费8折优惠"],"answer":3,"explanation":"基金销售机构在基金销售活动中，不得有下列行为：（1）在签订销售协议或销售基金的活动中进行商业贿赂。（2）以排挤竞争对手为目的，压低基金的收费水平。（3）未经公告擅自变更向基金投资人的收费项目或收费标准，或通过先收后返.财务处理等方式变相降低收费标准。（4）采取抽奖.回扣或者送实物\n.保险.基金份额等方式销售基金。（5）其他违反法律.行政法规的规定，扰乱行业竞争秩序的行为。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":24,"origin":"资料模拟题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-29-30","subject":1,"stem":"基金从业人员客户至上的道德规范的基本要求是（ ）。","options":["依客户利益行事","优先满足客户利益","公平对待所有客户","以上都是"],"answer":3,"explanation":"客户至上，是指基金从业人员的执业活动应一切从投资人的根本利益出发。其基本含义有两点：一是客户利益优先，二是公平对待客户。客户利益优先是指当客户的利益与机构的利益.从业人员个人的利益相冲突时，要优先满足客户的利益；公平对待客户是指当不同客户之间的利益发生冲突时，要公平对待所有客户的利益。知识点：掌握客户至上的含义及基本要求；","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":30,"origin":"资料模拟题","lesson":"a08","topic":"职业道德","core":false},{"id":"s1-29-31","subject":1,"stem":"基金职业道德修养的途径是（ ）。","options":["正确树立基金职业道德观念","深刻领会基金职业道德规范","积极参加基金职业道德实践","以上都是"],"answer":3,"explanation":"基金职业道德修养的方法：1.正确树立基金职业道德观念2.深刻领会基金职业道德规范3.积极参加基金职业道德实践知识点：理解基金职业道德教育与修养的内容与途径；","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":31,"origin":"资料模拟题","lesson":"a06","topic":"职业道德","core":false},{"id":"s1-29-37","subject":1,"stem":"专业投资者之外的投资者为普通投资者，普通投资者在（ ）等方面享有特别保护。","options":["信息告知","风险警示","适当性匹配","以上都是"],"answer":3,"explanation":"专业投资者之外的投资者为普通投资者。普通投资者在信息告知.风险警示.适当性匹配等方面享有特别保护。知识点：掌握普通投资者与专业投资者的条件与相互转换：","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":37,"origin":"资料模拟题","lesson":"a11","topic":"销售与适当性","core":false},{"id":"s1-29-39","subject":1,"stem":"（ ）是非正常经营情况下的危机处理。","options":["操作风险","投资风险","业务风险","业务持续风险"],"answer":3,"explanation":"业务持续风险是非正常经营情况下的危机处理。知识点：掌握基金管理公司风险管理的风险分类和管理程序；","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":39,"origin":"资料模拟题","lesson":"a01","topic":"基金基础","core":false},{"id":"s1-29-40","subject":1,"stem":"合规独立性中，最重要的是（ ）。","options":["部门的独立性","机制的独立性","问责的独立性","以上都是"],"answer":0,"explanation":"合规独立性包括部门.机制和问责等独立性，其中，合规部门的独立性最为重要。知识点：掌握合规管理的基本概念；","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":40,"origin":"资料模拟题","lesson":"a16","topic":"监管与内控","core":false},{"id":"s1-29-42","subject":1,"stem":"基金销售人员从事销售活动的禁止性情形包括（ ）。","options":["引导投资者到基金管理公司的网上交易系统开户交易","征得投资者的同意后推介基金","默许他人以本人名义从事基金销售业务","提示投资者注意投资基金的风险"],"answer":2,"explanation":"基金销售人员从事基金销售活动的其他禁止性情形包括：(1)在销售活动中为自己或他人牟取不正当利益。(2)违规向他人提供基金未公开的信息。(3)诋毁其他基金.销售机构或销售人员。(4)散布虚假信息，扰乱市场秩序。(5)同意或默许他人以其本人或所在机构的名义从事基金销售业务。(6)违规接受投资者全权委托，直接代理客户进行基金认购.申购.赎回等交易。(7)违规对投资者做出盈亏承诺，或与投资者以口头或书面形式约定利益分成或亏损分担。(8)承诺利用基金资产进行利益输送。(9)以账外暗中给予他人财物或利益或接受他人给予的财物或利益等形式进行商业贿赂。(10)挪用投资者的交易资金或基金份额。(11)从事其他任何可能有损其所在机构和基金业声誉的行为。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":42,"origin":"资料模拟题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-29-43","subject":1,"stem":"开放式基金份额申购和赎回的资金清算依据（ ）进行。","options":["基金托管机构确认的数据","基金销售机构确认的数据","基金估值机构确认的数据","注册登记机构确认的数据"],"answer":3,"explanation":"由于基金申购和赎回的资金清算依据注册登记机构的确认数据进行，为保护基金投资人的利益，有关法规明确规定，基金管理人应当自收到投资者的申购(认购).赎回申请之日起3个工作日内，对该申购(认购\n).赎回申请的有效性进行确认。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":43,"origin":"资料模拟题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-29-44","subject":1,"stem":"在风险管理责任的划分上，（ ）是相应投资组合风险管理的第一责任人。","options":["业务部门负责人","员工","基金经理","董事会"],"answer":2,"explanation":"在风险管理责任的划分上，各业务部门负责人是其部门风险管理的第一责任人，基金经理是相应投资组合风险管理的第一责任人。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":44,"origin":"资料模拟题","lesson":"a16","topic":"监管与内控","core":false},{"id":"s1-29-46","subject":1,"stem":"基金管理公司的经理层人员应当按照公司章程.制度和业务流程的规定开展工作，下列做法正确的是（ \n）。","options":["某基金公司总经理看好某只股票，要求公司的基金经理买入","某新设基金公司的股东在权益投资方面具有强大优势，因此派出投资经理参与基金公司的具体投资活动","某基金经理出差，按照公司规定的流程临时授权另一基金经理代为管理基金的投资组合","某基金经理用基金财产多次与固定交易对手进行债券买卖，高买低卖"],"answer":2,"explanation":"经理层人员应当按照公司章程.制度和业务流程的规定开展工作，不得越权干预投资.研究.交易等具体业务活动，不得利用职务之便向股东.本人及他人进行利益输送。经理层人员应当公平对待所有股东，不得接受任何股东及其实际控制人超越股东会.董事会的指示，不得偏向于任何一方股东。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":46,"origin":"资料模拟题","lesson":"a01","topic":"基金基础","core":false},{"id":"s1-29-50","subject":1,"stem":"关于基金销售费用结构的内容，下列表述错误的是（ ）。","options":["为保证公平，基金管理人对选择前端收费方式的投资人要设置同一费率标准","基金管理人办理开放式基金份额的赎回，应当收取相应的赎回费","为鼓励长期持有，基金管理人对选择后端收费方式的投资人可以根据持有时间长短适当优惠","认购费和申购费可以采用前端收费方式，也可以采用后端收费方式"],"answer":0,"explanation":"前端收费方式下，基金管理人可以选择根据投资人申购金额分段设置申购费率。故A项说法错误","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":50,"origin":"资料模拟题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-29-51","subject":1,"stem":"关于货币市场基金的宣传推介，下列做法合规的是（ ）。","options":["基金销售机构单独摘选基金推介材料中基金管理人过往管理货币市场基金投资收益较高的数据，向投资人宣传","基金管理人可以向投资人承诺本金安全，但是不能承诺最低收益","基金管理人在基金推介材料中列明所管理货币市场基金的过往业绩","基金销售支付结算机构开展与货币市场基金相关的业务推广活动时，将货币市场基金与银行存款及其他产品的投资收益进行比较"],"answer":2,"explanation":"登载货币市场基金宣传推介材料的，不得片面引用或者修改其内容。故A项说法错误基金管理人应当在货币市场基金的招募说明书及宣传推介材料的显著位置列明，投资者购买货币市场基金并不等于将资金作为存款存放在银行或者存款类金融机构，基金管理人不保证基金一定盈利，也不保证最低收益。故B项说法错误基金销售支付结算机构等相关机构开展与货币市场基金相关的业务推广活动，应当事先征得合作基金管理人或者基金销售机构的同意，严格遵守相关法律法规的规定，不得混同.比较货币市场基金与银行存款及其他产品的投资收益。故D项说法错误","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":51,"origin":"资料模拟题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-29-53","subject":1,"stem":"有效的合规培训可以帮助基金管理人实现下列哪些目标（ ）。\nⅠ.降低运作风险\nⅡ.提高投资业绩\nⅢ.降低成本\nⅣ.避免投诉","options":["Ⅱ.Ⅳ","Ⅰ.Ⅲ","Ⅰ.Ⅱ.Ⅲ","Ⅰ.Ⅱ"],"answer":1,"explanation":"有效进行合规培训管理，通过一套完善的系统监控.跟踪和评估的流程，保证员工能够符合国家的法律和法规以及公司最新的合规政策.流程规范等，从而帮助公司全面实现既定目标，有效降低运作风险，并最终使合规培训成为基金管理人降低成本的关键。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":53,"origin":"资料模拟题","lesson":"a16","topic":"监管与内控","core":false},{"id":"s1-29-54","subject":1,"stem":"基金销售机构向普通投资者销售高风险产品或服务时，应当履行特别的注意义务，包括（ ）。\nⅠ.制定专门的工作程序\nⅡ.追加了解相关信息\nⅢ.告知特别的风险点\nⅣ.给予普通投资者更多的考虑时间\nⅤ.增加回访频次","options":["Ⅱ.Ⅲ.Ⅳ.Ⅴ","Ⅰ.Ⅱ.Ⅲ.Ⅳ.Ⅴ","Ⅰ.Ⅲ.Ⅳ.Ⅴ","Ⅰ.Ⅱ.Ⅲ.Ⅳ"],"answer":1,"explanation":"基金销售机构向普通投资者销售高风险产品或者提供相关服务，应当履行特别的注意义务，包括制定专门的工作程序，追加了解相关信息，告知特别的风险点，给予普通投资者更多的考虑时间，增加回访频次等。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":54,"origin":"资料模拟题","lesson":"a11","topic":"销售与适当性","core":false},{"id":"s1-29-55","subject":1,"stem":"关于基金销售人员的禁止性规范，下列表述错误的是（ ）。","options":["基金销售人员需要依法为投资者保守秘密，不得泄露投资者买卖及持有基金份额的信息","基金销售人员可向投资人客观陈述推介基金的过往业绩，但需表明过往业绩不预示基金的未来表现","基金销售人员不得擅自更改投资者的交易指令","基金销售人员在向投资者办理基金销售业务时，销售机构不得代扣或收取任何费用"],"answer":3,"explanation":"基金销售人员在向投资者办理基金销售业务时，应当按照基金合同.招募说明书和发行公告等销售法律文件的规定代扣或收取相关费用，不得收取其他额外费用，也不得对不同投资者违规收取不同费率的费用。故D项说法错误","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":55,"origin":"资料模拟题","lesson":"a09","topic":"职业道德","core":false},{"id":"s1-29-57","subject":1,"stem":"关于基金公司风险管理的目标，下列说法错误的是（ ）。","options":["不断提高公司经营管理和专业水平，提高对投资决策.经营管理中存在风险的警觉性，有效维护公司股东及基金投资者的利益","维护基金投资人的利益，为确保基金的份额持有人利益最大化，建立行之有效的风险控制制度，消除公司各环节的所有风险","严格遵守国家有关法律法规和公司各项规章制度，自觉形成守法经营.规范运作的经营思想和经营风格","建立行之有效的风险控制制度，确保公司各项业务的顺利运行，确保基金资产和公司财产的安全完整，确保公司取得长期稳定的发展"],"answer":1,"explanation":"基金公司风险管理的目标有以下几个方面：(1)严格遵守国家有关法律法规和公司各项规章制度，自觉形成守法经营.规范运作的经营思想和经营风格。维护基金投资人的利益，在风险最小化的前提下，确保基金份额持有人利益最大化。(2)不断提高公司经营管理和专业水平，提高对投资决策.经营管理中存在风险的警觉性，有效维护公司股东及基金投资者的利益。(3)建立行之有效的风险控制制度，确保公司各项业务的顺利运行，确保基金资产和公司财产的安全完整，确保公司取得长期稳定的发展。(4)维护公司信誉，树立良好的公司形象，及时.高效地配合监管部门的工作。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":57,"origin":"资料模拟题","lesson":"a16","topic":"监管与内控","core":false},{"id":"s1-29-59","subject":1,"stem":"在基金管理公司的各项内部控制制度中，下列应明确内控目标.内控原则.控制环境及内控措施等内容的是（ ）。","options":["部门业务规章","业务操作手册","基本管理制度","内部控制大纲"],"answer":3,"explanation":"公司内部控制大纲是对公司章程规定的内控原则的细化和展开，是各项基本管理制度的纲要和总揽。内部控制大纲应当明确内控目标.内控原则.控制环境.内控措施等内容。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":59,"origin":"资料模拟题","lesson":"a17","topic":"监管与内控","core":false},{"id":"s1-29-61","subject":1,"stem":"关于基金产品的风险评价，下列表述正确的是（ ）。","options":["由基金评级与评价机构提供基金产品风险评价服务的，基金销售机构应当要求服务方提供基金产品风险评价方法及其说明","基金销售机构不能对基金产品进行风险评价","根据基金业协会发布的《基金募集机构投资者适当性管理实施指引(试行)》，基金产品的风险等级至少分为四个等级","基金产品风险评价结果不能作为销售机构向基金投资人推介基金产品的重要依据"],"answer":0,"explanation":"对基金产品的风险评价，可以由基金销售机构的特定部门完成，也可以由第三方的基金评级与评价机构提供。B项说法错误根据基金业协会发布的《基金募集机构投资者适当性管理实施指引(试行)》，其产品至少分为五个等级：R1.R2.R3.R4和R5。C项说法错误基金产品风险评价结果应当作为基金销售机构向基金投资人推介基金产品的重要依据。D项说法错误","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":61,"origin":"资料模拟题","lesson":"a11","topic":"销售与适当性","core":false},{"id":"s1-29-66","subject":1,"stem":"以下哪种类型的混合基金中股票与债券的配置比例大致均衡（ ）。","options":["股债平衡型基金","偏股型基金","偏债型基金","灵活配置型基金"],"answer":0,"explanation":"股债平衡型基金股票与债券的配置比例较为均衡，其业绩比较基准也会以股票指数和债券指数大致均衡组合。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":66,"origin":"资料模拟题","lesson":"a01","topic":"基金基础","core":false},{"id":"s1-29-69","subject":1,"stem":"关于督察长的工作，下列描述错误的是（ ）。","options":["督察长可对内部控制制度执行情况提出建议","督察长就内部控制制度的执行情况进行检查.评价","督察长在日常工作中调阅公司文档，须董事会单独授权","督察长应当定期或者不定期向全体董事报送工作报告"],"answer":2,"explanation":"督察长享有充分的知情权和独立的调查权。督察长根据履行职责的需要，有权参加或者列席公司董事会以及公司业务.投资决策.风险管理等相关会议，有权调阅公司相关文件.档案。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":69,"origin":"资料模拟题","lesson":"a17","topic":"监管与内控","core":false},{"id":"s1-29-71","subject":1,"stem":"境内个人基金投资者开立基金账户出示的有效身份证件原件不包括（ ）。","options":["居民身份证","护照","文职证","驾驶证"],"answer":3,"explanation":"境内个人基金投资者开立基金账户时需要出示有效身份证件原件，提供复印件(身份证件包括中华人民共和国居民身份证.中华人民共和国护照.军官证.士兵证.文职证及警官证)。除上述明确列举的有效身份证件以外，投资者提交其他证件的，由注册登记机构最后认定其是否有效。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":71,"origin":"资料模拟题","lesson":"a01","topic":"基金基础","core":false},{"id":"s1-29-72","subject":1,"stem":"（ ）是基金销售机构向基金投资人推介基金产品的重要依据。","options":["基金产品风险评价结果","基金经理过往从业经历","基金产品过往业绩","基金产品现有规模"],"answer":0,"explanation":"基金产品风险评价结果应当作为基金销售机构向基金投资人推介基金产品的重要依据。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":72,"origin":"资料模拟题","lesson":"a11","topic":"销售与适当性","core":false},{"id":"s1-29-73","subject":1,"stem":"下列关于我国开放式基金赎回的说法中，错误的是（ ）。","options":["必须以金额赎回方式进行","T日的赎回申请通常在T+1日确认","赎回与认购渠道一样","采取份额赎回的方式"],"answer":0,"explanation":"我国开放式基金采用“金额申购.份额赎回”原则。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":73,"origin":"资料模拟题","lesson":"a13","topic":"销售与适当性","core":false},{"id":"s1-29-74","subject":1,"stem":"QDII基金管理人和托管人可能会聘请（ ）为其境外证券投资提供咨询和组合管理服务，（ ）负责境外资产托管业务。","options":["境外投资顾问；境内托管人","境外投资顾问；境外托管人","境内投资顾问；境内托管人","境内投资顾问；境外托管人"],"answer":1,"explanation":"与普通基金仅投资境内证券不同，QDII基金将其全部或部分资金投资于境外证券，基金管理人可能会聘请境外投资顾问为其境外证券投资提供咨询或组合管理服务，基金托管人可能会委托境外资产托管人负责境外资产托管业务。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":74,"origin":"资料模拟题","lesson":"a05","topic":"基金基础","core":false},{"id":"s1-29-76","subject":1,"stem":"下列关于私募基金募集和转让的有关规定，说法错误的是（ ）。","options":["私募基金管理人不得委托第三方对私募基金进行风险测评","私募基金管理人和销售机构应当要求私募基金投资人签署风险揭示书","私募基金投资者应当对其填写的风险承担能力问卷的准确性负责","私募基金投资者不得向合格投资者之外的机构或个人拆分转让"],"answer":0,"explanation":"私募基金管理人自行销售或者委托销售机构销售私募基金，应当自行或者委托第三方机构对私募基金进行风险评级，向风险识别能力和风险承担能力相匹配的投资者推介私募基金。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":76,"origin":"资料模拟题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-29-77","subject":1,"stem":"基金销售机构在对基金投资进行跟踪与评价时，要求建立异常交易的监控.记录和报告制度，重点是关注基金销售业务中的（ ）行为。","options":["异常交易","紧急交易","正常交易","反馈业务"],"answer":0,"explanation":"基金投资跟踪与评价的核心是对基金销售业务以及人际关系的维护应当建立异常交易的监控.记录和报告制度，重点关注基金销售业务中的异常交易行为，除此之外还应当具体应当：①积极为投资者提供售后服务，回访投资者，解答投资者的疑问；②对客户进行调查，征询客户对已使用产品和服务的满意程度，在调查中注意新发现的问题以及改正产品与服务的机会；③制定完善的业务流程与销售人员职业操守评价制度，建立应急处理措施的管理制度。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":77,"origin":"资料模拟题","lesson":"a12","topic":"销售与适当性","core":false},{"id":"s1-29-87","subject":1,"stem":"以下属于指数基金特点的是（ ）。\nI收益稳定\nⅡ费用低廉\nⅢ分散风险\nIV监控便利","options":["I.II.Ⅲ","II.Ⅲ.IV","II.Ⅲ","I.Ⅲ.IV"],"answer":1,"explanation":"指数基金具有客观稳定.费用低廉.分散风险.监控便利等特点，近年来发展十分迅速。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":87,"origin":"资料模拟题","lesson":"a04","topic":"基金基础","core":false},{"id":"s1-29-88","subject":1,"stem":"某基金经理的下列行为违反诚实守信要求的是（ ）。","options":["目标公司股票高度集中，流通股票比例少，股价较低，于是大量买入以待股价高涨","在公开论坛上，使用自己的微博大V账号发表目标公司的收入趋势分析","参加目标公司相关公开活动，关注目标公司高管的公开访谈，依据收集的公开信息进行投资决策","目标公司股票市值小，当发现有大的同业基金进入时，就打压股价，等对方卖出时再低价买入"],"answer":3,"explanation":"基金业是个竞争激烈的行业，同业同行间应当如何展开竞争，直接关系同业同行间的诚信，关系基金市场的秩序和基金行业的社会形象。诚实守信规范要求基金从业人员不得进行不正当竞争，不得以排挤竞争对手为目的，压低基金的收费水平，低于基金销售成本销售基金；不得采取抽奖.回扣或者赠送实物.保险\n.基金份额等方式销售基金。","sourceId":29,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷一.pdf","sourceNumber":88,"origin":"资料模拟题","lesson":"a06","topic":"职业道德","core":false},{"id":"s1-31-2","subject":1,"stem":"基金公司应该实行逐级授权制度，总经理的授权由（ ）授予。","options":["董事会","监事长","监事会","董事长"],"answer":0,"explanation":"基金公司应该实行逐级授权制度，总经理的权限由董事会授予，部门经理的权限由总经理授予，部门内人员的权限由部门经理授予。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":2,"origin":"资料模拟题","lesson":"a01","topic":"基金基础","core":false},{"id":"s1-31-3","subject":1,"stem":"控制环境是构成公司内部控制的基础，良好的控制环境有利于公司制度的有效执行，以下不属于内部控制环境内容的是（ ）。","options":["经营理念和内控文化","公司技术系统","公司治理结构","员工道德素质"],"answer":1,"explanation":"控制环境构成公司内部控制的基础，控制环境包括经营理念和内控文化、公司治理结构、组织结构、员工道德素质等内容。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":3,"origin":"资料模拟题","lesson":"a06","topic":"职业道德","core":false},{"id":"s1-31-5","subject":1,"stem":"下列关于职业道德的表述，正确的是（ ）。","options":["职业道德有助于增强企业凝聚力，但无助于促进行业发展","职业道德有助于提高从业人员道德观，但无助于其树立正确的世界观，人生观和价值观","职业道德有助于调整从业人员和服务对象之间的关系以及从业人员的内部关系","职业道德有助于提升道德素养，但无助于提高从业人员业务能力"],"answer":2,"explanation":"本题考查的是职业道德的作用。职业道德不仅调整从业人员的内部关系，加强职业内部人员的凝聚力；而且它也调整从业人员与其服务对象之间的关系，用以塑造本职业从业人员的形象。加强职业道德建设，可以帮助从业人员树立正确的世界观、人生观、价值观和道德观，全面提高从业人员的思想道德品质，逐步形成“为客户服务，对单位负责，为行业争光”的职业道德风尚，进而提高行业服务质量，促进行业健康发展。“无助于促进行业发展”和“无助于其树立正确的世界观，人生观和价值观”说法错误。职业素质既包括专业技能，也包括道德素养。加强职业道德建设有助于从业人员职业素质的提高。各个行业的快速健康发展，不仅需要具备较高业务素质的人才，更需要具有良好道德素养的从业人员。“无助于提高从业人员业务能力”说法错误。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":5,"origin":"资料模拟题","lesson":"a06","topic":"职业道德","core":false},{"id":"s1-31-16","subject":1,"stem":"基金公司合规管理部门基本职责包括（ ）。\nⅠ、积极主动识别和评估与基金管理人经营活动相关的合规风险\nⅡ、审核评价基金管理人各项政策、程序和操纵指南的合规性\nⅢ、制定并执行风险为本的合规管理计划\nⅣ、组织制定合规管理程序及合规手册","options":["Ⅰ、Ⅱ、Ⅲ、Ⅳ","Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅲ","Ⅱ、Ⅳ"],"answer":0,"explanation":"本题考查合规管理部门的责任。合规管理部门需要制定并执行风险为本的合规管理计划，审核评价基金管理人各项政策、程序和操作指南的合规性，组织制定合规管理程序以及合规手册、员工行为准则等合规指南，积极主动地识别和评估与基金管理人经营活动相关的合规风险等。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":16,"origin":"资料模拟题","lesson":"a07","topic":"职业道德","core":false},{"id":"s1-31-18","subject":1,"stem":"A是具有基金销售业务资格的商业银行，B是A银行控股的公募基金管理公司，在A与B建立销售合作关系之前，以下做法正确的是（ ）。","options":["A不必对B进行审慎调查，B应当对A进行审慎调查","A不必对B进行审慎调查，B也不必对A进行审慎调查","A与B应当相互进行审慎调查","A应当对B进行审慎调查，B不必对A进行审慎调查"],"answer":2,"explanation":"对销售协议的签订进行合规审核，对销售机构签约前进行审慎调查，严格选择合作的基金销售机构。基金销售的适用性要求基金管理人和基金代销机构相互进行审慎调查。A是具有基金销售业务资格的商业银行，B是A银行控股的公募基金管理公司，A与B应当相互进行审慎调查。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":18,"origin":"资料模拟题","lesson":"a06","topic":"职业道德","core":false},{"id":"s1-31-20","subject":1,"stem":"在基金管理人加强合规文化建设过程中，以下各项中重要性排序相对靠后的是（ ）。","options":["加强合规管理部门与业务部门、监管稽核部门等各部门之间的信息交流","有效落实合规考核机制","加强管理层对合规文化建设工作的重视程度","引导并加强其他外部合作机构的合规经营意识"],"answer":3,"explanation":"基金管理人加强合规文化建设，还应在以下四个方面努力：\n一是基金管理人管理层对合规文化建设工作足够重视。\n\n二是加强合规管理部门与业务部、监察稽核部等各部门之间的信息交流和良好的互动性，实现资源、共享。三是有效落实合规考核机制。四是积极推行全员合规理念，加强合规文化思想教育。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":20,"origin":"资料模拟题","lesson":"a16","topic":"监管与内控","core":false},{"id":"s1-31-22","subject":1,"stem":"下列关于道德与法律的调整范围的表述，错误的是（ ）。","options":["道德可以调整人们内在的精神世界和心理动机","法律调整的范围不如道德调整的范围广泛","法律的调整对象侧重于人们的外在行为和结果的合法化","法律的调整对象包括人们的思想和动机"],"answer":3,"explanation":"道德调整的范围比法律调整的范围更为广泛。法律调整的对象侧重于人们的外在行为和结果的合法化，具有较强的客观性，人们的思想和动机不是法律调整的对象；而道德不仅要调整人们的外在行为和结果，还要调整人们内在的精神世界和心理动机。","sourceId":31,"source":"2025年基金从业资格《基金法律法规、职业道德与业务规范》预测试卷二.pdf","sourceNumber":22,"origin":"资料模拟题","lesson":"a06","topic":"职业道德","core":false},{"id":"s1-31-23","subject":1,"stem":"关于提高基金职业道德修养的途径和方法，以下说法错误的是（ ）。","options":["基金职业道德修养的具体内容是基金职业道德规范","基金职业道德修养要求从业人员积极参加职业道德实践","正确的基金职业道德观念是提高职业道德修养的内在动力","职业道德修养他律比自律更加重要"],"answer":3,"explanation":"任何一个从业人员职业道德素质的提高，一方面靠他律，即社会的培养和组织的教育；另一方面就取决于自己的主观努力，即自我修养，也就是自律。两个方面缺一不可，而且后者更加重要。故“职业道德修养他律比自律更加重要”错误。基金职业道德修养，是指基金从业人员通过主动自觉地自我学习、自我改造、自我完善，将基金职业道德外在的职业行为规范内化为内在的职业道德情感、认知和信念，使自己形成良好的职业道德品质和达到一定的职业道德境界。故“具体内容是基金职业道德规范”正确。实践树立基金职业道德观
